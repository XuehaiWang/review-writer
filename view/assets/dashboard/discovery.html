<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Topic Discovery</title>
  <style>
    :root {
      --ink: #1b241f;
      --muted: #69756d;
      --panel: #fffaf0;
      --line: #dacdb8;
      --green: #1f6b55;
      --orange: #bd6b35;
      --red: #9f3b36;
      --shadow: 0 18px 46px rgba(55, 43, 24, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(31,107,85,.16), transparent 24rem),
        radial-gradient(circle at 84% 16%, rgba(189,107,53,.16), transparent 28rem),
        linear-gradient(135deg, #f1e7d3, #fbf7ec 48%, #eadcc4);
      font-family: Georgia, "Times New Roman", serif;
      height: 100vh;
      overflow: hidden;
    }
    body.page-discovery {
      display: flex;
      flex-direction: column;
    }
    body.page-discovery > .nav,
    body.page-discovery > .stage-strip { flex: 0 0 auto; }
    html body.page-discovery > main.app {
      flex: 1 1 auto;
      height: auto !important;
      min-height: 0;
    }
    button, input, select, textarea { font: inherit; }
    .nav {
      height: 58px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,250,240,.92);
      border-bottom: 1px solid var(--line);
      gap: 12px;
    }
    .nav-title { font-weight: 700; font-size: 18px; }
    .nav-center { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; justify-content: center; }
    .nav-right { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .nav a {
      display: inline-block;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fffdf7;
      white-space: nowrap;
      font-size: 14px;
    }
    .nav a.active { background: var(--green); border-color: var(--green); color: white; }
    .project-select {
      min-width: 280px;
      max-width: 520px;
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 999px;
      padding: 8px 12px;
      outline: none;
    }
    .app {
      height: calc(100vh - 58px);
      display: grid;
      grid-template-columns: minmax(320px, 360px) minmax(380px, 430px) minmax(480px, 1fr);
      gap: 14px;
      padding: 14px;
    }
    .panel {
      background: rgba(255,250,240,.94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .head { padding: 16px; border-bottom: 1px solid var(--line); }
    h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
    h1 { font-size: 23px; }
    h2 { font-size: 18px; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .toolbar, .detail-tabs {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .new-discovery {
      padding: 12px;
      display: grid;
      gap: 8px;
      max-height: min(48vh, 440px);
      overflow-y: auto;
    }
    .new-discovery-shell { flex: 0 1 auto; border-bottom: 1px solid var(--line); background: rgba(255,253,247,.72); }
    .new-discovery-shell > summary { cursor: pointer; padding: 6px 12px; color: var(--green); font-size: 13px; font-weight: 700; list-style-position: inside; }
    .new-discovery-shell[open] > summary { border-bottom: 1px solid rgba(218,205,184,.7); }
    .new-discovery label { color: var(--muted); font-size: 12px; }
    textarea {
      min-height: 76px;
      resize: vertical;
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 6px;
      padding: 9px 10px;
      outline: none;
    }
    .new-discovery input { width: 100%; }
    .new-actions { display: flex; gap: 8px; align-items: center; }
    .new-actions .btn { flex: 1; }
    .new-options { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .new-options input { min-width: auto; }
    .run-status { color: var(--muted); font-size: 12px; line-height: 1.35; white-space: pre-wrap; }
    input, select {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 999px;
      padding: 8px 11px;
      outline: none;
      min-width: 0;
    }
    .btn, .tab {
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      color: var(--ink);
    }
    .btn.primary, .tab.active { color: white; background: var(--green); border-color: var(--green); }
    .btn.orange { color: white; background: var(--orange); border-color: var(--orange); }
    .btn.red { color: white; background: var(--red); border-color: var(--red); }
    .list, .results { overflow: auto; padding: 9px; min-height: 0; }
    .list { flex: 1 1 auto; }
    .discovery-sidebar .head { padding: 12px 13px 10px !important; }
    .discovery-sidebar .list { min-height: 170px; overscroll-behavior: contain; }
    .discovery-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      margin-top: 8px;
    }
    .stat-card { min-width: 0; min-height: 54px; padding: 7px 5px; border: 1px solid rgba(218,205,184,.85); border-radius: 10px; background: #fffdf7; }
    .stat-value { display: block; color: var(--green); font: 700 16px/1.05 Georgia,serif; }
    .stat-label { display: block; margin-top: 3px; color: var(--muted); font: 10px/1.15 Arial,sans-serif; overflow-wrap: anywhere; }
    .sidebar-controls { flex: 0 0 auto; padding: 7px 9px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
    .sidebar-project-row, .sidebar-filter-row, .sidebar-action-row { display: grid; gap: 6px; min-width: 0; }
    .sidebar-project-row { grid-template-columns: minmax(0, 1fr) auto; }
    .sidebar-filter-row { grid-template-columns: minmax(0, 1fr) minmax(125px, .8fr); }
    .sidebar-action-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sidebar-controls select, .sidebar-controls input, .sidebar-controls .btn { width: 100%; }
    .sidebar-controls select, .sidebar-controls input, .sidebar-controls .btn { padding-top: 7px; padding-bottom: 7px; }
    .keyword-section-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px 3px; }
    .keyword-section-head strong { font-size: 13px; }
    .keyword-section-head span { color: var(--muted); font-size: 11px; }
    .card, .result {
      background: #fffdf7;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 11px;
      margin-bottom: 8px;
      color: var(--ink);
    }
    .card {
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .card:hover, .card.active { border-color: var(--green); background: #f2faf0; }
    .result { position: relative; cursor: pointer; transition: border-color .16s ease, background .16s ease, box-shadow .16s ease, transform .16s ease; }
    .result:hover { border-color: #8bb4a9; background: #f7fcf9; transform: translateY(-1px); }
    .result.active { border-color: var(--green); background: linear-gradient(135deg, #eef9f5, #fffdf7); box-shadow: 0 0 0 2px rgba(30,106,88,.12), 0 6px 16px rgba(30,106,88,.08); }
    .result:focus-visible { border-color: var(--green); outline: 3px solid rgba(30,106,88,.18); outline-offset: 2px; }
    .result-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .result-heading .r-title { min-width: 0; }
    .selected-indicator { flex: 0 0 auto; padding: 4px 8px; color: #fff; border-radius: 999px; background: var(--green); font: 700 10px/1 Arial,sans-serif; white-space: nowrap; }
    .result-hint { display: block; margin-top: 8px; color: #4d766c; font-size: 11px; }
    .card.deleted, .result.drop { opacity: .55; background: #f5eadf; }
    .result.drop.active { opacity: .78; border-color: #9b6957; box-shadow: 0 0 0 2px rgba(155,105,87,.11); }
    .k-title, .r-title { font-weight: 700; font-size: 15px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.35; }
    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e4efe4;
      color: #285a37;
      margin: 5px 4px 0 0;
    }
    .pill.web { background: #e4ebf4; color: #254c74; }
    .r-actions { margin-top: 10px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .detail-body { flex: 1; min-height: 0; overflow: auto; background: #fffdf7; }
    iframe { width: 100%; height: 100%; border: 0; background: white; }
    pre {
      margin: 0;
      padding: 16px;
      white-space: pre-wrap;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .markdown {
      height: 100%;
      overflow: auto;
      padding: 28px 34px;
      background: #fffdf7;
      line-height: 1.58;
      font-size: 16px;
    }
    .markdown img { max-width: 100%; border: 1px solid var(--line); border-radius: 10px; }
    .markdown table {
      border-collapse: collapse;
      width: max-content;
      max-width: 100%;
      margin: 18px 0;
      background: white;
      font-size: 13px;
      line-height: 1.35;
      display: block;
      overflow-x: auto;
    }
    .markdown th, .markdown td {
      border: 1px solid #cfc2aa;
      padding: 7px 9px;
      vertical-align: top;
      min-width: 72px;
    }
    .markdown th, .markdown tr:first-child td {
      background: #efe6d4;
      font-weight: 700;
    }
    .markdown details {
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbf4e5;
    }
    .markdown summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--green);
    }
    .markdown .math {
      font-family: "Times New Roman", Georgia, serif;
      white-space: nowrap;
    }
    .markdown .caption {
      margin: 16px 0 8px;
      font-weight: 700;
      color: #4d3923;
    }
    .markdown .raw-block {
      margin: 12px 0;
    }
    .summary {
      padding: 16px;
      line-height: 1.45;
    }
    .message {
      position: fixed;
      right: 18px;
      bottom: 18px;
      padding: 11px 15px;
      border-radius: 12px;
      background: #15251f;
      color: white;
      box-shadow: var(--shadow);
      display: none;
      max-width: 420px;
    }
    .message.show { display: block; }
    #projectInfo {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .icon-btn { min-width: 36px; padding: 8px 10px; font-size: 18px; line-height: 1; }
    @media (max-width: 900px) {
      body { height: auto; min-height: 100dvh; overflow: auto; }
      .nav { height: auto; flex-wrap: wrap; }
      .nav-center { order: 3; flex-basis: 100%; justify-content: stretch; }
      .project-select { width: 100%; min-width: 0; max-width: none; }
      .nav-right { justify-content: flex-start; }
      .app { height: auto; grid-template-columns: 1fr; padding: 10px; }
      .panel { min-height: 500px; }
      .app > .panel:first-child { height: calc(100dvh - 180px); }
    }

  <script src="/assets/dashboard/review-ui.js?v=20260805d"></script>
  <script>
    let projects = [], selected = null, data = null, selectedKeyword = null, selectedPaper = null, detailRequestToken = 0;
    const requestedParams = new URLSearchParams(window.location.search);
    const requestedProject = requestedParams.get('project') || '';
    const createRequested = requestedParams.get('create') === '1';
    const els = {
      globalProjectSelect: document.getElementById('globalProjectSelect'),
      projectInfo: document.getElementById('projectInfo'), discoveryStats: document.getElementById('discoveryStats'), projectSelect: document.getElementById('projectSelect'),
      keywordGroupCount: document.getElementById('keywordGroupCount'),
      keywordList: document.getElementById('keywordList'), keywordFilter: document.getElementById('keywordFilter'), centerFilter: document.getElementById('centerFilter'),
      keywordTitle: document.getElementById('keywordTitle'), keywordMeta: document.getElementById('keywordMeta'),
      results: document.getElementById('results'), detailTitle: document.getElementById('detailTitle'),
      detailMeta: document.getElementById('detailMeta'), summary: document.getElementById('summary'),
      pdfFrame: document.getElementById('pdfFrame'), markdown: document.getElementById('markdown'),
      metadata: document.getElementById('metadata'), message: document.getElementById('message'),
      newProjectId: document.getElementById('newProjectId'), newTopic: document.getElementById('newTopic'),
      newKeywords: document.getElementById('newKeywords'), newWebSearch: document.getElementById('newWebSearch'),
      runDiscoveryBtn: document.getElementById('runDiscoveryBtn'), runStatus: document.getElementById('runStatus')
    };
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function msg(text) { els.message.textContent = text; els.message.classList.add('show'); setTimeout(() => els.message.classList.remove('show'), 2600); }
    function simpleMathToHtml(expr) {
      let s = String(expr ?? '');
      s = s.replace(/\\mathrm\s*\{\s*([^{}]+?)\s*\}/g, '$1');
      s = s.replace(/\\prime/g, '′');
      s = s.replace(/\\[a-zA-Z]+/g, '');
      s = s.replace(/\s+/g, ' ').trim();
      s = esc(s);
      s = s.replace(/_\s*\{\s*([^{}]+?)\s*\}/g, '<sub>$1</sub>');
      s = s.replace(/\^\s*\{\s*([^{}]+?)\s*\}/g, '<sup>$1</sup>');
      s = s.replace(/_([A-Za-z0-9′+-]+)/g, '<sub>$1</sub>');
      s = s.replace(/\^([A-Za-z0-9′+-]+)/g, '<sup>$1</sup>');
      return `<span class="math">${s}</span>`;
    }
    function renderInline(text) {
      const parts = String(text ?? '').split(/(\$[^$\n]+\$)/g);
      return parts.map(part => {
        if (part.startsWith('$') && part.endsWith('$')) return simpleMathToHtml(part.slice(1, -1));
        return esc(part);
      }).join('');
    }
    function sanitizeAllowedHtml(raw) {
      const allowedTags = new Set(['DIV','DETAILS','SUMMARY','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','CAPTION','P','BR','B','STRONG','I','EM','SUB','SUP','SPAN','IMG']);
      const template = document.createElement('template');
      template.innerHTML = raw;
      const walk = node => {
        if (node.nodeType === Node.TEXT_NODE) {
          const span = document.createElement('span');
          span.innerHTML = renderInline(node.textContent || '');
          node.replaceWith(...Array.from(span.childNodes));
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (!allowedTags.has(node.tagName)) {
          const text = document.createTextNode(node.textContent || '');
          node.replaceWith(text);
          return;
        }
        [...node.attributes].forEach(attr => {
          const name = attr.name.toLowerCase();
          if (!['colspan', 'rowspan', 'open', 'class', 'src', 'alt'].includes(name)) node.removeAttribute(attr.name);
          if (name === 'src' && !String(attr.value || '').startsWith('/file?')) node.removeAttribute(attr.name);
        });
        [...node.childNodes].forEach(walk);
      };
      [...template.content.childNodes].forEach(walk);
      return template.innerHTML;
    }
    function renderMarkdown(md, paperId) {
      const blocks = [];
      const stash = html => {
        const key = `@@HTML_BLOCK_${blocks.length}@@`;
        blocks.push(sanitizeAllowedHtml(html));
        return key;
      };
      let text = String(md ?? '');
      text = text.replace(/<details[\s\S]*?<\/details>/gi, match => stash(`<div class="raw-block">${match}</div>`));
      text = text.replace(/<table[\s\S]*?<\/table>/gi, match => stash(match));
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, path) => {
        const src = `/file?paper_id=${encodeURIComponent(paperId || '')}&path=${encodeURIComponent(path)}`;
        return stash(`<img alt="${esc(alt)}" src="${src}">`);
      });
      const html = text.split(/\n{2,}/).map(rawBlock => {
        const block = rawBlock.trim();
        if (!block) return '';
        const marker = block.match(/^@@HTML_BLOCK_(\d+)@@$/);
        if (marker) return blocks[Number(marker[1])] || '';
        let m = block.match(/^###\s+(.+)$/);
        if (m) return `<h3>${renderInline(m[1])}</h3>`;
        m = block.match(/^##\s+(.+)$/);
        if (m) return `<h2>${renderInline(m[1])}</h2>`;
        m = block.match(/^#\s+(.+)$/);
        if (m) return `<h1>${renderInline(m[1])}</h1>`;
        if (/^(Scheme|Table|Figure)\s+\d+/i.test(block)) return `<div class="caption">${renderInline(block).replace(/\n/g, '<br>')}</div>`;
        return `<p>${renderInline(block).replace(/\n/g, '<br>')}</p>`;
      }).join('\n');
      return html.replace(/@@HTML_BLOCK_(\d+)@@/g, (_, i) => blocks[Number(i)] || '');
    }
    async function loadProjects() {
      projects = (await (await fetch('/api/projects')).json()).filter(p => p.has_discovery);
      els.globalProjectSelect.innerHTML = projects.map(p => `<option value="${esc(p.project_id)}">${esc(p.project_id)}</option>`).join('');
      els.projectSelect.innerHTML = projects.map(p => `<option value="${esc(p.project_id)}">${esc(p.project_id)}</option>`).join('');
      if (projects.length) {
        selected = projects.find(p => p.project_id === requestedProject)?.project_id || projects[0].project_id;
        els.projectSelect.value = selected;
        els.globalProjectSelect.value = selected;
        await loadProject(selected);
      }
      else { els.projectInfo.textContent = 'No discovery projects found.'; }
    }
    async function startDiscovery() {
      const payload = {
        project_id: els.newProjectId.value.trim(),
        topic: els.newTopic.value.trim(),
        keywords: els.newKeywords.value.trim(),
        web_search: els.newWebSearch.checked
      };
      if (!payload.project_id) {
        els.runStatus.textContent = 'Enter a project ID before running discovery.';
        els.newProjectId.focus();
        msg('Project ID is required.');
        return;
      }
      if (!payload.topic) {
        els.runStatus.textContent = 'Enter a topic before running discovery.';
        els.newTopic.focus();
        msg('Topic is required.');
        return;
      }
      els.runDiscoveryBtn.disabled = true;
      els.runStatus.textContent = 'Searching local metadata...';
      try {
        const response = await fetch('/api/discovery', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const raw = await response.text();
        let result;
        try {
          result = raw ? JSON.parse(raw) : {};
        } catch (_) {
          result = {error: raw};
        }
        if (!response.ok || !result.ok) throw new Error(result.error || result.output || 'Discovery failed.');
        els.newProjectId.value = '';
        els.newTopic.value = '';
        els.newKeywords.value = '';
        els.newWebSearch.checked = false;
        await loadProjects();
        await loadProject(result.project_id);
        const stats = discoveryCounts(data);
        const externalText = stats.uniqueExternal ? ` and ${stats.uniqueExternal} unique external results` : '';
        els.runStatus.textContent = `Project ${result.project_id} is ready: found ${stats.candidateLocal} candidate papers (${stats.candidateHits} keyword hits)${externalText} across ${stats.keywordGroups} keyword groups. Selected for Matrix: ${stats.uniqueLocal}; include candidates to build the selection.`;
        msg('Discovery complete');
      } catch (error) {
        els.runStatus.textContent = error.message || 'Discovery failed.';
        msg(error.message || 'Discovery failed.');
      } finally {
        els.runDiscoveryBtn.disabled = false;
      }
    }
    async function loadProject(id) {
      selected = id;
      window.reviewUi?.setProject(id);
      data = await (await fetch(`/api/discovery/${encodeURIComponent(id)}`)).json();
      els.projectSelect.value = id;
      els.globalProjectSelect.value = id;
      selectedKeyword = data.results.find(g => g.keep !== false)?.keyword || data.results[0]?.keyword;
      selectedPaper = null;
      syncCategoryFilter();
      renderAll();
    }
    function categoryKey(group={}) {
      return String(group.category || 'General / Review').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'general';
    }
    function categoryLabel(group={}) { return String(group.category || 'General / Review').trim(); }
    function syncCategoryFilter() {
      const selectedValue = els.centerFilter.value || 'all';
      const categories = new Map();
      (data?.results || []).forEach(group => categories.set(categoryKey(group), categoryLabel(group)));
      els.centerFilter.innerHTML = '<option value="all">All categories</option>' + [...categories.entries()]
        .sort((a,b) => a[1].localeCompare(b[1]))
        .map(([value,label]) => `<option value="${esc(value)}">${esc(label)}</option>`).join('');
      els.centerFilter.value = categories.has(selectedValue) || selectedValue === 'all' ? selectedValue : 'all';
    }
    function currentGroup() { return data?.results?.find(g => g.keyword === selectedKeyword); }
    function candidateSelected(row) { return row?.selected_for_matrix === true && row?.role !== 'excluded'; }
    function discoveryCounts(source=data) {
      const allGroups = source?.results || [];
      const groups = allGroups.filter(group => group.keep !== false);
      const localRows = groups.flatMap(group => (group.local_results || []).filter(candidateSelected));
      const externalRows = groups.flatMap(group => (group.web_results || []).filter(row => row.keep !== false));
      const localKeys = localRows.map((row, index) => row.paper_id || (row.title ? `${row.title}|${row.year || ''}` : `local-${index}`));
      const externalKeys = externalRows.map((row, index) => row.doi || row.url || (row.title ? `${row.title}|${row.year || ''}` : `external-${index}`));
      const candidateLocalRows = allGroups.flatMap(group => group.local_results || []);
      const candidateLocalKeys = candidateLocalRows.map((row, index) => row.paper_id || (row.title ? `${row.title}|${row.year || ''}` : `candidate-${index}`));
      const configuredLibraryTotal = Number(source?.filter_stats?.after_filter ?? source?.filter_stats?.before_filter);
      return {
        uniqueLocal: new Set(localKeys).size,
        candidateLocal: new Set(candidateLocalKeys).size,
        candidateHits: candidateLocalRows.length,
        localHits: localRows.length,
        uniqueExternal: new Set(externalKeys).size,
        externalHits: externalRows.length,
        libraryTotal: Number.isFinite(configuredLibraryTotal) ? configuredLibraryTotal : new Set(localKeys).size,
        keywordGroups: groups.length
      };
    }
    function renderStats() {
      const stats = discoveryCounts(data);
      els.discoveryStats.innerHTML = [
        ['Selected papers', stats.uniqueLocal],
        ['Candidate papers', stats.candidateLocal],
        ['Keyword hits', stats.candidateHits],
        ['Keyword groups', stats.keywordGroups]
      ].map(([label, value]) => `<div class="stat-card"><span class="stat-value">${esc(value)}</span><span class="stat-label">${esc(label)}</span></div>`).join('');
      els.keywordGroupCount.textContent = `${stats.keywordGroups} active`;
    }
    function renderAll() { renderStats(); renderKeywords(); renderResults(); renderDetail(); }
    function renderKeywords() {
      const groups = data?.results || [];
      els.projectInfo.textContent = `${selected} · ${data?.topic || ''}`;
      const q = els.keywordFilter.value.toLowerCase();
      const center = els.centerFilter.value;
      els.keywordList.innerHTML = groups
        .filter(g => g.keyword.toLowerCase().includes(q))
        .filter(g => center === 'all' || categoryKey(g) === center)
        .map(g => `
        <button class="card ${selectedKeyword===g.keyword?'active':''} ${g.keep===false?'deleted':''}" data-keyword="${esc(g.keyword)}">
          <div class="k-title">${esc(g.keyword)}</div>
          <div class="meta">${esc(categoryLabel(g))}</div>
          <span class="pill">${(g.local_results||[]).filter(candidateSelected).length} selected</span>
          <span class="pill web">${(g.web_results||[]).filter(r=>r.keep!==false).length} external</span>
        </button>`).join('');
    }
    function renderResults() {
      const g = currentGroup();
      if (!g) { els.results.innerHTML = ''; return; }
      els.keywordTitle.textContent = g.keyword;
      els.keywordMeta.textContent = `${categoryLabel(g)} · keep=${g.keep !== false}`;
      const rows = [...(g.local_results||[]).map(r => ({...r, kind:'local'})), ...(g.web_results||[]).map((r,i) => ({...r, kind:'web', webIndex:i}))];
      els.results.innerHTML = rows.map(r => {
        const id = r.kind === 'local' ? r.paper_id : `web-${r.webIndex}`;
        const active = selectedPaper?.kind === r.kind && selectedPaper?.id === id;
        const selectedForMatrix = candidateSelected(r);
        const selectedLabel = r.kind === 'local' ? 'Included in Matrix' : 'Kept as external reference';
        const includeLabel = r.kind === 'local' ? 'Include in Matrix' : 'Keep as external reference';
        const removeLabel = r.kind === 'local' ? 'Remove from Matrix' : 'Remove external reference';
        return `<article class="result ${selectedForMatrix?'':'drop'} ${active?'active':''}" data-result-kind="${esc(r.kind)}" data-result-id="${esc(id)}" tabindex="0" aria-label="${esc(`View details: ${r.title || '(untitled)'}`)}" aria-current="${active?'true':'false'}">
          <div class="result-heading"><div class="r-title">${esc(r.title || '(untitled)')}</div>${selectedForMatrix?`<span class="selected-indicator">${selectedLabel}</span>`:active?'<span class="selected-indicator">Viewing</span>':''}</div>
          <div class="meta">${esc([r.paper_id, r.year, r.journal, `score=${r.score}`, (Array.isArray(r.sources) && r.sources.length) ? `source=${r.sources.join('+')}` : (r.source ? `source=${r.source}` : null)].filter(Boolean).join(' · '))}</div>
          <div class="meta">${esc(r.reason || '')} ${r.url ? `<a href="${esc(r.url)}" target="_blank">Open link</a>` : ''}</div>
          <div class="r-actions">
            <button type="button" class="btn ${selectedForMatrix?'red':'primary'}" data-action="toggle" data-kind="${r.kind}" data-id="${esc(id)}" aria-pressed="${selectedForMatrix?'true':'false'}">${selectedForMatrix?removeLabel:includeLabel}</button>
            ${r.kind==='local' ? `<select data-role="${esc(id)}">${['core_candidate','supporting_candidate','background','uncertain','excluded'].map(x=>`<option ${r.role===x?'selected':''}>${x}</option>`).join('')}</select>` : ''}
          </div>
          ${active?'<span class="result-hint">Details are displayed in the right panel.</span>':''}
        </article>`;
      }).join('');
    }
    function findRow(kind, id) {
      const g = currentGroup();
      if (kind === 'local') return (g.local_results || []).find(r => r.paper_id === id);
      return (g.web_results || [])[Number(id.replace('web-', ''))];
    }
    function setCandidateSelection(kind, id, selectedForMatrix) {
      if (kind === 'local') {
        (data?.results || []).forEach(group => (group.local_results || []).forEach(row => {
          if (row.paper_id === id) {
            row.selected_for_matrix = selectedForMatrix;
            if (selectedForMatrix && row.role === 'excluded') row.role = 'uncertain';
          }
        }));
        return;
      }
      const row = findRow(kind, id);
      if (row) row.selected_for_matrix = selectedForMatrix;
    }
    function setCandidateRole(id, role) {
      (data?.results || []).forEach(group => (group.local_results || []).forEach(row => {
        if (row.paper_id === id) {
          row.role = role;
          if (role === 'excluded') row.selected_for_matrix = false;
        }
      }));
    }
    function clearCandidateSelection() {
      (data?.results || []).forEach(group => {
        [...(group.local_results || []), ...(group.web_results || [])].forEach(row => {
          row.selected_for_matrix = false;
        });
      });
      renderAll();
    }
    async function renderDetail() {
      const requestToken = ++detailRequestToken;
      if (!selectedPaper) {
        els.detailTitle.textContent = 'Paper Detail';
        els.detailMeta.textContent = 'Select a paper result.';
        els.summary.innerHTML = '<p>Select a local or web paper to inspect.</p>';
        els.markdown.innerHTML = ''; els.metadata.textContent = ''; els.pdfFrame.src = 'about:blank';
        return;
      }
      const r = selectedPaper.row;
      els.detailTitle.textContent = r.title || '(untitled)';
      els.detailMeta.textContent = selectedPaper.kind === 'local' ? `${r.paper_id} · ${r.year || ''} · ${r.journal || ''}` : `${r.year || ''} · ${r.journal || ''}`;
      els.summary.innerHTML = `<h3>${esc(r.title)}</h3><p><strong>Score:</strong> ${esc(r.score)}</p><p><strong>Reason:</strong> ${esc(r.reason || '')}</p><p><strong>Role:</strong> ${esc(r.role || 'web_candidate')}</p>${r.url ? `<p><a href="${esc(r.url)}" target="_blank">Open web result</a></p>` : ''}`;
      if (selectedPaper.kind === 'local') {
        const meta = await (await fetch(`/api/local/metadata/${encodeURIComponent(r.paper_id)}`)).json();
        if (requestToken !== detailRequestToken) return;
        els.metadata.textContent = JSON.stringify(meta, null, 2);
        const md = await (await fetch(`/api/local/markdown/${encodeURIComponent(r.paper_id)}`)).text();
        if (requestToken !== detailRequestToken) return;
        els.markdown.innerHTML = renderMarkdown(md, r.paper_id);
        els.pdfFrame.src = meta.source_paths?.pdf ? `/file?path=${encodeURIComponent(meta.source_paths.pdf)}` : 'about:blank';
      } else {
        els.metadata.textContent = JSON.stringify(r, null, 2);
        els.markdown.innerHTML = '<p>No local Markdown for web result.</p>';
        els.pdfFrame.src = 'about:blank';
      }
    }
    async function save(confirm=false) {
      if (!selected) return;
      const button = confirm ? document.getElementById('confirmBtn') : document.getElementById('saveBtn');
      button.disabled = true;
      try {
        const res = await fetch(`/api/discovery/${encodeURIComponent(selected)}${confirm?'?confirm=1':''}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
        const raw = await res.text();
        let result = {};
        try { result = raw ? JSON.parse(raw) : {}; } catch (_) { result = {error: raw}; }
        if (!res.ok || !result.ok) throw new Error(result.error || 'Could not save Discovery.');
        if (confirm) {
          const count = result.matrix_sync?.selected_paper_count || 0;
          const expectedCount = discoveryCounts(data).uniqueLocal;
          if (!result.matrix_sync?.selection_current || count !== expectedCount) {
            throw new Error(`Matrix synchronization mismatch: selected ${expectedCount}, synchronized ${count}. Stay in Discovery and retry.`);
          }
          els.runStatus.textContent = `Discovery confirmed. ${count} selected papers were synchronized to Matrix.`;
          const fingerprint = result.matrix_sync?.selection_fingerprint || '';
          window.location.assign(`/matrix?project=${encodeURIComponent(selected)}&selection=${encodeURIComponent(fingerprint)}`);
          return;
        }
        msg('Saved');
        await loadProject(selected);
      } catch (error) {
        els.runStatus.textContent = error.message || 'Could not save Discovery.';
        msg(error.message || 'Could not save Discovery.');
      } finally {
        button.disabled = false;
      }
    }
    els.keywordList.addEventListener('click', e => { const card = e.target.closest('[data-keyword]'); if (card) { selectedKeyword = card.dataset.keyword; selectedPaper = null; renderAll(); } });
    els.results.addEventListener('click', async e => {
      const btn = e.target.closest('[data-action]');
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        const row = findRow(btn.dataset.kind, btn.dataset.id);
        if (row && btn.dataset.action === 'toggle') {
          const selectedForMatrix = !candidateSelected(row);
          setCandidateSelection(btn.dataset.kind, btn.dataset.id, selectedForMatrix);
          msg(selectedForMatrix ? 'Added to Matrix selection.' : 'Removed from Matrix selection.');
        }
        renderAll();
        return;
      }
      if (e.target.closest('a, select')) return;
      const card = e.target.closest('[data-result-kind]');
      if (!card) return;
      const row = findRow(card.dataset.resultKind, card.dataset.resultId);
      if (!row) return;
      selectedPaper = {kind: card.dataset.resultKind, id: card.dataset.resultId, row};
      renderResults();
      await renderDetail();
    });
    els.results.addEventListener('keydown', async e => {
      if (!['Enter', ' '].includes(e.key) || e.target.closest('button, a, select')) return;
      const card = e.target.closest('[data-result-kind]');
      if (!card) return;
      e.preventDefault();
      const row = findRow(card.dataset.resultKind, card.dataset.resultId);
      if (!row) return;
      selectedPaper = {kind: card.dataset.resultKind, id: card.dataset.resultId, row};
      renderResults();
      await renderDetail();
    });
    els.results.addEventListener('change', e => { const sel = e.target.closest('[data-role]'); if (sel) { setCandidateRole(sel.dataset.role, sel.value); renderAll(); } });
    document.getElementById('projectSelect').addEventListener('change', e => loadProject(e.target.value));
    els.globalProjectSelect.addEventListener('change', e => loadProject(e.target.value));
    document.getElementById('reloadBtn').addEventListener('click', () => selected && loadProject(selected));
    els.runDiscoveryBtn.addEventListener('click', startDiscovery);
    document.getElementById('saveBtn').addEventListener('click', () => save(false));
    document.getElementById('confirmBtn').addEventListener('click', () => save(true));
    document.getElementById('toggleKeywordBtn').addEventListener('click', () => { const g = currentGroup(); if (g) { g.keep = g.keep === false; renderAll(); } });
    document.getElementById('clearPaperSelection').addEventListener('click', clearCandidateSelection);
    els.keywordFilter.addEventListener('input', renderKeywords);
    els.centerFilter.addEventListener('change', () => {
      const visible = (data?.results || []).filter(g => els.centerFilter.value === 'all' || categoryKey(g) === els.centerFilter.value);
      if (visible.length && !visible.find(g => g.keyword === selectedKeyword)) selectedKeyword = visible[0].keyword;
      renderAll();
    });
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const map = {summary:'summary', pdf:'pdfFrame', markdown:'markdown', metadata:'metadata'};
      for (const id of Object.values(map)) document.getElementById(id).style.display = 'none';
      document.getElementById(map[tab.dataset.tab]).style.display = 'block';
    }));
    if (createRequested) {
      document.getElementById('newDiscoveryShell').open = true;
      requestAnimationFrame(() => els.newProjectId.focus());
    }
    loadProjects().catch(err => msg(err.message));
  </script>
</body>
</html>
