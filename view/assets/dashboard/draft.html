<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Review Draft</title>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css?v=20260813h">
  <style>
    :root{--ink:#20231f;--muted:#6d716a;--line:#d8ccb8;--paper:#fffdf7;--panel:#fff9ef;--green:#1e6a58;--warn:#a86527;--bad:#9a3c31}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:var(--ink);background:#efe4d1;font:14px Georgia,"Times New Roman",serif}button,select,input,textarea{font:inherit}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line)}.nav-title{font-size:18px;font-weight:700}.nav-center{flex:1;text-align:center}.project-select{min-width:300px}.project-select,.btn,.tab{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}.btn,.tab{cursor:pointer}.btn.primary,.tab.active{color:#fff;background:var(--green);border-color:var(--green)}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.55;cursor:not-allowed}.app{height:calc(100vh - 58px);display:grid;grid-template-columns:270px minmax(560px,1fr) 340px;gap:14px;padding:14px}.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.head,.tabs,.toolbar{padding:13px 15px;border-bottom:1px solid var(--line)}.tabs,.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.body,.side{min-height:0;overflow:auto;padding:15px}.main{min-height:0;overflow:auto;background:var(--paper)}h1,h2,h3{margin:0}.sub,.meta{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}.flow{display:grid;gap:9px}.step,.card,.issue,.paragraph{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}.step.active,.card.good{border-color:#79a995;background:#eef8f4}.step strong{display:block;margin-bottom:4px}.pane{display:none;padding:24px 30px;min-height:100%}.pane.active{display:block}.editor{width:100%;min-height:calc(100vh - 210px);padding:18px;border:1px solid var(--line);border-radius:10px;background:#fff;font:14px/1.6 Consolas,monospace;resize:vertical}.paragraph{margin-bottom:12px}.paragraph-text{white-space:pre-wrap;line-height:1.65}.paragraph-editor{width:100%;min-height:130px;padding:10px;border:1px solid var(--green);border-radius:8px}.markdown{font-size:16px;line-height:1.7}.markdown h1{font-size:28px}.markdown h2{font-size:21px;margin-top:30px}.markdown img,.issue img{max-width:100%;max-height:380px;object-fit:contain}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.score{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.score strong{display:block;margin-top:4px;font-size:22px;color:var(--green)}.issue{margin-bottom:10px}.issue-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.issue-body{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}.issue.open .issue-body{display:block}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin-top:10px}.images figure{margin:0;padding:7px;border:1px solid var(--line);border-radius:8px;text-align:center}.candidate{margin-top:11px;padding:11px;border:1px solid #8cb7a7;border-radius:8px;background:#f0f8f5}.columns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.columns>div{padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff;white-space:pre-wrap}.state{display:inline-block;padding:3px 8px;border-radius:999px;background:#ece3d4;font-size:11px}.state.running{color:#145c4b;background:#dcefe8}.state.done{color:#356e3d;background:#e4f1e3}.state.failed{color:#8b3025;background:#f6e1dc}.field{margin-bottom:13px}.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px}.field input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.message{position:fixed;right:18px;bottom:18px;display:none;max-width:430px;padding:11px 14px;border-radius:9px;background:#173c32;color:#fff}.message.show{display:block}@media(max-width:1050px){body{height:auto;overflow:auto}.app{height:auto;grid-template-columns:1fr}.panel{min-height:300px}.score-grid,.columns{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"></div></nav>
  <main class="app">
    <aside class="panel"><div class="head"><h2 data-t="draftTitle">Draft workflow</h2><div id="projectInfo" class="sub"></div></div><div id="flow" class="body flow"></div></aside>
    <section class="panel"><div class="head"><h2 id="mainTitle"></h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-tab="preview"></button><button class="tab" data-tab="edit"></button><button class="tab" data-tab="quality"></button><button class="tab" data-tab="approval"></button><button class="tab" data-tab="history"></button></div><div class="main"><section id="preview" class="pane active"></section><section id="edit" class="pane"><textarea id="draftEditor" class="editor" spellcheck="false"></textarea><div class="actions" style="margin-top:10px"><button id="saveDraft" class="btn primary"></button></div></section><section id="quality" class="pane"></section><section id="approval" class="pane"></section><section id="history" class="pane"></section></div></section>
    <aside class="panel"><div class="head"><h2 data-t="controls">Quality controls</h2><div class="sub" data-t="controlsHelp"></div></div><div class="side"><div class="field"><label for="goal" data-t="goal">Overall goal</label><input id="goal" type="number" min="90" max="100" value="90"></div><div class="actions"><button id="evaluate" class="btn primary"></button><button id="cancelJob" class="btn danger"></button></div><div id="jobStatus" class="sub" role="status" aria-live="polite"></div><div id="summary" style="margin-top:18px"></div></div></aside>
  </main>
  <div id="message" class="message"></div>
  <script src="/assets/dashboard/review-i18n.js?v=20260813h"></script>
  <script src="/assets/dashboard/review-ui.js?v=20260813h"></script>
  <script>
  const copy={
    draftTitle:['Draft workflow','初稿工作流'],controls:['Quality controls','质量控制'],controlsHelp:['Evaluate the exact saved version. AI rewrites remain candidates until you accept them.','评估当前已保存版本；AI 重写只生成候选，必须人工接受后才写入正文。'],goal:['Overall goal','全文目标分数'],
    preview:['Paragraph editing','段落编辑'],edit:['Full-text editing','全文编辑'],quality:['Evaluation & rewrites','评估与重写'],approval:['Human approval','人工确认'],history:['Version history','版本历史'],restore:['Restore this version','恢复此版本'],versionCurrent:['Current version','当前版本'],restoreConfirm:['Restore this immutable Draft version?','确认恢复这个不可变初稿版本吗？'],
    evaluate:['Evaluate current draft','评估当前初稿'],cancel:['Cancel running task','取消运行任务'],save:['Save full text','保存全文'],approve:['Approve for Final','确认并进入终稿'],
    empty:['Draft has not been assembled. Complete figure confirmation first.','尚未生成初稿，请先完成图像确认。'],current:['Current','当前'],stale:['Upstream changed; reassemble the draft.','上游内容已变化，请重新生成初稿。'],
    score:['Live score','实时全文分数'],target:['Target','目标'],issues:['Issues','问题数'],expand:['Show paragraph','展开正文'],collapse:['Hide paragraph','收起正文'],rewrite:['Generate rewrite candidate','生成重写候选'],
    rewriting:['Rewriting…','正在重写…'],rewriteDone:['Rewrite complete','重写完毕'],rewriteFailed:['Rewrite failed','重写失败'],accept:['Accept','接受'],reject:['Reject','拒绝'],manual:['Edit paragraph','编辑段落'],
    approved:['The exact evaluated draft is approved for Final.','当前已评估初稿已确认，可进入终稿。'],approvalNeeded:['Evaluate the current saved draft, resolve hard failures, then approve it.','请先评估当前已保存初稿、处理硬性问题，再人工确认。'],
    queued:['Task is queued…','任务排队中…'],running:['Task is running…','任务运行中…'],cancelRequested:['Cancellation requested…','正在请求取消…'],cancelled:['Task cancelled.','任务已取消。'],interrupted:['Task interrupted; retry is available.','任务已中断，可以重试。'],completed:['Task completed.','任务已完成。'],failed:['Task failed.','任务失败。'],saved:['Draft saved.','初稿已保存。'],assembled:['Draft assembled.','初稿已生成。'],restored:['Draft version restored.','初稿版本已恢复。']
  };
  const apiErrorCopy={DRAFT_NOT_READY:['Draft is not ready. Complete the required upstream approval first.','初稿尚未就绪，请先完成上游确认。'],DRAFT_APPROVAL_BLOCKED:['Draft approval is blocked by the current quality gate.','当前质量门禁阻止初稿确认。'],STATE_CONFLICT:['The workflow changed. Refresh and try again.','工作流已发生变化，请刷新后重试。'],WORKFLOW_VALIDATION_FAILED:['The submitted content is invalid. Check it and try again.','提交内容不符合要求，请检查后重试。'],WORKFLOW_NOT_FOUND:['The requested workflow item was not found.','未找到请求的工作流内容。'],JOB_EXECUTION_FAILED:['The model task failed. Retry it or check model settings.','模型任务失败，请重试或检查模型设置。'],PROCESS_INTERRUPTED:['The server interrupted this task; retry is available.','服务器中断了该任务，可以重试。']};
  const $=id=>document.getElementById(id), zh=()=>document.documentElement.lang==='zh-CN', t=key=>(copy[key]||[key,key])[zh()?1:0];
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  let projects=[],selectedProject='',payload={},tab='preview',dirty=false,currentJobId='',currentJobView={},expanded=new Set();
  async function request(url,options={}){const response=await fetch(url,{cache:'no-store',...options});const data=await response.json().catch(()=>({}));if(!response.ok){const code=data.error?.code||data.detail?.code||'';const message=data.error?.message||data.detail?.message||data.detail||data.message||`HTTP ${response.status}`;throw new Error(apiErrorCopy[code]?.[zh()?1:0]||String(message))}return data}
  const base=()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/draft`;
  const nativeRoutes={
    draft:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/draft`,
    assemble:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/draft/assemble`,
    evaluation:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/draft/evaluation-jobs`,
    rewrite:paragraphId=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/draft/paragraphs/${encodeURIComponent(paragraphId)}/rewrite-jobs`,
    decision:(candidateId,decision)=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/draft/rewrite-candidates/${encodeURIComponent(candidateId)}/${decision}`,
    restore:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/draft/restore`
  };
  function notice(text){$('message').textContent=text;$('message').classList.add('show');setTimeout(()=>$('message').classList.remove('show'),2800)}
  function localizedJobStatus(){const status=currentJobView.status||'';if(status==='queued')return t('queued');if(status==='running')return t('running');if(status==='cancel_requested')return t('cancelRequested');if(status==='succeeded')return t('completed');if(status==='cancelled')return t('cancelled');if(status==='interrupted')return t('interrupted');if(status==='failed')return apiErrorCopy[currentJobView.error_code]?.[zh()?1:0]||t('failed');return ''}
  function renderJobStatus(){$('jobStatus').textContent=localizedJobStatus()}
  function markdown(value){let text=esc(String(value||'').replace(/<!--[\s\S]*?-->/g,''));text=text.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/!\[([^\]]*)\]\((\/api\/v1\/artifacts\/[^)]+)\)/g,'<figure><img src="$2" alt="$1"><figcaption>$1</figcaption></figure>');return text.split(/\n{2,}/).map(block=>/^<(?:h|figure)/.test(block)?block:`<p>${block.replace(/\n/g,'<br>')}</p>`).join('')}
  function jobState(paragraphId){return payload.rewrite_states?.[paragraphId]||{}}
  function stateText(state){if(['queued','running','cancel_requested'].includes(state.status))return [state.status==='cancel_requested'?t('cancelRequested'):t('rewriting'),'running'];if(state.status==='completed')return[t('rewriteDone'),'done'];if(state.status==='failed')return[t('rewriteFailed'),'failed'];if(state.status==='cancelled')return[t('cancelled'),'failed'];if(state.status==='interrupted')return[t('interrupted'),'failed'];return['','']}
  function pendingCandidate(paragraphId){return (payload.rewrite_candidates||[]).find(item=>item.paragraph_id===paragraphId&&item.status==='pending')}
  function renderFlow(){const labels=[['preview',t('preview')],['edit',t('edit')],['quality',t('quality')],['approval',t('approval')],['history',t('history')]];$('flow').innerHTML=labels.map(([id,label],index)=>`<button class="step ${tab===id?'active':''}" data-go="${id}"><strong>${index+1}. ${esc(label)}</strong><span>${id==='approval'?esc(payload.draft_approval_current?t('approved'):t('approvalNeeded')):''}</span></button>`).join('');$('projectInfo').textContent=selectedProject}
  function paragraphCard(row){const state=jobState(row.paragraph_id),[label,klass]=stateText(state),candidate=pendingCandidate(row.paragraph_id),hasIssue=(payload.quality?.issues||[]).some(issue=>issue.paragraph_id===row.paragraph_id);return `<article class="paragraph" data-paragraph="${esc(row.paragraph_id)}"><div class="actions" style="justify-content:space-between"><strong>${esc(row.paragraph_id)}</strong><span class="state ${klass}">${esc(label)}</span></div><div class="paragraph-text">${esc(row.text)}</div><div class="actions" style="margin-top:9px"><button class="btn" data-action="edit-paragraph" data-id="${esc(row.paragraph_id)}">${esc(t('manual'))}</button>${hasIssue?`<button class="btn" data-action="rewrite" data-id="${esc(row.paragraph_id)}">${esc(t('rewrite'))}</button>`:''}</div>${candidate?`<div class="candidate"><div class="columns"><div>${esc(candidate.original_text)}</div><div>${esc(candidate.candidate_text)}</div></div><div class="actions" style="margin-top:9px"><button class="btn primary" data-action="accept" data-id="${esc(candidate.candidate_id)}">${esc(t('accept'))}</button><button class="btn" data-action="reject" data-id="${esc(candidate.candidate_id)}">${esc(t('reject'))}</button></div></div>`:''}</article>`}
  function renderPreview(){if(!payload.draft_artifact_id){$('preview').innerHTML=`<p>${esc(t('empty'))}</p>`;return}$('preview').innerHTML=(payload.paragraphs||[]).map(paragraphCard).join('')||`<div class="markdown">${markdown(payload.first_draft_md)}</div>`}
  function issueCard(issue,index){const id=String(issue.issue_id||`issue-${index}`),open=expanded.has(id),paragraphText=issue.paragraph?issue.paragraph.text:'',images=issue.paragraph?issue.paragraph.images:[],state=jobState(issue.paragraph_id),[label,klass]=stateText(state),candidate=pendingCandidate(issue.paragraph_id);return `<article class="issue ${open?'open':''}"><div class="issue-head"><div><strong>${esc(issue.severity||'issue')} · ${esc(issue.paragraph_id||'')}</strong><div class="meta">${esc(issue.message||issue.diagnosis||'')}</div></div><div class="actions"><span class="state ${klass}">${esc(label)}</span><button class="btn" data-action="toggle-issue" data-id="${esc(id)}">${esc(open?t('collapse'):t('expand'))}</button></div></div><div class="issue-body"><div class="paragraph-text">${esc(paragraphText||'')}</div><div class="images">${(images||[]).map(image=>`<figure><img src="${esc(image.url)}" alt="${esc(image.figure_id||'Figure')}"><figcaption>${esc(image.figure_id||'Figure')}</figcaption></figure>`).join('')}</div><div class="actions"><button class="btn" data-action="edit-paragraph" data-id="${esc(issue.paragraph_id)}">${esc(t('manual'))}</button><button class="btn primary" data-action="rewrite" data-id="${esc(issue.paragraph_id)}">${esc(t('rewrite'))}</button></div>${candidate?`<div class="candidate"><div class="columns"><div>${esc(candidate.original_text)}</div><div>${esc(candidate.candidate_text)}</div></div><div class="actions" style="margin-top:9px"><button class="btn primary" data-action="accept" data-id="${esc(candidate.candidate_id)}">${esc(t('accept'))}</button><button class="btn" data-action="reject" data-id="${esc(candidate.candidate_id)}">${esc(t('reject'))}</button></div></div>`:''}</div></article>`}
  function renderQuality(){const quality=payload.quality||{};$('quality').innerHTML=`<div class="score-grid"><div class="score">${esc(t('score'))}<strong>${quality.score===undefined?'—':Number(quality.score).toFixed(1)}</strong></div><div class="score">${esc(t('target'))}<strong>${quality.goal===undefined?'—':Number(quality.goal).toFixed(1)}</strong></div><div class="score">${esc(t('issues'))}<strong>${(quality.issues||[]).length}</strong></div></div>${(quality.issues||[]).map(issueCard).join('')||`<div class="card good">${quality.current?esc(t('completed')):esc(t('approvalNeeded'))}</div>`}`}
  function renderApproval(){const quality=payload.quality||{},hard=quality.hard_gate_failures||[];$('approval').innerHTML=`<div class="card ${payload.draft_approval_current?'good':''}"><h3>${esc(payload.draft_approval_current?t('approved'):t('approvalNeeded'))}</h3><p>${quality.current?`${esc(t('score'))}: ${esc(quality.score)}`:esc(t('approvalNeeded'))}</p>${hard.length?`<p>${esc(hard.join('; '))}</p>`:''}<button id="approveDraft" class="btn primary" ${!quality.current?'disabled':''}>${esc(t('approve'))}</button></div>`}
  function renderHistory(){$('history').innerHTML=(payload.versions||[]).map(version=>`<article class="card ${version.current?'good':''}"><strong>${esc(version.operation||'saved')}</strong><div class="meta">${esc(version.created_at||'')}<br>${esc(version.artifact_id)}</div><div class="actions" style="margin-top:9px">${version.current?`<span class="state done">${esc(t('versionCurrent'))}</span>`:`<button class="btn" data-action="restore-version" data-id="${esc(version.artifact_id)}">${esc(t('restore'))}</button>`}</div></article>`).join('')||`<p>${esc(t('empty'))}</p>`}
  function renderSummary(){const quality=payload.quality||{};$('summary').innerHTML=`<div class="field"><label>${esc(t('score'))}</label><strong>${quality.score===undefined?'—':Number(quality.score).toFixed(1)}</strong></div><div class="field"><label>Status</label><span class="state">${esc(payload.freshness?.upstream_stale?t('stale'):t('current'))}</span></div><div class="field"><label>Revision</label>${esc(payload.revision||0)}</div>`}
  function render(){document.querySelectorAll('.tab').forEach(button=>{button.textContent=t(button.dataset.tab);button.classList.toggle('active',button.dataset.tab===tab)});document.querySelectorAll('.pane').forEach(pane=>pane.classList.toggle('active',pane.id===tab));$('mainTitle').textContent=t(tab);$('mainMeta').textContent=payload.freshness?.upstream_stale?t('stale'):t('current');$('evaluate').textContent=t('evaluate');$('cancelJob').textContent=t('cancel');$('saveDraft').textContent=t('save');document.querySelectorAll('[data-t]').forEach(node=>node.textContent=t(node.dataset.t));renderFlow();renderPreview();renderQuality();renderApproval();renderHistory();renderSummary();renderJobStatus()}
  async function loadProject(projectId,{assemble=true}={}){selectedProject=projectId;payload=await request(nativeRoutes.draft());if(!payload.draft_artifact_id&&assemble){try{await request(nativeRoutes.assemble(),{method:'POST'});notice(t('assembled'));payload=await request(nativeRoutes.draft())}catch(error){$('jobStatus').textContent=error.message}}$('draftEditor').value=payload.first_draft_md||'';dirty=false;render()}
  async function waitJob(jobId){currentJobId=jobId;for(let attempt=0;attempt<1800;attempt++){const job=await request(`/api/v1/jobs/${encodeURIComponent(jobId)}`);currentJobView={status:job.status,error_code:job.error_code||''};renderJobStatus();if(['succeeded','failed','cancelled','interrupted'].includes(job.status)){currentJobId='';await loadProject(selectedProject,{assemble:false});if(job.status!=='succeeded')throw new Error(localizedJobStatus());return job}await new Promise(resolve=>setTimeout(resolve,1000))}currentJobView={status:'failed',error_code:'JOB_TIMEOUT'};throw new Error(t('failed'))}
  async function saveFull(){if(!dirty)return true;const result=await request(base(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('draftEditor').value,revision:payload.revision})});await loadProject(selectedProject,{assemble:false});notice(t('saved'));return result}
  async function evaluate(){try{await saveFull();tab='quality';render();const job=await request(nativeRoutes.evaluation(),{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({goal:Number($('goal').value)||90})});await waitJob(job.id)}catch(error){$('jobStatus').textContent=error.message}}
  async function editParagraph(id){const row=(payload.paragraphs||[]).find(item=>item.paragraph_id===id),card=document.querySelector(`[data-paragraph="${CSS.escape(id)}"]`);if(!row||!card)return;card.querySelector('.paragraph-text').innerHTML=`<textarea class="paragraph-editor">${esc(row.text)}</textarea><div class="actions" style="margin-top:8px"><button class="btn primary" data-action="save-paragraph" data-id="${esc(id)}">${esc(t('save'))}</button></div>`}
  async function saveParagraph(id){const card=document.querySelector(`[data-paragraph="${CSS.escape(id)}"]`),text=card?.querySelector('textarea')?.value;if(!text)return;try{await request(`${base()}/paragraphs/${encodeURIComponent(id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,revision:payload.revision})});await loadProject(selectedProject,{assemble:false});notice(t('saved'))}catch(error){notice(error.message)}}
  async function rewriteParagraph(id){try{tab='quality';const job=await request(nativeRoutes.rewrite(id),{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:'{}'});render();await waitJob(job.id)}catch(error){$('jobStatus').textContent=error.message}}
  async function decideCandidate(id,decision){try{await request(nativeRoutes.decision(id,decision),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:payload.revision})});await loadProject(selectedProject,{assemble:false})}catch(error){notice(error.message)}}
  async function restoreVersion(id){if(!confirm(t('restoreConfirm')))return;try{await request(nativeRoutes.restore(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({artifact_id:id,revision:payload.revision})});await loadProject(selectedProject,{assemble:false});notice(t('restored'))}catch(error){notice(error.message)}}
  async function approve(){const quality=payload.quality||{},below=Number(quality.score||0)<Number(quality.goal||90);let override=false,reason='';if(below){override=confirm(zh()?'分数低于目标，是否人工覆盖并继续？':'The score is below target. Approve with a human override?');if(!override)return;reason=zh()?'人工复核后接受当前版本。':'Human review accepted the current version.'}try{await request(`${base()}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:payload.revision,override_low_score:override,override_reason:reason})});await loadProject(selectedProject,{assemble:false})}catch(error){notice(error.message)}}
  async function loadProjects(){projects=await request('/api/projects');$('projectSelect').innerHTML=projects.map(project=>`<option value="${esc(project.project_id)}">${esc(project.topic||project.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
  document.addEventListener('click',event=>{const tabButton=event.target.closest('[data-tab],[data-go]');if(tabButton){tab=tabButton.dataset.tab||tabButton.dataset.go;render();return}const button=event.target.closest('[data-action]');if(button){const id=button.dataset.id,action=button.dataset.action;if(action==='toggle-issue'){expanded.has(id)?expanded.delete(id):expanded.add(id);renderQuality()}else if(action==='edit-paragraph')editParagraph(id);else if(action==='save-paragraph')saveParagraph(id);else if(action==='rewrite')rewriteParagraph(id);else if(action==='restore-version')restoreVersion(id);else if(action==='accept'||action==='reject')decideCandidate(id,action);return}if(event.target.id==='approveDraft')approve()});
  $('projectSelect').onchange=event=>loadProject(event.target.value);$('draftEditor').oninput=()=>{dirty=true};$('saveDraft').onclick=()=>saveFull().catch(error=>notice(error.message));$('evaluate').onclick=evaluate;$('cancelJob').onclick=async()=>{if(currentJobId)await request(`/api/v1/jobs/${encodeURIComponent(currentJobId)}/cancel`,{method:'POST'})};window.reviewDraftSaveForHandoff=saveFull;window.reviewDraftApproveForHandoff=approve;window.addEventListener('review-language-change',render);loadProjects().catch(error=>notice(error.message));
  </script>
</body>
