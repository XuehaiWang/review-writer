<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review First Draft</title>
  <style>
    :root {
      --ink: #1f2024;
      --muted: #69707b;
      --panel: #fffaf1;
      --line: #d7cbb7;
      --green: #1e6a58;
      --orange: #c46f33;
      --shadow: 0 20px 52px rgba(48, 39, 24, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(30,106,88,.14), transparent 24rem),
        radial-gradient(circle at 88% 12%, rgba(196,111,51,.16), transparent 28rem),
        linear-gradient(135deg, #efe3cc, #fbf6ea 46%, #eadfca);
      font-family: Georgia, "Times New Roman", serif;
      height: 100vh;
      overflow: hidden;
    }
    button, select, textarea { font: inherit; }
    .nav {
      height: 58px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,250,241,.94);
      border-bottom: 1px solid var(--line);
    }
    .nav-title { font-weight: 700; font-size: 18px; white-space: nowrap; }
    .nav-center { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; justify-content: center; }
    .nav-right { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .nav a {
      display: inline-block;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fffdf7;
      white-space: nowrap;
    }
    .nav a.active { background: var(--green); border-color: var(--green); color: white; }
    .project-select {
      min-width: 280px;
      max-width: 520px;
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 999px;
      padding: 8px 12px;
      outline: none;
    }
    .app {
      height: calc(100vh - 58px);
      display: grid;
      grid-template-columns: 320px minmax(520px, 1fr) 380px;
      gap: 14px;
      padding: 14px;
    }
    .panel {
      background: rgba(255,250,241,.94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .toolbar, .tabs {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn, .tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: #fffdf7;
      cursor: pointer;
      color: var(--ink);
    }
    .btn.primary, .tab.active { color: white; background: var(--green); border-color: var(--green); }
    .btn.orange { color: white; background: var(--orange); border-color: var(--orange); }
    .list, .detail-body, .side-body { overflow: auto; min-height: 0; }
    .detail-body { flex: 1; }
    .list { padding: 9px; }
    .item {
      width: 100%;
      text-align: left;
      background: #fffdf7;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 11px;
      margin-bottom: 8px;
      cursor: pointer;
      color: var(--ink);
    }
    .item:hover, .item.active { border-color: var(--green); background: #f2faf0; }
    .item-title { font-weight: 700; font-size: 15px; line-height: 1.25; }
    .item-meta { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.35; }
    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e4efe4;
      color: #285a37;
      margin: 5px 4px 0 0;
    }
    .draft-view, .markdown {
      height: 100%;
      overflow: auto;
      padding: 28px 34px;
      background: #fffdf7;
      line-height: 1.6;
      font-size: 16px;
    }
    .markdown img, .draft-view img { max-width: 100%; border: 1px solid var(--line); border-radius: 10px; }
    .markdown a, .draft-view a { color: var(--green); text-decoration-thickness: 1px; }
    .markdown code, .draft-view code {
      padding: 2px 5px;
      border-radius: 6px;
      background: #efe6d4;
      color: #5c3c20;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: .9em;
    }
    .markdown p:has(img), .draft-view p:has(img) { text-align: center; }
    .markdown table, .draft-view table {
      border-collapse: collapse;
      width: max-content;
      max-width: 100%;
      margin: 18px 0;
      background: white;
      font-size: 13px;
      line-height: 1.35;
      display: block;
      overflow-x: auto;
    }
    .markdown th, .markdown td, .draft-view th, .draft-view td {
      border: 1px solid #cfc2aa;
      padding: 7px 9px;
      vertical-align: top;
      min-width: 72px;
    }
    .markdown th, .markdown tr:first-child td, .draft-view th, .draft-view tr:first-child td {
      background: #efe6d4;
      font-weight: 700;
    }
    .markdown details, .draft-view details {
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbf4e5;
    }
    .markdown summary, .draft-view summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--green);
    }
    .markdown .math, .draft-view .math {
      font-family: "Times New Roman", Georgia, serif;
      white-space: nowrap;
    }
    .markdown .caption, .draft-view .caption {
      margin: 16px 0 8px;
      font-weight: 700;
      color: #4d3923;
    }
    .markdown .raw-block, .draft-view .raw-block { margin: 12px 0; }
    .edit-pane {
      height: 100%;
      min-height: 0;
      padding: 18px;
      background: linear-gradient(180deg, #f7f0e3 0%, #fbf7ed 100%);
    }
    .editor {
      width: 100%;
      height: 100%;
      min-height: 320px;
      resize: none;
      border: 1px solid #d7cbb7;
      border-radius: 14px;
      outline: none;
      padding: 22px 24px 28px;
      background: #fffdf7;
      color: #25231c;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 26px rgba(54,43,25,.08);
      caret-color: var(--green);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.65;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .editor:hover { border-color: #b9aa91; }
    .editor:focus {
      border-color: var(--green);
      background: #fffefb;
      box-shadow: 0 0 0 3px rgba(30,106,88,.12), 0 14px 30px rgba(54,43,25,.10);
    }
    .editor::selection { color: #173f36; background: #d9ece5; }
    .editor:disabled { cursor: not-allowed; color: var(--muted); background: #f2ecdf; }
    .side-body { padding: 12px; }
    .field { margin-bottom: 12px; }
    .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }
    .value { font-size: 14px; line-height: 1.35; }
    .message {
      position: fixed;
      right: 18px;
      bottom: 18px;
      padding: 11px 15px;
      border-radius: 12px;
      background: #15251f;
      color: white;
      box-shadow: var(--shadow);
      display: none;
      max-width: 420px;
    }
    .message.show { display: block; }
    .para-block { position:relative; border:1px solid transparent; border-radius:8px; padding:8px 10px; margin:4px 0; }
    .para-block:hover { border-color:var(--line); background:#fffaf1; }
    .para-actions { display:none; gap:6px; margin:0 0 8px; }
    .para-block:hover .para-actions { display:flex; }
    .para-actions button { border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; padding:3px 8px; }
    .para-inline-editor { width:100%; min-height:150px; resize:vertical; padding:10px; border:1px solid var(--green); border-radius:8px; font:inherit; line-height:1.55; }
    .para-inline-controls { display:flex; gap:8px; margin-top:8px; }
    .draft-workflow { display:grid; gap:10px; }
    .workflow-step { padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:#fffdf7; }
    .workflow-step strong { display:block; margin-bottom:4px; color:#234f43; }
    .workflow-step span { display:block; color:var(--muted); font-size:12px; line-height:1.45; }
    .checks-view { height:100%; overflow:auto; padding:22px 26px 30px; background:#fffdf7; }
    .checks-intro { margin:0 0 14px; padding:11px 13px; border-radius:11px; background:#eef6f2; color:#3f5d53; font-size:13px; line-height:1.5; }
    .check-card { margin-bottom:14px; padding:16px 18px; border:1px solid var(--line); border-radius:14px; background:#fffaf1; }
    .check-card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
    .check-card h3 { font-size:16px; }
    .check-status { flex:0 0 auto; padding:3px 8px; border-radius:999px; background:#e4efe4; color:#285a37; font-size:11px; }
    .check-status.review { background:#f7e4cd; color:#8a4b20; }
    .check-help { margin:0 0 10px; color:var(--muted); font-size:13px; line-height:1.45; }
    .check-content { padding-top:8px; border-top:1px solid #e5dac6; }
    .check-content.markdown { height:auto; overflow:visible; padding:8px 0 0; background:transparent; font-size:14px; }
    .quality-config { padding: 12px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fffdf7; }
    .quality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 9px 0 11px; }
    .quality-grid label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 11px; }
    .quality-grid input { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px; background: white; }
    .quality-view, .approval-view { min-height: 100%; padding: 24px 28px; background: #fffdf7; overflow: auto; }
    .quality-status { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
    .quality-stat { padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: #fffaf1; }
    .quality-stat strong { display: block; margin-top: 4px; font-size: 21px; color: var(--green); }
    .quality-stat.stale strong { color: #9a6b28; }
    .rewrite-current { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; padding: 11px 13px; border: 1px solid #8bb9aa; border-radius: 9px; background: #eef8f4; }
    .spinner { width: 15px; height: 15px; border: 2px solid #a8cec1; border-top-color: var(--green); border-radius: 50%; animation: qualitySpin .8s linear infinite; }
    .quality-queue-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin: 18px 0 9px; }
    .quality-score-list { display: grid; gap: 9px; }
    .quality-score-card { padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid #a58145; border-radius: 8px; background: #fffdf7; }
    .quality-score-card.rewriting { border-left-color: #237c66; background: #f4fbf8; }
    .quality-score-card.completed { border-left-color: #488f52; }
    .quality-score-card.rejected { border-left-color: #a64132; }
    .quality-score-head, .quality-score-tools, .quality-score-title, .candidate-actions { display: flex; align-items: center; gap: 8px; }
    .quality-score-head { justify-content: space-between; }
    .quality-score-title { min-width: 0; }
    .quality-score-tools { flex-wrap: wrap; justify-content: flex-end; }
    .quality-score-value { font-size: 18px; }
    .quality-score-meta { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .rewrite-state { display: inline-flex; padding: 3px 8px; border-radius: 999px; background: #eee4d1; color: #6f592f; font-size: 11px; }
    .rewrite-state.rewriting { background: #dcefe8; color: #145c4b; }
    .rewrite-state.completed { background: #e4f1e3; color: #356e3d; }
    .rewrite-state.rejected { background: #f6e1dc; color: #8b3025; }
    .rewrite-state.review { background: #eee9f6; color: #665183; }
    .issue-toggle { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: white; cursor: pointer; color: var(--green); font-size: 18px; }
    .issue-content { margin-top: 11px; padding: 12px; border-top: 1px solid var(--line); background: white; }
    .issue-heading { margin-bottom: 6px; color: var(--green); font-weight: 700; }
    .issue-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }
    .issue-images { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 10px; margin: 8px 0 12px; }
    .issue-image { margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fffdf7; text-align: center; }
    .issue-image img { display: block; width: 100%; max-height: 360px; object-fit: contain; border: 0; background: white; }
    .candidate-review { margin-top: 12px; padding: 12px; border: 1px solid #9ebfaf; border-radius: 9px; background: #f4fbf8; }
    .candidate-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 9px 0; }
    .candidate-column { padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: white; white-space: pre-wrap; }
    .approval-card { margin-bottom: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #fffaf1; }
    .approval-card.current { border-color: #78a992; background: #eef8f4; }
    .approval-card.blocked { border-color: #c4976e; background: #fff6e9; }
    .btn.danger { color: #8f3527; border-color: #cda89f; background: #fff7f4; }
    .btn.small { padding: 5px 8px; font-size: 12px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    @keyframes qualitySpin { to { transform: rotate(360deg); } }
    @media(max-width:1050px) { .quality-status,.candidate-columns { grid-template-columns: 1fr; } }
  </style>

<script src="/assets/dashboard/review-ui.js?v=20260813g"></script>
  <script>
    let projects = [];
    let selectedProject = '';
    let payload = null;
    const requestedTab = new URLSearchParams(window.location.search).get('tab');
    let activeTab = ['preview','edit','quality','approval'].includes(requestedTab) ? requestedTab : 'preview';
    let feedbackPollTimer = null;
    let feedbackRequestPending = false;
    let draftDirty = false;
    const expandedFeedbackIssues = new Set();
    const els = {
      projectSelect: document.getElementById('projectSelect'),
      projectInfo: document.getElementById('projectInfo'),
      leftList: document.getElementById('leftList'),
      detailTitle: document.getElementById('detailTitle'),
      detailMeta: document.getElementById('detailMeta'),
      preview: document.getElementById('preview'),
      draftEditor: document.getElementById('draftEditor'),
      quality: document.getElementById('quality'),
      approval: document.getElementById('approval'),
      summaryBox: document.getElementById('summaryBox'),
      message: document.getElementById('message')
    };
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function msg(text) { els.message.textContent = text; els.message.classList.add('show'); setTimeout(() => els.message.classList.remove('show'), 2600); }
    function simpleMathToHtml(expr) {
      let s = String(expr ?? '');
      s = s.replace(/\\mathrm\s*\{\s*([^{}]+?)\s*\}/g, '$1');
      s = s.replace(/\\prime/g, '′');
      s = s.replace(/\\[a-zA-Z]+/g, '');
      s = s.replace(/\s+/g, ' ').trim();
      s = esc(s);
      s = s.replace(/_\s*\{\s*([^{}]+?)\s*\}/g, '<sub>$1</sub>');
      s = s.replace(/\^\s*\{\s*([^{}]+?)\s*\}/g, '<sup>$1</sup>');
      s = s.replace(/_([A-Za-z0-9′+-]+)/g, '<sub>$1</sub>');
      s = s.replace(/\^([A-Za-z0-9′+-]+)/g, '<sup>$1</sup>');
      return `<span class="math">${s}</span>`;
    }
    function renderInline(text) {
      const parts = String(text ?? '').split(/(\$[^$\n]+\$)/g);
      return parts.map(part => {
        if (part.startsWith('$') && part.endsWith('$')) return simpleMathToHtml(part.slice(1, -1));
        let s = esc(part);
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
          if (/^https?:\/\//i.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
          return m;
        });
        return s;
      }).join('');
    }
    function sanitizeAllowedHtml(raw) {
      const allowedTags = new Set(['DIV','DETAILS','SUMMARY','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','CAPTION','P','BR','B','STRONG','I','EM','SUB','SUP','SPAN','IMG']);
      const template = document.createElement('template');
      template.innerHTML = raw;
      const walk = node => {
        if (node.nodeType === Node.TEXT_NODE) {
          const span = document.createElement('span');
          span.innerHTML = renderInline(node.textContent || '');
          node.replaceWith(...Array.from(span.childNodes));
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (!allowedTags.has(node.tagName)) {
          node.replaceWith(document.createTextNode(node.textContent || ''));
          return;
        }
        [...node.attributes].forEach(attr => {
          const name = attr.name.toLowerCase();
          if (!['colspan', 'rowspan', 'open', 'class', 'src', 'alt'].includes(name)) node.removeAttribute(attr.name);
          if (name === 'src' && !String(attr.value || '').startsWith('/file?')) node.removeAttribute(attr.name);
        });
        [...node.childNodes].forEach(walk);
      };
      [...template.content.childNodes].forEach(walk);
      return template.innerHTML;
    }
    function fileUrlForMarkdownPath(path, baseDir = '') {
      const raw = String(path || '').trim();
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) return raw;
      if (raw.startsWith('/')) return `/file?path=${encodeURIComponent(raw)}`;
      const base = String(baseDir || payload?.paths?.first_draft_base_dir || payload?.paths?.stage_dir || '').replace(/\/+$/, '');
      return `/file?path=${encodeURIComponent(base ? `${base}/${raw}` : raw)}`;
    }
    function renderMarkdown(md, baseDir = '') {
      const blocks = [];
      const stash = html => {
        const key = `@@HTML_BLOCK_${blocks.length}@@`;
        blocks.push(sanitizeAllowedHtml(html));
        return key;
      };
      let text = String(md ?? '');
      text = text.replace(/<details[\s\S]*?<\/details>/gi, match => stash(`<div class="raw-block">${match}</div>`));
      text = text.replace(/<table[\s\S]*?<\/table>/gi, match => stash(match));
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, path) => {
        const src = fileUrlForMarkdownPath(path, baseDir);

      const valid = new Set(['preview', 'edit', 'quality', 'approval']);
      if (!valid.has(activeTab)) activeTab = 'preview';
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === activeTab));
      for (const id of valid) document.getElementById(id).style.display = id === activeTab ? 'block' : 'none';
    }
    function renderCurrent() {
      if (payload?.freshness?.editing_blocked) {
        activeTab = 'preview';
        els.detailTitle.textContent = '初稿已过期';
        els.detailMeta.textContent = '当前 Blueprint、章节或审核图片已经更新。';
        els.preview.innerHTML = '<div class="empty">请重新生成初稿。旧初稿保留在磁盘中，但不会作为当前流程内容显示或保存。</div>';
        els.quality.innerHTML = '';
        els.approval.innerHTML = '';
        syncActiveTab();
        return;
      }
      const titles = {
        preview:['Draft Preview','Read the manuscript and edit individual paragraphs in context.'],
        edit:['Full-text Edit','Edit and save the complete Markdown source.'],
        quality:['Draft Quality','Evaluate the saved manuscript, inspect problem paragraphs, and review AI rewrite candidates.'],
        approval:['Human Approval','Confirm merge evidence, hard integrity checks, and the exact approved Draft version before Final.']
      };
      els.detailTitle.textContent = titles[activeTab][0];
      els.detailMeta.textContent = titles[activeTab][1];
      els.preview.innerHTML = renderMarkdownWithParagraphs(els.draftEditor.value || '', payload?.paths?.first_draft_base_dir || payload?.paths?.stage_dir || '');
      els.quality.innerHTML = renderFeedbackQuality();
      els.approval.innerHTML = renderHumanApproval();
      syncActiveTab();
      if (activeTab === 'quality') decorateFeedbackIssueImages();
    }
    async function saveDraft(options = {}) {
      if (!selectedProject) return false;
      if (feedbackRunning()) {
        msg(qualityText('Stop or finish the current quality run before saving.','请先停止或等待当前质量任务完成后再保存。'));
        return false;
      }
      if (document.querySelector('.para-inline-editor')) {
        msg('请先保存或取消当前段落编辑。');
        return false;
      }
      const silent = Boolean(options.silent);
      const res = await fetch(`/api/project/${encodeURIComponent(selectedProject)}/draft`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          first_draft_md: els.draftEditor.value,
          draft_bundle: payload?.draft_bundle || {}
        })
      });
      if (!res.ok) { msg(await res.text()); return false; }
      if (!silent) msg('Draft saved');
      await loadProject(selectedProject);
      draftDirty = false;
      return true;
    }
    window.reviewDraftSaveForHandoff = () => saveDraft({silent:true});
    window.reviewDraftApproveForHandoff = () => approveDraftForHandoff();
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
      activeTab = tab.dataset.tab;
      renderCurrent();
    }));
    els.projectSelect.addEventListener('change', e => loadProject(e.target.value));
    els.draftEditor.addEventListener('input', () => { draftDirty = true; renderSummary(); if (activeTab === 'quality' || activeTab === 'approval') renderCurrent(); });
    document.getElementById('reloadBtn').addEventListener('click', () => selectedProject && loadProject(selectedProject));
    document.getElementById('saveBtn').addEventListener('click', saveDraft);
    document.addEventListener('click', event => {
      const issueButton = event.target.closest('[data-issue-toggle]');
      if (issueButton) {
        const id = String(issueButton.dataset.issueToggle || '');
        if (expandedFeedbackIssues.has(id)) expandedFeedbackIssues.delete(id); else expandedFeedbackIssues.add(id);
        renderCurrent(); return;
      }
      const feedbackButton = event.target.closest('[data-feedback-action]');
      if (feedbackButton) {
        const action = feedbackButton.dataset.feedbackAction;
        if (action === 'stop') stopFeedbackLoop(); else runFeedbackLoop(action === 'evaluate');
        return;
      }
      const qualityButton = event.target.closest('[data-quality-action]');
      if (!qualityButton) return;
      const paragraphId = String(qualityButton.dataset.paragraphId || ''), action = qualityButton.dataset.qualityAction;
      if (action === 'manual-edit') openParagraphEditor(paragraphId);
      else if (action === 'ai-rewrite') requestAiRewrite(paragraphId);
      else if (action === 'accept-candidate') decideAiRewrite(paragraphId, 'accept');
      else if (action === 'reject-candidate') decideAiRewrite(paragraphId, 'reject');
    });
    window.addEventListener('review-language-change', () => { renderLeft(); renderSummary(); renderCurrent(); });
    loadProjects().catch(err => msg(err.message));
  </script>
</body>
</html>
