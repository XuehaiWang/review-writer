<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review First Draft</title>
  <style>
    :root {
      --ink: #1f2024;
      --muted: #69707b;
      --panel: #fffaf1;
      --line: #d7cbb7;
      --green: #1e6a58;
      --orange: #c46f33;
      --shadow: 0 20px 52px rgba(48, 39, 24, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(30,106,88,.14), transparent 24rem),
        radial-gradient(circle at 88% 12%, rgba(196,111,51,.16), transparent 28rem),
        linear-gradient(135deg, #efe3cc, #fbf6ea 46%, #eadfca);
      font-family: Georgia, "Times New Roman", serif;
      height: 100vh;
      overflow: hidden;
    }
    button, select, textarea { font: inherit; }
    .nav {
      height: 58px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,250,241,.94);
      border-bottom: 1px solid var(--line);
    }
    .nav-title { font-weight: 700; font-size: 18px; white-space: nowrap; }
    .nav-center { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; justify-content: center; }
    .nav-right { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .nav a {
      display: inline-block;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fffdf7;
      white-space: nowrap;
    }
    .nav a.active { background: var(--green); border-color: var(--green); color: white; }
    .project-select {
      min-width: 280px;
      max-width: 520px;
      border: 1px solid var(--line);
      background: #fffdf7;
      border-radius: 999px;
      padding: 8px 12px;
      outline: none;
    }
    .app {
      height: calc(100vh - 58px);
      display: grid;
      grid-template-columns: 320px minmax(520px, 1fr) 380px;
      gap: 14px;
      padding: 14px;
    }
    .panel {
      background: rgba(255,250,241,.94);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .toolbar, .tabs {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn, .tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      background: #fffdf7;
      cursor: pointer;
      color: var(--ink);
    }
    .btn.primary, .tab.active { color: white; background: var(--green); border-color: var(--green); }
    .btn.orange { color: white; background: var(--orange); border-color: var(--orange); }
    .list, .detail-body, .side-body { overflow: auto; min-height: 0; }
    .detail-body { flex: 1; }
    .list { padding: 9px; }
    .item {
      width: 100%;
      text-align: left;
      background: #fffdf7;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 11px;
      margin-bottom: 8px;
      cursor: pointer;
      color: var(--ink);
    }
    .item:hover, .item.active { border-color: var(--green); background: #f2faf0; }
    .item-title { font-weight: 700; font-size: 15px; line-height: 1.25; }
    .item-meta { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.35; }
    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e4efe4;
      color: #285a37;
      margin: 5px 4px 0 0;
    }
    .draft-view, .markdown {
      height: 100%;
      overflow: auto;
      padding: 28px 34px;
      background: #fffdf7;
      line-height: 1.6;
      font-size: 16px;
    }
    .markdown img, .draft-view img { max-width: 100%; border: 1px solid var(--line); border-radius: 10px; }
    .markdown a, .draft-view a { color: var(--green); text-decoration-thickness: 1px; }
    .markdown code, .draft-view code {
      padding: 2px 5px;
      border-radius: 6px;
      background: #efe6d4;
      color: #5c3c20;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: .9em;
    }
    .markdown p:has(img), .draft-view p:has(img) { text-align: center; }
    .markdown table, .draft-view table {
      border-collapse: collapse;
      width: max-content;
      max-width: 100%;
      margin: 18px 0;
      background: white;
      font-size: 13px;
      line-height: 1.35;
      display: block;
      overflow-x: auto;
    }
    .markdown th, .markdown td, .draft-view th, .draft-view td {
      border: 1px solid #cfc2aa;
      padding: 7px 9px;
      vertical-align: top;
      min-width: 72px;
    }
    .markdown th, .markdown tr:first-child td, .draft-view th, .draft-view tr:first-child td {
      background: #efe6d4;
      font-weight: 700;
    }
    .markdown details, .draft-view details {
      margin: 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbf4e5;
    }
    .markdown summary, .draft-view summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--green);
    }
    .markdown .math, .draft-view .math {
      font-family: "Times New Roman", Georgia, serif;
      white-space: nowrap;
    }
    .markdown .caption, .draft-view .caption {
      margin: 16px 0 8px;
      font-weight: 700;
      color: #4d3923;
    }
    .markdown .raw-block, .draft-view .raw-block { margin: 12px 0; }
    .edit-pane {
      height: 100%;
      min-height: 0;
      padding: 18px;
      background: linear-gradient(180deg, #f7f0e3 0%, #fbf7ed 100%);
    }
    .editor {
      width: 100%;
      height: 100%;
      min-height: 320px;
      resize: none;
      border: 1px solid #d7cbb7;
      border-radius: 14px;
      outline: none;
      padding: 22px 24px 28px;
      background: #fffdf7;
      color: #25231c;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 26px rgba(54,43,25,.08);
      caret-color: var(--green);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.65;
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .editor:hover { border-color: #b9aa91; }
    .editor:focus {
      border-color: var(--green);
      background: #fffefb;
      box-shadow: 0 0 0 3px rgba(30,106,88,.12), 0 14px 30px rgba(54,43,25,.10);
    }
    .editor::selection { color: #173f36; background: #d9ece5; }
    .editor:disabled { cursor: not-allowed; color: var(--muted); background: #f2ecdf; }
    .side-body { padding: 12px; }
    .field { margin-bottom: 12px; }
    .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 4px;
    }
    .value { font-size: 14px; line-height: 1.35; }
    .message {
      position: fixed;
      right: 18px;
      bottom: 18px;
      padding: 11px 15px;
      border-radius: 12px;
      background: #15251f;
      color: white;
      box-shadow: var(--shadow);
      display: none;
      max-width: 420px;
    }
    .message.show { display: block; }
    .para-block { position:relative; border:1px solid transparent; border-radius:8px; padding:8px 10px; margin:4px 0; }
    .para-block:hover { border-color:var(--line); background:#fffaf1; }
    .para-actions { display:none; gap:6px; margin:0 0 8px; }
    .para-block:hover .para-actions { display:flex; }
    .para-actions button { border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; padding:3px 8px; }
    .para-inline-editor { width:100%; min-height:150px; resize:vertical; padding:10px; border:1px solid var(--green); border-radius:8px; font:inherit; line-height:1.55; }
    .para-inline-controls { display:flex; gap:8px; margin-top:8px; }
    .draft-workflow { display:grid; gap:10px; }
    .workflow-step { padding:12px 13px; border:1px solid var(--line); border-radius:12px; background:#fffdf7; }
    .workflow-step strong { display:block; margin-bottom:4px; color:#234f43; }
    .workflow-step span { display:block; color:var(--muted); font-size:12px; line-height:1.45; }
    .checks-view { height:100%; overflow:auto; padding:22px 26px 30px; background:#fffdf7; }
    .checks-intro { margin:0 0 14px; padding:11px 13px; border-radius:11px; background:#eef6f2; color:#3f5d53; font-size:13px; line-height:1.5; }
    .check-card { margin-bottom:14px; padding:16px 18px; border:1px solid var(--line); border-radius:14px; background:#fffaf1; }
    .check-card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
    .check-card h3 { font-size:16px; }
    .check-status { flex:0 0 auto; padding:3px 8px; border-radius:999px; background:#e4efe4; color:#285a37; font-size:11px; }
    .check-status.review { background:#f7e4cd; color:#8a4b20; }
    .check-help { margin:0 0 10px; color:var(--muted); font-size:13px; line-height:1.45; }
    .check-content { padding-top:8px; border-top:1px solid #e5dac6; }
    .check-content.markdown { height:auto; overflow:visible; padding:8px 0 0; background:transparent; font-size:14px; }
  </style>

</head>
<body>
  <nav class="nav">
    <div class="nav-title">Review Writer Dashboard</div>
    <div class="nav-center">
      <select id="projectSelect" class="project-select"></select>
    </div>
    <div class="nav-right">
      <a href="/library">Library</a>
      <a href="/discovery">Discovery</a>
      <a href="/matrix">Matrix</a>
      <a href="/blueprint">Blueprint</a>
      <a href="/sections">Sections</a>
      <a href="/figures">Figures</a>

      <a href="/final">Final</a>
    </div>
  </nav>
  <main class="app">
    <section class="panel">
      <div class="head">
        <h1>Project Draft</h1>
        <div id="projectInfo" class="sub">Loading project...</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="reloadBtn">Reload</button>
        <button class="btn primary" id="saveBtn">Save Draft</button>
      </div>
      <div id="leftList" class="list"></div>
    </section>
    <section class="panel">
      <div class="head">
        <h2 id="detailTitle">Draft Preview</h2>
        <div id="detailMeta" class="sub"></div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="preview">Draft Preview</button>
        <button class="tab" data-tab="edit">Full-text Edit</button>
        <button class="tab" data-tab="checks">Review Checks</button>
      </div>
      <div class="detail-body">
        <div id="preview" class="draft-view"></div>
        <div id="edit" class="edit-pane" style="display:none">
          <textarea id="draftEditor" class="editor" spellcheck="false"></textarea>
        </div>
        <div id="checks" class="checks-view" style="display:none"></div>
      </div>
    </section>
    <section class="panel">
      <div class="head">
        <h2>Project Status</h2>
        <div class="sub">Same project across discovery, drafting, redraw, and merge.</div>
      </div>
      <div class="side-body">
        <div id="summaryBox"></div>
      </div>

  <div id="message" class="message"></div>
  <script src="/assets/dashboard/review-i18n.js?v=20260805d"></script>
  <script src="/assets/dashboard/review-ui.js?v=20260805d"></script>
  <script>
    let projects = [];
    let selectedProject = '';
    let payload = null;
    let activeTab = 'preview';
    const els = {
      projectSelect: document.getElementById('projectSelect'),
      projectInfo: document.getElementById('projectInfo'),
      leftList: document.getElementById('leftList'),
      detailTitle: document.getElementById('detailTitle'),
      detailMeta: document.getElementById('detailMeta'),
      preview: document.getElementById('preview'),
      draftEditor: document.getElementById('draftEditor'),
      checks: document.getElementById('checks'),
      summaryBox: document.getElementById('summaryBox'),
      message: document.getElementById('message')
    };
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function msg(text) { els.message.textContent = text; els.message.classList.add('show'); setTimeout(() => els.message.classList.remove('show'), 2600); }
    function simpleMathToHtml(expr) {
      let s = String(expr ?? '');
      s = s.replace(/\\mathrm\s*\{\s*([^{}]+?)\s*\}/g, '$1');
      s = s.replace(/\\prime/g, '′');
      s = s.replace(/\\[a-zA-Z]+/g, '');
      s = s.replace(/\s+/g, ' ').trim();
      s = esc(s);
      s = s.replace(/_\s*\{\s*([^{}]+?)\s*\}/g, '<sub>$1</sub>');
      s = s.replace(/\^\s*\{\s*([^{}]+?)\s*\}/g, '<sup>$1</sup>');
      s = s.replace(/_([A-Za-z0-9′+-]+)/g, '<sub>$1</sub>');
      s = s.replace(/\^([A-Za-z0-9′+-]+)/g, '<sup>$1</sup>');
      return `<span class="math">${s}</span>`;
    }
    function renderInline(text) {
      const parts = String(text ?? '').split(/(\$[^$\n]+\$)/g);
      return parts.map(part => {
        if (part.startsWith('$') && part.endsWith('$')) return simpleMathToHtml(part.slice(1, -1));
        let s = esc(part);
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
          if (/^https?:\/\//i.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${label}</a>`;
          return m;
        });
        return s;
      }).join('');
    }
    function sanitizeAllowedHtml(raw) {
      const allowedTags = new Set(['DIV','DETAILS','SUMMARY','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','CAPTION','P','BR','B','STRONG','I','EM','SUB','SUP','SPAN','IMG']);
      const template = document.createElement('template');
      template.innerHTML = raw;
      const walk = node => {
        if (node.nodeType === Node.TEXT_NODE) {
          const span = document.createElement('span');
          span.innerHTML = renderInline(node.textContent || '');
          node.replaceWith(...Array.from(span.childNodes));
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (!allowedTags.has(node.tagName)) {
          node.replaceWith(document.createTextNode(node.textContent || ''));
          return;
        }
        [...node.attributes].forEach(attr => {
          const name = attr.name.toLowerCase();
          if (!['colspan', 'rowspan', 'open', 'class', 'src', 'alt'].includes(name)) node.removeAttribute(attr.name);
          if (name === 'src' && !String(attr.value || '').startsWith('/file?')) node.removeAttribute(attr.name);
        });
        [...node.childNodes].forEach(walk);
      };
      [...template.content.childNodes].forEach(walk);
      return template.innerHTML;
    }
    function fileUrlForMarkdownPath(path, baseDir = '') {
      const raw = String(path || '').trim();
      if (!raw) return '';
      if (/^https?:\/\//i.test(raw)) return raw;
      if (raw.startsWith('/')) return `/file?path=${encodeURIComponent(raw)}`;
      const base = String(baseDir || payload?.paths?.first_draft_base_dir || payload?.paths?.stage_dir || '').replace(/\/+$/, '');
      return `/file?path=${encodeURIComponent(base ? `${base}/${raw}` : raw)}`;
    }
    function renderMarkdown(md, baseDir = '') {
      const blocks = [];
      const stash = html => {
        const key = `@@HTML_BLOCK_${blocks.length}@@`;
        blocks.push(sanitizeAllowedHtml(html));
        return key;
      };
      let text = String(md ?? '');
      text = text.replace(/<details[\s\S]*?<\/details>/gi, match => stash(`<div class="raw-block">${match}</div>`));
      text = text.replace(/<table[\s\S]*?<\/table>/gi, match => stash(match));
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, path) => {
        const src = fileUrlForMarkdownPath(path, baseDir);
        return stash(`<img alt="${esc(alt)}" src="${src}">`);
      });
      const html = text.split(/\n{2,}/).map(rawBlock => {
        const block = rawBlock.trim();
        if (!block) return '';
        const marker = block.match(/^@@HTML_BLOCK_(\d+)@@$/);
        if (marker) return blocks[Number(marker[1])] || '';
        let m = block.match(/^###\s+(.+)$/);
        if (m) return `<h3>${renderInline(m[1])}</h3>`;
        m = block.match(/^##\s+(.+)$/);
        if (m) return `<h2>${renderInline(m[1])}</h2>`;
        m = block.match(/^#\s+(.+)$/);
        if (m) return `<h1>${renderInline(m[1])}</h1>`;
        if (/^(Scheme|Table|Figure)\s+\d+/i.test(block)) return `<div class="caption">${renderInline(block).replace(/\n/g, '<br>')}</div>`;
        return `<p>${renderInline(block).replace(/\n/g, '<br>')}</p>`;
      }).join('\n');
      return html.replace(/@@HTML_BLOCK_(\d+)@@/g, (_, i) => blocks[Number(i)] || '');
    }
    function renderMarkdownWithParagraphs(md, baseDir = '') {
      const body = String(md || '');
      const marker = /<!--\s*paragraph_id:\s*([\w.:-]+)\s*-->/g;
      const parts = []; let previous = 0; let match;
      while ((match = marker.exec(body))) {
        const text = body.slice(previous, match.index).trim();
        const id = match[1]; previous = marker.lastIndex;
        if (!text || /^#{1,6}\s/.test(text) || /^#{1,6}\s+references/i.test(text)) continue;
        parts.push(`<div class="para-block" data-paragraph-id="${esc(id)}"><div class="para-actions"><button onclick="beginParagraphEdit('${esc(id)}')">编辑</button><button onclick="insertParagraph('${esc(id)}')">插入</button><button onclick="historyParagraph('${esc(id)}')">历史</button><button onclick="deleteParagraph('${esc(id)}')">删除</button></div><div class="para-content">${renderMarkdown(text, baseDir)}</div></div>`);
      }
      return parts.length ? parts.join('') : renderMarkdown(body, baseDir);
    }
    async function paragraphRequest(path, method, body) {
      if (payload?.freshness?.editing_blocked) { msg('上游章节或审核图片已更新，请先重新生成初稿。'); return null; }
      const res = await fetch(`/api/project/${encodeURIComponent(selectedProject)}${path}`, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      const data = await res.json();
      if (!res.ok) { msg(data.error || '段落操作失败'); return null; }
      await loadProject(selectedProject); return data;
    }
    async function beginParagraphEdit(id) {
      const response = await fetch(`/api/project/${encodeURIComponent(selectedProject)}/paragraph/${encodeURIComponent(id)}`);
      const paragraph = await response.json();
      if (!response.ok) { msg(paragraph.error || '无法读取段落'); return; }
      const block = els.preview.querySelector(`[data-paragraph-id="${id}"]`);
      const content = block?.querySelector('.para-content');
      if (!content) return;
      content.innerHTML = `<textarea class="para-inline-editor" spellcheck="false"></textarea><div class="para-inline-controls"><button class="btn primary">保存</button><button class="btn">取消</button></div>`;
      const editor = content.querySelector('textarea');
      editor.value = paragraph.text || '';
      content.querySelector('.primary').onclick = () => saveInlineParagraphEdit(id, editor.value);
      content.querySelector('.btn:not(.primary)').onclick = () => renderCurrent();
      editor.focus();
    }
    async function saveInlineParagraphEdit(id, text) {
      const result = await paragraphRequest(`/paragraph/${encodeURIComponent(id)}`, 'PUT', {text, reason:'dashboard inline edit'});
      if (result) msg('段落已保存');
    }
    async function insertParagraph(id) { const text = prompt(`在 ${id} 后插入段落`); if (text) await paragraphRequest('/paragraph', 'POST', {after_paragraph_id:id, text}); }
    async function historyParagraph(id) { const res = await fetch(`/api/project/${encodeURIComponent(selectedProject)}/paragraph/${encodeURIComponent(id)}/history`); const history = await res.json(); if (!history.length) { msg('该段落暂无历史版本。'); return; } const options = history.map((item, index) => `${index}: ${item.timestamp} ${item.operation}`).join('\n'); const choice = prompt(`输入要恢复的版本序号：\n${options}`, String(history.length - 1)); if (choice !== null && /^-?\d+$/.test(choice) && confirm('恢复后将创建新的历史记录。')) await paragraphRequest(`/paragraph/${encodeURIComponent(id)}/rollback`, 'POST', {version:Number(choice)}); }
    async function deleteParagraph(id) { if (confirm(`删除段落 ${id}？将自动重排引用编号。`)) await paragraphRequest(`/paragraph/${encodeURIComponent(id)}`, 'DELETE', {reason:'dashboard delete'}); }
    async function loadProjects() {
      projects = await (await fetch('/api/projects')).json();
      els.projectSelect.innerHTML = projects.map(p => `<option value="${esc(p.project_id)}">${esc(p.project_id)}</option>`).join('');
      if (projects.length) {
        const initial = window.reviewUi?.initialProject(projects) || projects[0];
        selectedProject = initial.project_id;
        els.projectSelect.value = selectedProject;
        await loadProject(selectedProject);
      } else {
        els.projectInfo.textContent = 'No review projects found.';
      }
    }
    async function loadProject(projectId) {
      selectedProject = projectId;
      payload = await (await fetch(`/api/project/${encodeURIComponent(projectId)}/draft`)).json();
      const editingBlocked = Boolean(payload?.freshness?.editing_blocked);
      els.draftEditor.value = editingBlocked ? '' : (payload.first_draft_md || '');
      els.draftEditor.disabled = editingBlocked;
      document.getElementById('saveBtn').disabled = editingBlocked;
      renderLeft();
      renderSummary();
      renderCurrent();
    }
    function renderLeft() {
      const stale = Boolean(payload?.freshness?.stale);
      els.leftList.innerHTML = `
        <div class="draft-workflow">
          <div class="workflow-step"><strong>1. Draft Preview</strong><span>Read the composed manuscript and edit individual paragraphs in context.</span></div>
          <div class="workflow-step"><strong>2. Full-text Edit</strong><span>Edit the complete Markdown source when structure or multiple paragraphs must change together.</span></div>
          <div class="workflow-step"><strong>3. Review Checks</strong><span>Review merge notes and unresolved human checks together before Stage 9.</span></div>
          ${stale ? '<div class="workflow-step"><span class="pill warn">outdated</span><span>Upstream content changed; regenerate the first draft before editing.</span></div>' : payload?.summary?.has_figure_redraw ? '<div class="workflow-step"><span class="pill">figures ready</span><span>Reviewed figures are available to the current draft.</span></div>' : ''}
        </div>`;
      els.projectInfo.textContent = `${selectedProject} · ${payload?.topic || ''}`;
    }
    function renderSummary() {
      const s = payload?.summary || {};
      const redrawn = payload?.redrawn_figures || [];
      const stale = Boolean(payload?.freshness?.stale);
      const editingBlocked = Boolean(payload?.freshness?.editing_blocked);
      els.summaryBox.innerHTML = `
        <div class="field"><div class="label">Current Draft</div><div class="value">${editingBlocked ? '已过期：请基于当前章节和已审核图片重新生成初稿。' : stale ? '当前文件包含尚未登记的修改，可以检查后保存。' : 'current'}</div></div>
        <div class="field"><div class="label">Project</div><div class="value">${esc(selectedProject)}</div></div>
        <div class="field"><div class="label">Topic</div><div class="value">${esc(payload?.topic || '')}</div></div>
        <div class="field"><div class="label">Stage Status</div><div class="value">
          <span class="pill">discovery=${esc(s.discovery_status || 'pending')}</span>
          <span class="pill">matrix=${esc(Boolean(s.has_matrix_outline))}</span>
          <span class="pill">sections=${esc(Boolean(s.has_section_drafting))}</span>
          <span class="pill">redraw=${esc(Boolean(s.has_figure_redraw))}</span>
          <span class="pill">draft=${esc(Boolean(s.has_first_draft))}</span>
        </div></div>
        <div class="field"><div class="label">Redrawn Figures</div><div class="value">${esc(redrawn.length)}</div></div>
        <div class="field"><div class="label">Draft Files</div><div class="value">${esc(payload?.paths?.stage_dir || '')}</div></div>
      `;
    }
    function renderReviewChecks() {
      const mergeReport = String(payload?.merge_report_md || '').trim();
      const remainingIssues = String(payload?.remaining_issues_md || '').trim();
      return `
        <div class="checks-intro">Merge notes and remaining issues are read-only evidence, so they are grouped here. Correct manuscript text in Draft Preview or Full-text Edit.</div>
        <section class="check-card">
          <div class="check-card-head"><h3>Merge and normalization</h3><span class="check-status">${mergeReport ? 'report available' : 'no report'}</span></div>
          <p class="check-help">Confirms how section text, transitions, terminology, citations, and figures were assembled. It is not a second editable draft.</p>
          <div class="check-content markdown">${mergeReport ? renderMarkdown(mergeReport, payload?.paths?.stage_dir || '') : '<p>No separate merge warning was produced.</p>'}</div>
        </section>
        <section class="check-card">
          <div class="check-card-head"><h3>Human review items</h3><span class="check-status ${remainingIssues ? 'review' : ''}">${remainingIssues ? 'review required' : 'none recorded'}</span></div>
          <p class="check-help">Check scientific interpretation, scope boundaries, citations, and every retained figure before continuing to Stage 9.</p>
          <div class="check-content markdown">${remainingIssues ? renderMarkdown(remainingIssues, payload?.paths?.stage_dir || '') : '<p>No remaining issue file was produced.</p>'}</div>
        </section>`;
    }
    function syncActiveTab() {
      const valid = new Set(['preview', 'edit', 'checks']);
      if (!valid.has(activeTab)) activeTab = 'preview';
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === activeTab));
      for (const id of valid) document.getElementById(id).style.display = id === activeTab ? 'block' : 'none';
    }
    function renderCurrent() {
      if (payload?.freshness?.editing_blocked) {
        activeTab = 'preview';
        els.detailTitle.textContent = '初稿已过期';
        els.detailMeta.textContent = '当前 Blueprint、章节或审核图片已经更新。';
        els.preview.innerHTML = '<div class="empty">请重新生成初稿。旧初稿保留在磁盘中，但不会作为当前流程内容显示或保存。</div>';
        els.checks.innerHTML = '';
        syncActiveTab();
        return;
      }
      const titles = {
        preview:['Draft Preview','Read the manuscript and edit individual paragraphs in context.'],
        edit:['Full-text Edit','Edit and save the complete Markdown source.'],
        checks:['Review Checks','Merge evidence and open human-review items before Stage 9.']
      };
      els.detailTitle.textContent = titles[activeTab][0];
      els.detailMeta.textContent = titles[activeTab][1];
      els.preview.innerHTML = renderMarkdownWithParagraphs(els.draftEditor.value || '', payload?.paths?.first_draft_base_dir || payload?.paths?.stage_dir || '');
      els.checks.innerHTML = renderReviewChecks();
      syncActiveTab();
    }
    async function saveDraft(options = {}) {
      if (!selectedProject) return false;
      if (document.querySelector('.para-inline-editor')) {
        msg('请先保存或取消当前段落编辑。');
        return false;
      }
      const silent = Boolean(options.silent);
      const res = await fetch(`/api/project/${encodeURIComponent(selectedProject)}/draft`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          first_draft_md: els.draftEditor.value,
          draft_bundle: payload?.draft_bundle || {}
        })
      });
      if (!res.ok) { msg(await res.text()); return false; }
      if (!silent) msg('Draft saved');
      await loadProject(selectedProject);
      return true;
    }
    window.reviewDraftSaveForHandoff = () => saveDraft({silent:true});
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
      activeTab = tab.dataset.tab;
      renderCurrent();
    }));
    els.projectSelect.addEventListener('change', e => loadProject(e.target.value));
    document.getElementById('reloadBtn').addEventListener('click', () => selectedProject && loadProject(selectedProject));
    document.getElementById('saveBtn').addEventListener('click', saveDraft);
    loadProjects().catch(err => msg(err.message));
  </script>
</body>
</html>
