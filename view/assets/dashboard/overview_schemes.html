<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview Schemes</title><link rel="stylesheet" href="/assets/dashboard/review-ui.css"><style>body{margin:0;background:#f7f4eb;color:#20231d;font-family:Georgia,"Times New Roman",serif}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;gap:12px;background:#fffdf7;border-bottom:1px solid #d8ceb9}.project-select{min-width:310px;padding:8px;border:1px solid #d8ceb9;border-radius:999px}.app{display:grid;grid-template-columns:290px minmax(520px,1fr) 330px;gap:14px;padding:14px;height:calc(100vh - 58px)}.panel{background:#fffdf7;border:1px solid #d8ceb9;border-radius:14px;overflow:auto}.head,.list,.main,.side{padding:12px}.head{border-bottom:1px solid #d8ceb9}.card{width:100%;text-align:left;border:1px solid #d8ceb9;background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}.card.active{border-color:#1f6b55;background:#f0faf3}.meta{font-size:12px;color:#687064;margin-top:4px}.pill{font-size:11px;border-radius:999px;padding:3px 7px;background:#e4efe4;display:inline-block;margin-top:6px}.warn{background:#f8dfd2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box,.candidate{border:1px solid #d8ceb9;border-radius:10px;padding:10px;margin:8px 0}.box img,.candidate img{max-width:100%;max-height:390px;display:block;margin:auto}.candidate img{max-height:130px}.btn{border:1px solid #1f6b55;background:#1f6b55;color:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;margin:4px}.reject{background:#934225;border-color:#934225}.note{width:100%;min-height:70px}@media(max-width:1000px){.app{height:auto;grid-template-columns:1fr}.panel{min-height:320px}}</style></head>
<body><nav class="nav"><b>Review Writer · Overview Schemes</b><select id="project" class="project-select"></select></nav><main class="app"><section class="panel"><div class="head"><b>Per-paper review</b><div id="count" class="meta"></div></div><div id="list" class="list"></div></section><section class="panel"><div class="head"><b id="title">Select a paper</b><div id="meta" class="meta"></div></div><div id="main" class="main"></div></section><section class="panel"><div class="head"><b>Manual candidate replacement</b><div class="meta">Figure stage has already selected the main-reaction candidate. This stage only allows human replacement and approval.</div></div><div id="review" class="side"></div></section></main><script src="/assets/dashboard/review-ui.js"></script><script>
let projects=[],payload={figures:[]},selected=0;const requestedProject=new URLSearchParams(window.location.search).get('project')||'';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),file=p=>p?`/file?path=${encodeURIComponent(p)}`:'';const rows=()=>payload.figures||[];
async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('project').innerHTML=projects.map(x=>`<option value="${esc(x.project_id)}">${esc(x.project_id)}</option>`).join('');const initial=projects.find(x=>x.project_id===requestedProject)?.project_id||projects[0]?.project_id;if(initial){$('project').value=initial;await load()}}async function load(){payload=await(await fetch(`/api/project/${encodeURIComponent($('project').value)}/overview-schemes`)).json();selected=0;render()}
function renderList(){const pending=rows().filter(x=>x.review_status!=='approved').length;$('count').textContent=`${rows().length} papers · ${pending} awaiting approval`;$('list').innerHTML=rows().map((x,i)=>`<button class="card ${i===selected?'active':''}" data-i="${i}"><b>${esc(x.paper_id)}</b><div class="meta">${esc(x.title)}</div><span class="pill ${x.review_status==='approved'?'':'warn'}">${esc(x.review_status||'pending')}</span></button>`).join('')}
function renderMain(){const x=rows()[selected];if(!x)return;$('title').textContent=`${x.paper_id} · main-reaction overview`;$('meta').textContent=`score ${x.selection_score??'n/a'} · ${x.selection_status||''}`;$('main').innerHTML=`<div class="grid"><div class="box"><b>Selected black-and-white overview</b><a href="${file(x.generated_image)}" target="_blank"><img src="${file(x.generated_image)}"></a></div><div class="box"><b>Original source</b><a href="${file(x.selected_source_figure?.source_image_path)}" target="_blank"><img src="${file(x.selected_source_figure?.source_image_path)}"></a></div></div><h3>Selection reason</h3><div>${esc((x.selection_reason||[]).join('\n'))}</div><h3>Other candidates</h3>${(x.candidate_figures||[]).map(c=>`<div class="candidate"><b>Candidate ${c.candidate_index}</b><button class="btn" data-candidate="${c.candidate_index}">Use this candidate</button><a href="${file(c.source_image_path)}" target="_blank"><img src="${file(c.source_image_path)}"></a></div>`).join('')}`}
function renderReview(){const x=rows()[selected];if(!x)return;$('review').innerHTML=`<div class="meta">Current: ${esc(x.review_status||'pending')}</div><textarea id="note" class="note" placeholder="Why this is or is not the main reaction overview">${esc(x.review_note||'')}</textarea><div><button class="btn" data-action="approve">Approve</button><button class="btn reject" data-action="reject">Reject</button></div><p class="meta">Automatic ranking does not run here. Use ?Use this candidate? to replace the image manually.</p>`}function render(){renderList();renderMain();renderReview()}
$('project').addEventListener('change',load);$('list').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){selected=Number(b.dataset.i);render()}});async function submit(action,candidate_index){const x=rows()[selected];const note=$('note')?.value||'';const r=await fetch(`/api/project/${encodeURIComponent($('project').value)}/overview-schemes/${encodeURIComponent(x.paper_id)}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,candidate_index,review_note:note})});if(!r.ok){alert(await r.text());return}await load()}$('review').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)submit(b.dataset.action)});$('main').addEventListener('click',e=>{const b=e.target.closest('[data-candidate]');if(b)submit('select',Number(b.dataset.candidate))});loadProjects();
</script></body></html>
