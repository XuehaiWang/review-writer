<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Final</title>
<link rel="stylesheet" href="/assets/dashboard/review-ui.css">
<style>
:root{--ink:#1f2024;--muted:#69707b;--line:#d7cbb7;--green:#1e6a58;--paper:#fffdf7;--panel:#fffaf1}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#efe3cc;font:14px Georgia,"Times New Roman",serif}.nav{padding:9px 14px;display:flex;gap:12px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line)}.nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select,.btn,.tab,.item{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px 11px;font:inherit}.project-select{min-width:280px}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{padding:7px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink);text-decoration:none;background:var(--paper)}.nav a.active,.tab.active,.btn.primary{color:#fff;background:var(--green);border-color:var(--green)}.app{height:calc(100vh - 56px);padding:14px;gap:14px;display:grid;grid-template-columns:250px minmax(580px,1fr) 315px}.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.head,.tabs{padding:14px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0}.sub,.meta{margin-top:5px;color:var(--muted);font-size:12px}.list,.main,.side{min-height:0;overflow:auto}.list,.side{padding:10px}.item{width:100%;margin-bottom:7px;text-align:left;cursor:pointer}.item.active{border-color:var(--green)}.tabs{display:flex;gap:7px}.main{padding:42px 58px;background:var(--paper);font-size:16px;line-height:1.75}.main h1{font-size:30px;line-height:1.2;margin:0 0 28px}.main h2{font-size:23px;margin:38px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--line)}.main h3{font-size:19px;margin:25px 0 10px}.main p{margin:0 0 16px;text-align:justify}.main figure{text-align:center;margin:25px auto}.main img{max-width:100%;border:1px solid var(--line);border-radius:8px}.main figcaption{color:var(--muted);font-size:13px}.main table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}.main th,.main td{border:1px solid var(--line);padding:7px;vertical-align:top}.main th{background:#eee4d1}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.field{margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:1050px){.app{height:auto;grid-template-columns:1fr}.panel{min-height:300px}.nav{flex-wrap:wrap}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a href="/sections">Sections</a><a href="/figures">Figures</a><a href="/draft">Draft</a><a class="active" href="/final">Final</a></div></nav>
<main class="app"><section class="panel"><div class="head"><h2>Final Output</h2><div id="projectInfo" class="sub"></div></div><div id="docList" class="list"></div></section><section class="panel"><div class="head"><h2 id="mainTitle">Conclusion</h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-doc="conclusion">Conclusion</button><button class="tab" data-doc="outline-chart">Outline Images</button><button class="tab" data-doc="final">Final Draft</button><button class="tab" data-doc="audit">Audit</button><button class="tab" data-doc="release">Release</button></div><article id="main" class="main"></article></section><aside class="panel"><div class="head"><h2>Review Gate</h2></div><div class="side"><section class="field" aria-label="Final generation actions"><div class="label">Generation</div><div class="actions"><button id="final-conclusion" class="btn primary" data-final-stage="final-conclusion">Generate Conclusion</button><button id="final-outline-chart" class="btn" data-final-stage="final-outline-chart">Generate Outline Images</button><button class="btn" data-final-stage="final">Generate Final Draft</button><button id="export-docx" class="btn">Generate &amp; Download Word</button></div><div id="finalActionStatus" class="sub" role="status" aria-live="polite"></div></section><div id="summary"></div></div></aside></main>
<script src="/assets/dashboard/review-ui.js"></script>
<script>
let projects=[],payload=null,selectedProject='',doc='conclusion';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fileUrl=p=>{if(!p)return '';if(/^https?:\/\//i.test(p)||p.startsWith('/'))return p;if(/^[A-Za-z]:[\\/]/.test(p))return '/file?path='+encodeURIComponent(p);const base=payload?.paths?.stage_dir||'';return '/file?path='+encodeURIComponent(base?base+'/'+p:p)};
const stale=()=>Boolean(payload?.freshness?.stale);
const docs=()=>[
  {id:'conclusion',title:'Conclusion',text:payload?.conclusion_generated_md||'',file:'conclusion_generated.md'},
  {id:'outline-chart',title:'Outline Images',text:'',file:'outline_chart_preview.md'},
  {id:'final',title:'Final Draft',text:payload?.final_draft_md||'',file:'final_draft.md'},
  {id:'audit',title:'Audit Report',text:payload?.final_audit_report_md||'',file:'final_audit_report.md'},
  {id:'release',title:'Release Report',text:payload?.release_report_md||'',file:'release_report.md'}
];

function renderMarkdown(markdown){return String(markdown||'').replace(/\n(!\[[^\]]*\]\([^)]+\))/g,'\n\n$1').replace(/(!\[[^\]]*\]\([^)]+\))\n(?=\S)/g,'$1\n\n').split(/\n{2,}/).filter(Boolean).map(raw=>{const v=raw.trim(),img=v.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(/^###\s+/.test(v))return '<h3>'+esc(v.replace(/^###\s+/,''))+'</h3>';if(/^##\s+/.test(v))return '<h2>'+esc(v.replace(/^##\s+/,''))+'</h2>';if(/^#\s+/.test(v))return '<h1>'+esc(v.replace(/^#\s+/,''))+'</h1>';if(img)return '<figure><img src="'+fileUrl(img[2])+'" alt="'+esc(img[1])+'"><figcaption>'+esc(img[1])+'</figcaption></figure>';if(/^\|/.test(v)){const rows=v.split('\n').filter(r=>!/^\|?\s*[-:]+/.test(r));return '<table>'+rows.map((r,i)=>'<tr>'+r.split('|').slice(1,-1).map(c=>(i?'td':'th')+'>'+esc(c.trim())+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'}return '<p>'+esc(v).replace(/\n/g,'<br>')+'</p>'}).join('')}
function chartFigure(path,label,note){return '<figure><img src="'+esc(fileUrl(path))+'" alt="'+esc(label)+'"><figcaption>'+esc(note)+'</figcaption></figure>'}
function insertChartAfterIntroduction(content,figure){const introduction=/<h([1-6])>[^<]*(?:introduction|background)[^<]*<\/h\1>([\s\S]*?)(?=<h\1>|$)/i;const match=content.match(introduction);if(!match||match.index===undefined)return content;const end=match.index+match[0].length;return content.slice(0,end)+figure+content.slice(end)}

async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(p=>'<option value="'+esc(p.project_id)+'">'+esc(p.project_id)+'</option>').join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
async function loadProject(id){selectedProject=id;payload=await(await fetch('/api/project/'+encodeURIComponent(id)+'/final')).json();render()}
function render(){const item=docs().find(x=>x.id===doc)||docs()[0];let content=item.text?renderMarkdown(item.text):'<p>This file has not been generated.</p>';if(item.id==='outline-chart'){content=payload?.outline_chart_preview_full_png_exists?chartFigure(payload.outline_chart_preview_full_png_path,'Outline chart preview','Preview only — not final or exportable.'):'<p>Generate outline images after a validated conclusion to view the preview.</p>'}else if(item.id==='final'&&payload?.release_chart_full_png_exists){content=insertChartAfterIntroduction(content,chartFigure(payload.release_chart_full_png_path,'Final summary chart','Full-review structure chart.'))}else if(item.id==='final'&&stale()){content='<p>Upstream content changed. Regenerate the final draft first.</p>'}$('mainTitle').textContent=item.title;$('mainMeta').textContent=item.file;$('main').innerHTML=content;$('projectInfo').textContent=selectedProject+' · '+(payload?.topic||'');$('docList').innerHTML=docs().map(x=>'<button class="item '+(x.id===doc?'active':'')+'" data-doc="'+x.id+'"><strong>'+esc(x.title)+'</strong><div class="meta">'+esc(x.file)+'</div></button>').join('');$('summary').innerHTML='<div class="field"><div class="label">Conclusion</div><div>'+(payload?.conclusion_current?'Validated conclusion is ready.':'Generate and validate a conclusion before outline images.')+'</div></div><div class="field"><div class="label">Final Audit</div><div>'+(payload?.final_draft_md&&!stale()?'ready':'not ready')+'</div></div>'+(payload?.final_draft_docx_exists?'<a class="btn" href="'+fileUrl(payload.final_draft_docx_path)+'" download>Download DOCX</a>':'');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.doc===doc))}
async function runFinalAction(stageId){const status=$('finalActionStatus'),controls=[...document.querySelectorAll('[data-final-stage]')];if(!selectedProject){status.textContent='Select a project before generating outputs.';return}const paths={'final-conclusion':'/run/final-conclusion','final-outline-chart':'/run/final-outline-chart',final:'/run/final'};controls.forEach(control=>control.disabled=true);status.textContent='Generating…';try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+paths[stageId],{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:'Server returned '+response.status+'.'}));if(!response.ok||!result.ok)throw new Error(result.error||'Server returned '+response.status+'.');await loadProject(selectedProject);status.textContent='Generation complete.'}catch(error){status.textContent=error.message||String(error)}finally{document.querySelectorAll('[data-final-stage]').forEach(control=>control.disabled=false)}}
async function exportDocx(){const status=$('finalActionStatus'),button=$('export-docx');if(!selectedProject){status.textContent='Select a project before exporting.';return}button.disabled=true;status.textContent='Generating Word document…';try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+'/export-docx',{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:'Server returned '+response.status+'.'}));if(!response.ok||!result.ok)throw new Error(result.error||'Word export failed.');await loadProject(selectedProject);status.textContent=result.message||'Word document generated. Download started.';if(result.path){const link=document.createElement('a');link.href=fileUrl(result.path);link.download='';document.body.appendChild(link);link.click();link.remove()}}catch(error){status.textContent=error.message||String(error)}finally{button.disabled=false}}
$('projectSelect').onchange=e=>loadProject(e.target.value);$('docList').onclick=e=>{const b=e.target.closest('[data-doc]');if(b){doc=b.dataset.doc;render()}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{doc=b.dataset.doc;render()});document.addEventListener('click',e=>{const exportButton=e.target.closest('#export-docx');if(exportButton){exportDocx();return}const button=e.target.closest('[data-final-stage]');if(button)runFinalAction(button.dataset.finalStage)});loadProjects();
</script>
</body>
</html>
