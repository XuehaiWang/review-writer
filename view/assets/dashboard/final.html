<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Review Final</title>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css?v=20260813h">
  <style>
    :root{--ink:#20231f;--muted:#6d716a;--line:#d8ccb8;--paper:#fffdf7;--panel:#fff9ef;--green:#1e6a58;--bad:#9a3c31}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:var(--ink);background:#efe4d1;font:14px Georgia,"Times New Roman",serif}button,select,input,textarea{font:inherit}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line)}.nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select,.btn,.tab,.item,input,textarea{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}.project-select{min-width:300px}.btn,.tab,.item{cursor:pointer}.btn.primary,.tab.active{color:#fff;background:var(--green);border-color:var(--green)}.btn:disabled{opacity:.55;cursor:not-allowed}.app{height:calc(100vh - 58px);display:grid;grid-template-columns:260px minmax(600px,1fr) 340px;gap:14px;padding:14px}.panel{min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.head,.tabs{padding:13px 15px;border-bottom:1px solid var(--line)}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.list,.main,.side{min-height:0;overflow:auto}.list,.side{padding:12px}.main{padding:34px 48px;background:var(--paper);font-size:16px;line-height:1.7}.item{width:100%;margin-bottom:8px;text-align:left}.item.active{border-color:var(--green);background:#eef8f4}.item strong{display:block}.meta,.sub{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}h1,h2,h3{margin:0}.main h1{font-size:28px}.main h2{font-size:21px;margin-top:30px}.main img{display:block;max-width:100%;max-height:620px;margin:18px auto;object-fit:contain}.main figure{text-align:center}.card{margin-bottom:12px;padding:13px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}.card.good{border-color:#79a995;background:#eef8f4}.card.bad{border-color:#c79787;background:#fff5f1}.field{margin-bottom:12px}.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px}.field input,.field textarea{width:100%}.field textarea{min-height:90px;resize:vertical}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8e0d2;font-size:11px}.pill.good{color:#356e3d;background:#e4f1e3}.pill.bad{color:#8b3025;background:#f6e1dc}@media(max-width:1050px){body{height:auto;overflow:auto}.app{height:auto;grid-template-columns:1fr}.panel{min-height:300px}}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"></div></nav>
  <main class="app">
    <aside class="panel"><div class="head"><h2 id="leftTitle"></h2><div id="projectInfo" class="sub"></div></div><div id="documentList" class="list"></div></aside>
    <section class="panel"><div class="head"><h2 id="mainTitle"></h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-doc="preparation"></button><button class="tab" data-doc="conclusion"></button><button class="tab" data-doc="overview"></button><button class="tab" data-doc="final"></button><button class="tab" data-doc="audit"></button><button class="tab" data-doc="release"></button></div><article id="main" class="main"></article></section>
    <aside class="panel"><div class="head"><h2 id="actionsTitle"></h2><div id="actionsHelp" class="sub"></div></div><div class="side"><div class="actions"><button class="btn primary" data-run="conclusion"></button><button class="btn" data-run="overview"></button><button class="btn" data-run="build"></button><button class="btn" data-run="export"></button><button id="cancelJob" class="btn" hidden></button></div><div id="actionStatus" class="sub" role="status" aria-live="polite"></div><div id="summary" style="margin-top:18px"></div></aside>
  </main>
  <script src="/assets/dashboard/review-i18n.js?v=20260813h"></script><script src="/assets/dashboard/review-ui.js?v=20260813h"></script>
  <script>
  const copy={preparation:['Final preparation','终稿准备'],conclusion:['Conclusion','结论'],overview:['Overview figure','综述总览图'],final:['Final manuscript','最终稿'],audit:['Final audit','终稿审计'],release:['Release report','发布报告'],left:['Final outputs','终稿输出'],actions:['Generation actions','生成操作'],help:['Final work is bound to the exact human-approved Draft version.','终稿工作严格绑定已人工确认的初稿版本。'],runConclusion:['Generate conclusion','生成结论'],runOverview:['Generate overview','生成总览图'],runBuild:['Build final manuscript','合并最终稿'],runExport:['Generate Word','生成 Word'],runCancel:['Cancel current task','取消当前任务'],approved:['Draft approved','初稿已确认'],required:['Draft approval required','需要先确认初稿'],current:['Current','当前'],optional:['Optional / not generated','可选 / 尚未生成'],stale:['Out of date','已过期'],queued:['Task is queued…','任务排队中…'],running:['Task is running…','任务运行中…'],cancelRequested:['Cancellation requested…','正在请求取消…'],cancelled:['Task cancelled.','任务已取消。'],interrupted:['Task interrupted; retry is available.','任务已中断，可以重试。'],failed:['Task failed.','任务失败。'],completed:['Task completed.','任务已完成。'],editable:['Editable overview text','可编辑的总览图文字'],saveText:['Save overview text','保存总览图文字'],title:['Title','标题'],subtitle:['Subtitle','副标题'],labels:['Labels (one per line)','标签（每行一个）'],download:['Download current DOCX','下载当前 DOCX'],notGenerated:['This output has not been generated.','该输出尚未生成。']};
  const apiErrorCopy={FINAL_NOT_READY:['Final work is not ready. Complete the Draft approval or audit requirements first.','终稿尚未就绪，请先完成初稿确认或审计要求。'],STATE_CONFLICT:['The workflow changed. Refresh and try again.','工作流已发生变化，请刷新后重试。'],WORKFLOW_VALIDATION_FAILED:['The submitted content is invalid. Check it and try again.','提交内容不符合要求，请检查后重试。'],WORKFLOW_NOT_FOUND:['The requested workflow item was not found.','未找到请求的工作流内容。'],JOB_EXECUTION_FAILED:['The model task failed. Retry it or check model settings.','模型任务失败，请重试或检查模型设置。'],PROCESS_INTERRUPTED:['The server interrupted this task; retry is available.','服务器中断了该任务，可以重试。']};
  const $=id=>document.getElementById(id),zh=()=>document.documentElement.lang==='zh-CN',t=key=>(copy[key]||[key,key])[zh()?1:0],esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  let projects=[],selectedProject='',payload={},doc='preparation',currentJobView={},currentJobId='';
  async function request(url,options={}){const response=await fetch(url,{cache:'no-store',...options});const data=await response.json().catch(()=>({}));if(!response.ok){const code=data.error?.code||data.detail?.code||'';const message=data.error?.message||data.detail?.message||data.detail||data.message||`HTTP ${response.status}`;throw new Error(apiErrorCopy[code]?.[zh()?1:0]||String(message))}return data}
  const base=()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/final`;
  const nativeRoutes={
    final:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/final`,
    conclusion:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/final/conclusion-jobs`,
    overview:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/final/overview-jobs`,
    overviewText:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/final/overview-text`,
    build:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/final/build`,
    export:()=>`/api/v1/projects/${encodeURIComponent(selectedProject)}/final/export-jobs`
  };
  function localizedJobStatus(){const status=currentJobView.status||'';if(status==='queued')return t('queued');if(status==='running')return t('running');if(status==='cancel_requested')return t('cancelRequested');if(status==='succeeded')return t('completed');if(status==='cancelled')return t('cancelled');if(status==='interrupted')return t('interrupted');if(status==='failed')return apiErrorCopy[currentJobView.error_code]?.[zh()?1:0]||t('failed');return ''}
  function renderJobStatus(){$('actionStatus').textContent=localizedJobStatus()}
  function markdown(value){let text=esc(String(value||'').replace(/<!--[\s\S]*?-->/g,''));text=text.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/!\[([^\]]*)\]\((\/api\/v1\/artifacts\/[^)]+)\)/g,'<figure><img src="$2" alt="$1"><figcaption>$1</figcaption></figure>');return text.split(/\n{2,}/).map(block=>/^<(?:h|figure)/.test(block)?block:`<p>${block.replace(/\n/g,'<br>')}</p>`).join('')}
  const documents=()=>[{id:'preparation',title:t('preparation')},{id:'conclusion',title:t('conclusion')},{id:'overview',title:t('overview')},{id:'final',title:t('final')},{id:'audit',title:t('audit')},{id:'release',title:t('release')}];
  function componentState(exists,current){return current?`<span class="pill good">${esc(t('current'))}</span>`:exists?`<span class="pill bad">${esc(t('stale'))}</span>`:`<span class="pill">${esc(t('optional'))}</span>`}
  function preparation(){const approval=payload.draft_approval?.record||payload.draft_approval||{};return `<div class="card ${payload.draft_approval_current?'good':'bad'}"><h3>${esc(payload.draft_approval_current?t('approved'):t('required'))}</h3><p>${approval.score===undefined?'':`Score: ${esc(approval.score)} / ${esc(approval.goal)}`}</p></div><div class="card"><strong>${esc(t('conclusion'))}</strong><div>${componentState(Boolean(payload.conclusion_artifact_id),payload.conclusion_current)}</div></div><div class="card"><strong>${esc(t('overview'))}</strong><div>${componentState(payload.overview_figure_exists,payload.overview_figure_current)}</div></div><div class="card"><strong>${esc(t('final'))}</strong><div>${componentState(Boolean(payload.final_artifact_id),payload.final_current)}</div></div>`}
  function overviewEditor(){const model=payload.overview_text||{};if(!payload.overview_figure_exists)return `<p>${esc(t('notGenerated'))}</p>`;return `<figure><img src="${esc(payload.overview_figure_url)}" alt="Overview figure"></figure><section class="card"><h3>${esc(t('editable'))}</h3><div class="field"><label>${esc(t('title'))}</label><input id="overviewTitle" value="${esc(model.title||'')}"></div><div class="field"><label>${esc(t('subtitle'))}</label><input id="overviewSubtitle" value="${esc(model.subtitle||'')}"></div><div class="field"><label>${esc(t('labels'))}</label><textarea id="overviewLabels">${esc((model.labels||[]).join('\n'))}</textarea></div><button id="saveOverviewText" class="btn primary">${esc(t('saveText'))}</button></section>`}
  function renderMain(){let content='';if(doc==='preparation')content=preparation();else if(doc==='conclusion')content=payload.conclusion_generated_md?markdown(payload.conclusion_generated_md):`<p>${esc(t('notGenerated'))}</p>`;else if(doc==='overview')content=overviewEditor();else if(doc==='final')content=payload.final_draft_md?markdown(payload.final_draft_md):`<p>${esc(t('notGenerated'))}</p>`;else if(doc==='audit')content=payload.final_audit_report_md?markdown(payload.final_audit_report_md):`<p>${esc(t('notGenerated'))}</p>`;else content=payload.release_report_md?markdown(payload.release_report_md):`<p>${esc(t('notGenerated'))}</p>`;$('main').innerHTML=content;$('mainTitle').textContent=documents().find(item=>item.id===doc)?.title||'';$('mainMeta').textContent=payload.freshness?.stale?t('stale'):t('current')}
  function renderSummary(){const ready=payload.draft_approval_current;$('summary').innerHTML=`<div class="card ${ready?'good':'bad'}"><strong>${esc(ready?t('approved'):t('required'))}</strong></div><div class="card">${esc(t('conclusion'))}: ${componentState(Boolean(payload.conclusion_artifact_id),payload.conclusion_current)}</div><div class="card">${esc(t('overview'))}: ${componentState(payload.overview_figure_exists,payload.overview_figure_current)}</div><div class="card">${esc(t('final'))}: ${componentState(Boolean(payload.final_artifact_id),payload.final_current)}</div><div class="card">${esc(t('release'))}: ${componentState(Boolean(payload.release_artifact_id),payload.release_current)}</div>${payload.final_draft_docx_exists?`<a class="btn primary" href="${esc(payload.docx_url)}" download="final_draft.docx">${esc(t('download'))}</a>`:''}`;document.querySelectorAll('[data-run]').forEach(button=>button.disabled=Boolean(currentJobId)||!ready||(button.dataset.run==='export'&&(!payload.final_current||!payload.release_current)))}
  function render(){document.documentElement.dataset.final='native';$('leftTitle').textContent=t('left');$('actionsTitle').textContent=t('actions');$('actionsHelp').textContent=t('help');$('projectInfo').textContent=selectedProject;const labels={conclusion:'runConclusion',overview:'runOverview',build:'runBuild',export:'runExport'};document.querySelectorAll('[data-run]').forEach(button=>button.textContent=t(labels[button.dataset.run]));$('cancelJob').textContent=t('runCancel');$('cancelJob').hidden=!currentJobId;$('cancelJob').disabled=currentJobView.status==='cancel_requested';$('documentList').innerHTML=documents().map(item=>`<button class="item ${item.id===doc?'active':''}" data-doc="${item.id}"><strong>${esc(item.title)}</strong></button>`).join('');document.querySelectorAll('[data-doc]').forEach(button=>{button.textContent=documents().find(item=>item.id===button.dataset.doc)?.title||'';button.classList.toggle('active',button.dataset.doc===doc)});renderMain();renderSummary();renderJobStatus()}
  async function loadProject(projectId){selectedProject=projectId;payload=await request(nativeRoutes.final());render()}
  async function waitJob(jobId){for(let attempt=0;attempt<1800;attempt++){const job=await request(`/api/v1/jobs/${encodeURIComponent(jobId)}`);if(currentJobId===jobId)currentJobView={status:job.status,error_code:job.error_code||''};render();if(['succeeded','failed','cancelled','interrupted'].includes(job.status)){const message=localizedJobStatus();if(currentJobId===jobId)currentJobId='';await loadProject(selectedProject);if(job.status!=='succeeded')throw new Error(message);return job}await new Promise(resolve=>setTimeout(resolve,1000))}if(currentJobId===jobId)currentJobId='';currentJobView={status:'failed',error_code:'JOB_TIMEOUT'};render();throw new Error(t('failed'))}
  async function run(action){if(currentJobId)return;let startedJobId='';try{let result;if(action==='build'){result=await request(nativeRoutes.build(),{method:'POST'});doc='final';await loadProject(selectedProject);$('actionStatus').textContent=t('completed');return}result=await request(nativeRoutes[action](),{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:'{}'});startedJobId=result.id;currentJobId=result.id;currentJobView={status:result.status||'queued',error_code:''};render();const job=await waitJob(result.id);if(action==='conclusion')doc='conclusion';if(action==='overview')doc='overview';if(action==='export'){const url=payload.docx_url||`/api/v1/artifacts/${encodeURIComponent(job.result.docx_artifact_id)}/content`;const link=document.createElement('a');link.href=url;link.download=job.result.download_name||'final_draft.docx';document.body.appendChild(link);link.click();link.remove()}render()}catch(error){if(currentJobId===startedJobId)currentJobId='';render();$('actionStatus').textContent=error.message}}
  async function cancelCurrentJob(){if(!currentJobId)return;try{const job=await request(`/api/v1/jobs/${encodeURIComponent(currentJobId)}/cancel`,{method:'POST'});currentJobView={status:job.status||'cancel_requested',error_code:job.error_code||''};render()}catch(error){$('actionStatus').textContent=error.message}}
  async function saveOverviewText(){try{await request(nativeRoutes.overviewText(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:payload.revision,title:$('overviewTitle').value,subtitle:$('overviewSubtitle').value,labels:$('overviewLabels').value.split(/\r?\n/).map(value=>value.trim()).filter(Boolean)})});await loadProject(selectedProject);doc='overview';render()}catch(error){$('actionStatus').textContent=error.message}}
  async function loadProjects(){const result=await request('/api/v1/projects');projects=result.items||[];$('projectSelect').innerHTML=projects.map(project=>`<option value="${esc(project.project_id)}">${esc(project.topic||project.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
  $('projectSelect').onchange=event=>loadProject(event.target.value);document.addEventListener('click',event=>{const documentButton=event.target.closest('[data-doc]');if(documentButton){doc=documentButton.dataset.doc;render();return}const runButton=event.target.closest('[data-run]');if(runButton){run(runButton.dataset.run);return}if(event.target.id==='cancelJob'){cancelCurrentJob();return}if(event.target.id==='saveOverviewText')saveOverviewText()});window.addEventListener('review-language-change',render);loadProjects().catch(error=>$('actionStatus').textContent=error.message);
  </script>
</body>
</html>
