<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Final</title>
<link rel="stylesheet" href="/assets/dashboard/review-ui.css?v=20260813g">
<style>
:root{--ink:#1f2024;--muted:#69707b;--line:#d7cbb7;--green:#1e6a58;--paper:#fffdf7;--panel:#fffaf1}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#efe3cc;font:14px Georgia,"Times New Roman",serif}.nav{padding:9px 14px;display:flex;gap:12px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line)}.nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select,.btn,.tab,.item{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px 11px;font:inherit}.project-select{min-width:280px}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{padding:7px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink);text-decoration:none;background:var(--paper)}.nav a.active,.tab.active,.btn.primary{color:#fff;background:var(--green);border-color:var(--green)}.app{height:calc(100vh - 56px);padding:14px;gap:14px;display:grid;grid-template-columns:250px minmax(580px,1fr) 315px}.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.head,.tabs{padding:14px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0}.sub,.meta{margin-top:5px;color:var(--muted);font-size:12px}.list,.main,.side{min-height:0;overflow:auto}.list,.side{padding:10px}.item{width:100%;margin-bottom:7px;text-align:left;cursor:pointer}.item.active{border-color:var(--green)}.tabs{display:flex;gap:7px;flex-wrap:wrap}.main{padding:42px 58px;background:var(--paper);font-size:16px;line-height:1.75}.main h1{font-size:30px;line-height:1.2;margin:0 0 28px}.main h2{font-size:23px;margin:38px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--line)}.main h3{font-size:19px;margin:25px 0 10px}.main p{margin:0 0 16px;text-align:justify}.main figure{text-align:center;margin:25px auto}.main img{max-width:100%;border:1px solid var(--line);border-radius:8px}.main figcaption{color:var(--muted);font-size:13px}.main table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}.main th,.main td{border:1px solid var(--line);padding:7px;vertical-align:top}.main th{background:#eee4d1}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.field{margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.prep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prep-card{padding:16px;border:1px solid var(--line);border-radius:10px;background:#fffaf1}.prep-card.ready{border-color:#78a992;background:#eef8f4}.prep-card.blocked{border-color:#c4976e;background:#fff6e9}.prep-card strong{display:block;margin-bottom:6px}.prep-score{font-size:26px;color:var(--green)}.btn:disabled{opacity:.55;cursor:not-allowed}@media(max-width:1050px){.app{height:auto;grid-template-columns:1fr}.panel{min-height:300px}.nav{flex-wrap:wrap}.prep-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"></div></nav>
<main class="app">
  <section class="panel"><div class="head"><h2>Final Output</h2><div id="projectInfo" class="sub"></div></div><div id="docList" class="list"></div></section>
  <section class="panel">
    <div class="head"><h2 id="mainTitle">Final Preparation</h2><div id="mainMeta" class="sub"></div></div>
    <div class="tabs"><button class="tab active" data-doc="preparation">Final Preparation</button><button class="tab" data-doc="conclusion">Conclusion</button><button class="tab" data-doc="overview-figure">Overview Figure</button><button class="tab" data-doc="final">Final Draft</button><button class="tab" data-doc="audit">Audit</button><button class="tab" data-doc="release">Release</button></div>
    <article id="main" class="main"></article>
  </section>
  <aside class="panel"><div class="head"><h2>Final Generation</h2><div class="sub">Final assembles and audits the human-approved Draft.</div></div><div class="side"><section class="field" aria-label="Final generation actions"><div class="label">Generation actions</div><div class="actions"><button id="final-conclusion" class="btn primary" data-final-stage="final-conclusion">Generate Conclusion (Optional)</button><button id="final-overview-figure" class="btn" data-final-stage="final-overview-figure">Generate Overview Figure</button><button class="btn" data-final-stage="final">Generate Final Draft</button><button id="export-docx" class="btn">Generate &amp; Download Word</button></div><div id="finalActionStatus" class="sub" role="status" aria-live="polite"></div></section><div id="summary"></div></div></aside>
</main>
<script src="/assets/dashboard/review-i18n.js?v=20260813g"></script>
<script src="/assets/dashboard/review-ui.js?v=20260813g"></script>
<script>
const finalDocumentIds=new Set(['preparation','conclusion','overview-figure','final','audit','release']);
function initialFinalDocument(){const requested=new URLSearchParams(window.location.search).get('doc');return finalDocumentIds.has(requested)?requested:'preparation'}
let projects=[],payload=null,selectedProject='',doc=initialFinalDocument();
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));
const finalText=(en,zh)=>document.documentElement.lang==='zh-CN'?zh:en;
const fileUrl=value=>{const raw=String(value??'').trim();if(!raw)return '';if(/^https?:\/\//i.test(raw)||/^(?:\/file\?|\/api\/|\/assets\/)/.test(raw))return raw;if(/^(?:[A-Za-z]:[\\/]|\/)/.test(raw))return '/file?path='+encodeURIComponent(raw);const base=payload?.paths?.stage_dir||'';return '/file?path='+encodeURIComponent(base?base+'/'+raw:raw)};
const docxDownloadName=value=>{const name=String(value??'').trim().split(/[\\/]/).pop()||'final_draft.docx';return /\.docx$/i.test(name)?name:name+'.docx'};
const stale=()=>Boolean(payload?.freshness?.stale);
const docs=()=>[
  {id:'preparation',title:'Final Preparation',text:'',file:'draft_approval.json'},
  {id:'conclusion',title:'Conclusion',text:payload?.conclusion_generated_md||'',file:'conclusion_generated.md'},
  {id:'overview-figure',title:'Overview Figure',text:'',file:'overview_figure.png'},
  {id:'final',title:'Final Draft',text:payload?.final_draft_md||'',file:'final_draft.md'},
  {id:'audit',title:'Audit Report',text:payload?.final_audit_report_md||'',file:'final_audit_report.md'},
  {id:'release',title:'Release Report',text:payload?.release_report_md||'',file:'release_report.md'}
];
function renderMarkdown(markdown){return String(markdown||'').replace(/<!--[\s\S]*?-->/g,'').replace(/\n(!\[[^\]]*\]\([^)]+\))/g,'\n\n$1').replace(/(!\[[^\]]*\]\([^)]+\))\n(?=\S)/g,'$1\n\n').split(/\n{2,}/).filter(Boolean).map(raw=>{const value=raw.trim(),image=value.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(/^###\s+/.test(value))return '<h3>'+esc(value.replace(/^###\s+/,''))+'</h3>';if(/^##\s+/.test(value))return '<h2>'+esc(value.replace(/^##\s+/,''))+'</h2>';if(/^#\s+/.test(value))return '<h1>'+esc(value.replace(/^#\s+/,''))+'</h1>';if(image)return '<figure><img src="'+fileUrl(image[2])+'" alt="'+esc(image[1])+'"><figcaption>'+esc(image[1])+'</figcaption></figure>';if(/^\|/.test(value)){const rows=value.split('\n').filter(row=>!/^\|?\s*[-:]+/.test(row));return '<table>'+rows.map((row,index)=>'<tr>'+row.split('|').slice(1,-1).map(cell=>(index?'td':'th')+'>'+esc(cell.trim())+'</'+(index?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'}return '<p>'+esc(value).replace(/\n/g,'<br>')+'</p>'}).join('')}
function insertChartAfterIntroduction(content,figure){const introduction=/<h([1-6])>[^<]*(?:introduction|background)[^<]*<\/h\1>([\s\S]*?)(?=<h\1>|$)/i;const match=content.match(introduction);if(!match||match.index===undefined)return content;const end=match.index+match[0].length;return content.slice(0,end)+figure+content.slice(end)}
function selectDocument(value){if(!finalDocumentIds.has(value))return;doc=value;const route=new URL(window.location.href);route.searchParams.set('doc',value);window.history.replaceState(null,'',route)}
async function loadProjects(){selectDocument(doc);projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(project=>'<option value="'+esc(project.project_id)+'">'+esc(project.project_id)+'</option>').join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
async function loadProject(id){selectedProject=id;payload=await(await fetch('/api/project/'+encodeURIComponent(id)+'/final')).json();render()}
function preparationHtml(){const approval=payload?.draft_approval||{},record=approval.record||{},ready=payload?.draft_approval_current===true;const score=record.score===undefined?'—':Number(record.score).toFixed(1);return '<div class="prep-grid"><section class="prep-card '+(ready?'ready':'blocked')+'"><strong>'+esc(finalText('Approved Draft','已确认初稿'))+'</strong><div class="prep-score">'+esc(ready?finalText('Approved','已确认'):finalText('Required','待确认'))+'</div><p>'+esc(ready?finalText('The exact evaluated draft version is locked for final generation.','当前已评估的初稿版本可用于最终生成。'):finalText('Return to Draft, evaluate the saved manuscript, and complete human approval.','请返回初稿，评估保存后的正文并完成人工确认。'))+'</p>'+(ready?'':'<a class="btn" href="/draft?project='+encodeURIComponent(selectedProject)+'&tab=approval">'+esc(finalText('Return to Draft Approval','返回初稿确认'))+'</a>')+'</section><section class="prep-card"><strong>'+esc(finalText('Approved quality score','确认时质量分数'))+'</strong><div class="prep-score">'+esc(score)+'</div><p>'+esc(record.approved_at||finalText('No approval record','暂无确认记录'))+'</p></section><section class="prep-card"><strong>'+esc(finalText('Conclusion','结论'))+'</strong><p>'+esc(payload?.conclusion_current?finalText('Current and ready to merge.','当前版本可合并。'):finalText('Optional; generate when needed.','可选，需要时生成。'))+'</p></section><section class="prep-card"><strong>'+esc(finalText('Overview figure','综述总览图'))+'</strong><p>'+esc(payload?.overview_figure_current?finalText('Current and ready to merge.','当前版本可合并。'):payload?.overview_figure_exists?finalText('Out of date; regenerate before final assembly.','已过期，最终组装前请重新生成。'):finalText('Optional; generate when needed.','可选，需要时生成。'))+'</p></section></div>'}
function renderBase(){const item=docs().find(entry=>entry.id===doc)||docs()[0];let content=item.text?renderMarkdown(item.text):'<p>This file has not been generated.</p>';if(item.id==='preparation')content=preparationHtml();else if(item.id==='overview-figure')content=payload?.overview_figure_exists?'<figure><img src="'+esc(fileUrl(payload.overview_figure_path))+'" alt="Overview figure"><figcaption>Template-matched overview figure generated for this project.</figcaption></figure>':'<p>Generate the overview figure to view it here.</p>';else if(item.id==='final'&&payload?.release_chart_full_png_exists){const chart='<figure><img src="'+esc(fileUrl(payload.release_chart_full_png_path))+'" alt="Overall review outline"><figcaption>Overall review outline.</figcaption></figure>';content=insertChartAfterIntroduction(content,chart)}if(item.id==='final'&&stale())content='<p>Upstream content or an optional artifact changed. Regenerate the Final Draft first.</p>';$('mainTitle').textContent=item.title;$('mainMeta').textContent=item.file;$('main').innerHTML=content;$('projectInfo').textContent=selectedProject+' · '+(payload?.topic||'');$('docList').innerHTML=docs().map(entry=>'<button class="item '+(entry.id===doc?'active':'')+'" data-doc="'+entry.id+'"><strong>'+esc(entry.title)+'</strong><div class="meta">'+esc(entry.file)+'</div></button>').join('');document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.doc===doc))}
function renderSummary(){const ready=payload?.draft_approval_current===true;$('summary').innerHTML='<div class="field"><div class="label">Approved Draft</div><div>'+(ready?'human-approved':'approval required')+'</div></div><div class="field"><div class="label">Conclusion</div><div>'+(payload?.conclusion_current?'current':'optional or out of date')+'</div></div><div class="field"><div class="label">Overview Figure</div><div>'+(payload?.overview_figure_current?'current':payload?.overview_figure_exists?'out of date':'optional')+'</div></div><div class="field"><div class="label">Final Audit</div><div>'+(payload?.final_draft_md&&!stale()?'ready':'not ready')+'</div></div>'+(payload?.final_draft_docx_exists?'<a class="btn" href="'+fileUrl(payload.final_draft_docx_path)+'" download="'+esc(docxDownloadName(payload.final_draft_docx_path))+'">Download DOCX</a>':payload?.final_draft_docx_stale?'<div class="sub">The existing Word file is out of date.</div>':'');document.querySelectorAll('[data-final-stage],#export-docx').forEach(control=>control.disabled=!ready)}
async function runFinalAction(stageId){const status=$('finalActionStatus'),controls=[...document.querySelectorAll('[data-final-stage]')];if(!payload?.draft_approval_current){status.textContent=finalText('Return to Draft and approve the current manuscript first.','请先返回初稿并确认当前正文。');return}const paths={'final-conclusion':'/run/final-conclusion','final-overview-figure':'/run/final-overview-figure',final:'/run/final'},targets={'final-conclusion':'conclusion','final-overview-figure':'overview-figure',final:'final'};controls.forEach(control=>control.disabled=true);status.textContent=finalText('Generating…','正在生成…');try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+paths[stageId],{method:'POST'});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||'Generation failed.');selectDocument(targets[stageId]||doc);await loadProject(selectedProject);status.textContent=finalText('Generation complete.','生成完成。')}catch(error){status.textContent=error.message||String(error)}finally{renderSummary()}}
async function exportDocx(){const status=$('finalActionStatus'),button=$('export-docx');if(!payload?.draft_approval_current){status.textContent=finalText('Approve the current manuscript in Draft first.','请先在初稿阶段确认当前正文。');return}button.disabled=true;status.textContent=finalText('Generating Word document…','正在生成 Word 文档…');try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+'/export-docx',{method:'POST'});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||'Word export failed.');await loadProject(selectedProject);if(result.path){const link=document.createElement('a');link.href=fileUrl(result.path);link.download=docxDownloadName(result.download_name||result.path);document.body.appendChild(link);link.click();link.remove()}status.textContent=result.message||finalText('Word document generated.','Word 文档已生成。')}catch(error){status.textContent=error.message||String(error)}finally{renderSummary()}}
function render(){const previous=$('main')?.scrollTop||0;renderBase();renderSummary();if(doc==='overview-figure'&&payload?.overview_figure_exists&&!payload?.overview_figure_current)$('main').innerHTML='<p>The existing overview figure is out of date. Generate it again before using it in the Final Draft.</p>';$('main').scrollTop=previous}
$('projectSelect').onchange=event=>loadProject(event.target.value);$('docList').onclick=event=>{const button=event.target.closest('[data-doc]');if(button){selectDocument(button.dataset.doc);render()}};document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{selectDocument(button.dataset.doc);render()});document.addEventListener('click',event=>{const exportButton=event.target.closest('#export-docx');if(exportButton){exportDocx();return}const button=event.target.closest('[data-final-stage]');if(button)runFinalAction(button.dataset.finalStage)});window.addEventListener('review-language-change',()=>render());loadProjects();
</script>
</body>
</html>
