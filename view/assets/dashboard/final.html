<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Final</title>
<link rel="stylesheet" href="/assets/dashboard/review-ui.css?v=20260803">
<style>
:root{--ink:#1f2024;--muted:#69707b;--line:#d7cbb7;--green:#1e6a58;--paper:#fffdf7;--panel:#fffaf1}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#efe3cc;font:14px Georgia,"Times New Roman",serif}.nav{padding:9px 14px;display:flex;gap:12px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line)}.nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select,.btn,.tab,.item{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px 11px;font:inherit}.project-select{min-width:280px}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{padding:7px 10px;border:1px solid var(--line);border-radius:7px;color:var(--ink);text-decoration:none;background:var(--paper)}.nav a.active,.tab.active,.btn.primary{color:#fff;background:var(--green);border-color:var(--green)}.app{height:calc(100vh - 56px);padding:14px;gap:14px;display:grid;grid-template-columns:250px minmax(580px,1fr) 315px}.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.head,.tabs{padding:14px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0}.sub,.meta{margin-top:5px;color:var(--muted);font-size:12px}.list,.main,.side{min-height:0;overflow:auto}.list,.side{padding:10px}.item{width:100%;margin-bottom:7px;text-align:left;cursor:pointer}.item.active{border-color:var(--green)}.tabs{display:flex;gap:7px}.main{padding:42px 58px;background:var(--paper);font-size:16px;line-height:1.75}.main h1{font-size:30px;line-height:1.2;margin:0 0 28px}.main h2{font-size:23px;margin:38px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--line)}.main h3{font-size:19px;margin:25px 0 10px}.main p{margin:0 0 16px;text-align:justify}.main figure{text-align:center;margin:25px auto}.main img{max-width:100%;border:1px solid var(--line);border-radius:8px}.main figcaption{color:var(--muted);font-size:13px}.main table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}.main th,.main td{border:1px solid var(--line);padding:7px;vertical-align:top}.main th{background:#eee4d1}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.field{margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:1050px){.app{height:auto;grid-template-columns:1fr}.panel{min-height:300px}.nav{flex-wrap:wrap}}
</style>
<style>
.quality-config{padding:12px;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;background:#fffdf7}.quality-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0 11px}.quality-grid label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px}.quality-grid input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;font:13px Georgia,"Times New Roman",serif;color:var(--ink)}.quality-status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.quality-stat{padding:13px;border:1px solid var(--line);border-radius:9px;background:#fffaf1}.quality-stat strong{display:block;margin-top:4px;font-size:21px;color:var(--green)}.quality-score-list{display:grid;gap:9px}.quality-score-card{padding:12px 14px;border:1px solid var(--line);border-left:4px solid #a58145;border-radius:8px;background:#fffdf7}.quality-score-card.pass{border-left-color:var(--green)}.quality-score-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.quality-score-head strong:last-child{font-size:18px}.quality-score-meta{margin-top:5px;color:var(--muted);font-size:12px}.quality-score-card p{margin:8px 0 0;text-align:left;font-size:14px}.btn.danger{color:#8f3527;border-color:#cda89f;background:#fff7f4}.btn:disabled{opacity:.55;cursor:not-allowed}@media(max-width:1050px){.quality-status{grid-template-columns:1fr}.quality-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a href="/sections">Sections</a><a href="/figures">Figures</a><a href="/draft">Draft</a><a class="active" href="/final">Final</a></div></nav>
<main class="app"><section class="panel"><div class="head"><h2>Final Output</h2><div id="projectInfo" class="sub"></div></div><div id="docList" class="list"></div></section><section class="panel"><div class="head"><h2 id="mainTitle">Final Draft</h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab" data-doc="quality">Draft Quality</button><button class="tab" data-doc="conclusion">Conclusion</button><button class="tab" data-doc="overview-figure">Overview Figure</button><button class="tab active" data-doc="final">Final Draft</button><button class="tab" data-doc="audit">Audit</button><button class="tab" data-doc="release">Release</button></div><article id="main" class="main"></article></section><aside class="panel"><div class="head"><h2>Review Gate</h2></div><div class="side"><section class="quality-config" aria-label="First draft quality loop"><div class="label">Optional draft quality loop</div><div class="quality-grid"><label>Overall goal<input id="feedbackGoal" type="number" min="0" max="100" value="90"></label><label>Paragraph goal<input id="feedbackParagraphGoal" type="number" min="0" max="100" value="85"></label><label>Max iterations<input id="feedbackMaxIterations" type="number" min="1" max="10" value="3"></label><label>Word range<input id="feedbackWordRange" type="text" value="140-280"></label></div><div class="actions"><button class="btn primary" data-feedback-action="improve">Evaluate &amp; Improve</button><button class="btn" data-feedback-action="evaluate">Evaluate Only</button><button class="btn danger" data-feedback-action="stop">Stop</button></div><div id="feedbackActionStatus" class="sub" role="status" aria-live="polite"></div></section><section class="field" aria-label="Final generation actions"><div class="label">Independent generation</div><div class="actions"><button id="final-conclusion" class="btn primary" data-final-stage="final-conclusion">Generate Conclusion (Optional)</button><button id="final-overview-figure" class="btn" data-final-stage="final-overview-figure">Generate Overview Figure</button><button class="btn" data-final-stage="final">Generate Final Draft</button><button id="export-docx" class="btn">Generate &amp; Download Word</button></div><div id="finalActionStatus" class="sub" role="status" aria-live="polite"></div></section><div id="feedbackLoopSummary"></div><div id="summary"></div></div></aside></main>
<script src="/assets/dashboard/review-i18n.js?v=20260805d"></script>
<script src="/assets/dashboard/review-ui.js?v=20260805d"></script>
<script>
let projects=[],payload=null,selectedProject='',doc='final',feedbackPollTimer=null,feedbackRequestPending=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fileUrl=p=>{if(!p)return '';if(/^https?:\/\//i.test(p)||p.startsWith('/'))return p;if(/^[A-Za-z]:[\\/]/.test(p))return '/file?path='+encodeURIComponent(p);const base=payload?.paths?.stage_dir||'';return '/file?path='+encodeURIComponent(base?base+'/'+p:p)};
const stale=()=>Boolean(payload?.freshness?.stale);
const docs=()=>[
  {id:'quality',title:'Draft Quality',text:'',file:'feedback_loop_status.json'},
  {id:'conclusion',title:'Conclusion',text:payload?.conclusion_generated_md||'',file:'conclusion_generated.md'},
  {id:'overview-figure',title:'Overview Figure',text:'',file:'overview_figure.png'},
  {id:'final',title:'Final Draft',text:payload?.final_draft_md||'',file:'final_draft.md'},
  {id:'audit',title:'Audit Report',text:payload?.final_audit_report_md||'',file:'final_audit_report.md'},
  {id:'release',title:'Release Report',text:payload?.release_report_md||'',file:'release_report.md'}
];

function renderMarkdown(markdown){return String(markdown||'').replace(/<!--[\s\S]*?-->/g,'').replace(/\n(!\[[^\]]*\]\([^)]+\))/g,'\n\n$1').replace(/(!\[[^\]]*\]\([^)]+\))\n(?=\S)/g,'$1\n\n').split(/\n{2,}/).filter(Boolean).map(raw=>{const v=raw.trim(),img=v.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(/^###\s+/.test(v))return '<h3>'+esc(v.replace(/^###\s+/,''))+'</h3>';if(/^##\s+/.test(v))return '<h2>'+esc(v.replace(/^##\s+/,''))+'</h2>';if(/^#\s+/.test(v))return '<h1>'+esc(v.replace(/^#\s+/,''))+'</h1>';if(img)return '<figure><img src="'+fileUrl(img[2])+'" alt="'+esc(img[1])+'"><figcaption>'+esc(img[1])+'</figcaption></figure>';if(/^\|/.test(v)){const rows=v.split('\n').filter(r=>!/^\|?\s*[-:]+/.test(r));return '<table>'+rows.map((r,i)=>'<tr>'+r.split('|').slice(1,-1).map(c=>(i?'td':'th')+'>'+esc(c.trim())+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>'}return '<p>'+esc(v).replace(/\n/g,'<br>')+'</p>'}).join('')}
function insertChartAfterIntroduction(content,figure){const introduction=/<h([1-6])>[^<]*(?:introduction|background)[^<]*<\/h\1>([\s\S]*?)(?=<h\1>|$)/i;const match=content.match(introduction);if(!match||match.index===undefined)return content;const end=match.index+match[0].length;return content.slice(0,end)+figure+content.slice(end)}

async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(p=>'<option value="'+esc(p.project_id)+'">'+esc(p.project_id)+'</option>').join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
async function loadProject(id){selectedProject=id;payload=await(await fetch('/api/project/'+encodeURIComponent(id)+'/final')).json();render();syncFeedbackPolling()}

function feedbackRunning(){return payload?.feedback_loop_status?.status==='running'}
function feedbackPhaseLabel(status){const phase=String(status?.phase||'not started').replaceAll('_',' ');const current=status?.current_paragraph_id?' · '+status.current_paragraph_id:'';return phase+current}
function renderFeedbackQuality(){
  const status=payload?.feedback_loop_status||{},scores=Array.isArray(status.paragraph_scores)?status.paragraph_scores:[];
  const score=status.score===undefined||status.score===null?'—':Number(status.score).toFixed(1);
  const iteration=status.iteration||0,total=status.max_iterations||0;
  const cards=scores.length?scores.map(item=>{const value=Number(item.score||0),passed=value>=Number(status.paragraph_goal||85);const failed=Array.isArray(item.failed_dimensions)?item.failed_dimensions.join(', '):'';return '<section class="quality-score-card '+(passed?'pass':'')+'"><div class="quality-score-head"><strong>'+esc(item.paragraph_id||'Paragraph')+'</strong><strong>'+value.toFixed(1)+'</strong></div><div class="quality-score-meta">'+esc(item.route||'review')+(failed?' · '+esc(failed):'')+'</div>'+(item.diagnosis?'<p>'+esc(item.diagnosis)+'</p>':'')+'</section>'}).join(''):'<p>No paragraph scores yet. Run Evaluate Only or Evaluate &amp; Improve. This optional step does not block the existing Final actions.</p>';
  return '<div class="quality-status"><div class="quality-stat"><span class="label">Overall score</span><strong>'+score+'</strong></div><div class="quality-stat"><span class="label">Progress</span><strong>'+esc(iteration+'/'+total)+'</strong></div><div class="quality-stat"><span class="label">State</span><strong style="font-size:15px">'+esc(feedbackPhaseLabel(status))+'</strong></div></div><div class="quality-score-list">'+cards+'</div>';
}
function renderFeedbackSummary(){
  const target=$('feedbackLoopSummary'),status=payload?.feedback_loop_status||{};
  if(!target)return;
  const state=status.status||'not started',score=status.score===undefined||status.score===null?'—':Number(status.score).toFixed(1);
  target.innerHTML='<div class="field"><div class="label">Draft quality</div><div>'+esc(state)+' · score '+esc(score)+(payload?.feedback_loop_current?' · current':' · optional')+'</div>'+(status.error?'<div class="sub">'+esc(status.error)+'</div>':'')+'</div>';
  document.querySelectorAll('[data-feedback-action="stop"]').forEach(button=>button.disabled=!feedbackRunning());
}
function syncFeedbackPolling(){
  if((feedbackRunning()||feedbackRequestPending)&&!feedbackPollTimer){feedbackPollTimer=setInterval(async()=>{try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+'/final');if(!response.ok)return;payload=await response.json();render();if(!feedbackRunning()&&!feedbackRequestPending)syncFeedbackPolling()}catch(_error){}},2500)}
  if(!feedbackRunning()&&!feedbackRequestPending&&feedbackPollTimer){clearInterval(feedbackPollTimer);feedbackPollTimer=null}
}
function feedbackOptions(evaluateOnly){
  const range=String($('feedbackWordRange').value||'').match(/^\s*(\d+)\s*[-–]\s*(\d+)\s*$/);if(!range)throw new Error('Word range must use min-max, for example 140-280.');
  return {goal:Number($('feedbackGoal').value),paragraph_goal:Number($('feedbackParagraphGoal').value),max_iterations:Number($('feedbackMaxIterations').value),min_case_words:Number(range[1]),max_case_words:Number(range[2]),evaluate_only:Boolean(evaluateOnly)};
}
async function runFeedbackLoop(evaluateOnly){
  const status=$('feedbackActionStatus'),buttons=[...document.querySelectorAll('[data-feedback-action]')];if(!selectedProject){status.textContent='Select a project first.';return}
  let options;try{options=feedbackOptions(evaluateOnly)}catch(error){status.textContent=error.message;return}
  buttons.filter(button=>button.dataset.feedbackAction!=='stop').forEach(button=>button.disabled=true);status.textContent=evaluateOnly?'Evaluating every paragraph…':'Evaluating and improving failed paragraphs…';doc='quality';feedbackRequestPending=true;syncFeedbackPolling();render();
  try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+'/run/draft-feedback-loop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(options)});const result=await response.json().catch(()=>({ok:false,error:'Server returned '+response.status+'.'}));if(!response.ok||!result.ok)throw new Error(result.error||'Draft quality loop failed.');await loadProject(selectedProject);status.textContent='Draft quality run completed.'}catch(error){status.textContent=error.message||String(error);await loadProject(selectedProject)}finally{feedbackRequestPending=false;syncFeedbackPolling();buttons.filter(button=>button.dataset.feedbackAction!=='stop').forEach(button=>button.disabled=false)}
}
async function stopFeedbackLoop(){const status=$('feedbackActionStatus');if(!selectedProject)return;status.textContent='Stopping after the current safe operation…';try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+'/feedback-loop/stop',{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:'Stop request failed.'}));if(!response.ok||!result.ok)throw new Error(result.error||'Stop request failed.');status.textContent='Stop requested.'}catch(error){status.textContent=error.message||String(error)}}
function renderBase(){const item=docs().find(x=>x.id===doc)||docs()[0];let content=item.text?renderMarkdown(item.text):'<p>This file has not been generated.</p>';if(item.id==='overview-figure'){content=payload?.overview_figure_exists?'<figure><img src="'+esc(fileUrl(payload.overview_figure_path))+'" alt="Overview figure"><figcaption>Template-matched overview figure generated for this project.</figcaption></figure>':'<p>Generate the overview figure to view the template-matched visual.</p>'}else if(item.id==='final'&&payload?.release_chart_full_png_exists){const chart='<figure><img src="'+esc(fileUrl(payload.release_chart_full_png_path))+'" alt="Overall review outline"><figcaption>Overall review outline.</figcaption></figure>';content=insertChartAfterIntroduction(content,chart)}else if(item.id==='final'&&stale()){content='<p>Upstream content changed. Regenerate the final draft first.</p>'}$('mainTitle').textContent=item.title;$('mainMeta').textContent=item.file;$('main').innerHTML=content;$('projectInfo').textContent=selectedProject+' · '+(payload?.topic||'');$('docList').innerHTML=docs().map(x=>'<button class="item '+(x.id===doc?'active':'')+'" data-doc="'+x.id+'"><strong>'+esc(x.title)+'</strong><div class="meta">'+esc(x.file)+'</div></button>').join('');$('summary').innerHTML='<div class="field"><div class="label">Conclusion</div><div>'+(payload?.conclusion_current?'Validated conclusion will be merged.':'Optional — Final Draft can be generated from First Draft without it.')+'</div></div><div class="field"><div class="label">Overview figure</div><div>'+(payload?.overview_figure_exists?'Available — it will be merged into Final Draft.':'Optional — generate it before or after Final Draft.')+'</div></div><div class="field"><div class="label">Final Audit</div><div>'+(payload?.final_draft_md&&!stale()?'ready':'not ready')+'</div></div>'+(payload?.final_draft_docx_exists?'<a class="btn" href="'+fileUrl(payload.final_draft_docx_path)+'" download>Download DOCX</a>':payload?.final_draft_docx_stale?'<div class="sub">The existing Word file is out of date. Use Generate &amp; Download Word.</div>':'');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.doc===doc))}
async function runFinalAction(stageId){const status=$('finalActionStatus'),controls=[...document.querySelectorAll('[data-final-stage]')];if(!selectedProject){status.textContent='Select a project before generating outputs.';return}const paths={'final-conclusion':'/run/final-conclusion','final-overview-figure':'/run/final-overview-figure',final:'/run/final'},targetDocs={'final-conclusion':'conclusion','final-overview-figure':'overview-figure',final:'final'};controls.forEach(control=>control.disabled=true);status.textContent='Generating…';try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+paths[stageId],{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:'Server returned '+response.status+'.'}));if(!response.ok||!result.ok)throw new Error(result.error||'Server returned '+response.status+'.');doc=targetDocs[stageId]||doc;await loadProject(selectedProject);status.textContent='Generation complete.'}catch(error){status.textContent=error.message||String(error)}finally{document.querySelectorAll('[data-final-stage]').forEach(control=>control.disabled=false)}}
async function exportDocx(){const status=$('finalActionStatus'),button=$('export-docx');if(!selectedProject){status.textContent='Select a project before exporting.';return}button.disabled=true;status.textContent='Generating Word document…';try{const response=await fetch('/api/project/'+encodeURIComponent(selectedProject)+'/export-docx',{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:'Server returned '+response.status+'.'}));if(!response.ok||!result.ok)throw new Error(result.error||'Word export failed.');await loadProject(selectedProject);status.textContent=result.message||'Word document generated. Download started.';if(result.path){const link=document.createElement('a');link.href=fileUrl(result.path);link.download='';document.body.appendChild(link);link.click();link.remove()}}catch(error){status.textContent=error.message||String(error)}finally{button.disabled=false}}
function render(){
  renderBase();
  renderFeedbackSummary();
  if(doc==='quality'){
    $('main').innerHTML=renderFeedbackQuality();
  }
  if(doc==='overview-figure'&&payload?.overview_figure_exists&&!payload?.overview_figure_current){
    $('main').innerHTML='<p>The existing overview figure is out of date. Generate it again before using it in the Final Draft.</p>';
  }
  if(doc==='final'&&stale()){
    $('main').innerHTML='<p>Upstream content or an optional artifact changed. Regenerate the Final Draft first.</p>';
  }
  const fields=[...$('summary').querySelectorAll('.field')];
  for(const field of fields){
    const label=field.querySelector('.label')?.textContent?.trim();
    const value=field.querySelector('div:nth-child(2)');
    if(!value)continue;
    if(label==='Conclusion'&&payload?.conclusion_current&&!payload?.conclusion_integration_current){
      value.textContent='Validated conclusion exists, but the Final Draft has not integrated this version.';
    }
    if(label==='Overview figure'){
      value.textContent=payload?.overview_figure_current
        ?'Current and available — it will be merged into the Final Draft.'
        :payload?.overview_figure_exists
          ?'Out of date — generate the overview figure again before Final Draft.'
          :'Optional — generate it before or after Final Draft.';
    }
  }
};
$('projectSelect').onchange=e=>loadProject(e.target.value);$('docList').onclick=e=>{const b=e.target.closest('[data-doc]');if(b){doc=b.dataset.doc;render()}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{doc=b.dataset.doc;render()});document.addEventListener('click',e=>{const feedbackButton=e.target.closest('[data-feedback-action]');if(feedbackButton){const action=feedbackButton.dataset.feedbackAction;if(action==='stop')stopFeedbackLoop();else runFeedbackLoop(action==='evaluate');return}const exportButton=e.target.closest('#export-docx');if(exportButton){exportDocx();return}const button=e.target.closest('[data-final-stage]');if(button)runFinalAction(button.dataset.finalStage)});loadProjects();
</script>
</body>
</html>
