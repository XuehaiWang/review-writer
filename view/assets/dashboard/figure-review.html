<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figure Review</title>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css?v=20260803">
  <style>
    :root{--ink:#1f2024;--muted:#69707b;--line:#d7cbb7;--green:#1e6a58;--paper:#fffdf7;--panel:#fffaf1}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#efe3cc;font:14px Georgia,"Times New Roman",serif}button,select,textarea{font:inherit}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line)}.nav-title{font-size:18px;font-weight:700}.nav-center{flex:1;text-align:center}.project-select{min-width:280px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{padding:7px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none;background:var(--paper)}.nav a.active,.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.app{height:calc(100vh - 58px);padding:14px;gap:14px;display:grid;grid-template-columns:290px minmax(540px,1fr) 300px}.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:var(--panel)}.head{padding:14px;border-bottom:1px solid var(--line)}h1,h2{margin:0;font-size:18px}.sub,.meta{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}.list,.main,.side{min-height:0;overflow:auto}.list,.side{padding:10px}.main{padding:20px;background:var(--paper)}.paper{width:100%;padding:10px;margin-bottom:7px;border:1px solid transparent;border-radius:6px;background:var(--paper);text-align:left;cursor:pointer}.paper.active,.paper:hover{border-color:var(--green);background:#f2faf0}.paper-title{font-weight:700;line-height:1.3}.pill{display:inline-block;margin-top:6px;padding:2px 6px;border-radius:5px;background:#e4efe4;color:#285a37;font-size:11px}.pill.warn{background:#f9dfd0;color:#8d3e20}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:stretch}.candidate{display:flex;flex-direction:column;min-height:100%;padding:11px;border:1px solid var(--line);border-radius:6px;background:#fff}.candidate.selected{border:2px solid var(--green)}.candidate img{display:block;width:100%;max-height:340px;object-fit:contain;margin:9px 0;border:1px solid var(--line)}.candidate>.btn{align-self:flex-start;margin-top:auto}.btn{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer}textarea{width:100%;min-height:130px;padding:9px;border:1px solid var(--line);border-radius:6px;resize:vertical}.status{min-height:1.4em;margin-top:9px;color:var(--muted)}.status.error{color:#a2352c}@media(max-width:1050px){.app{height:auto;grid-template-columns:1fr}.panel{min-height:320px}.nav{height:auto;flex-wrap:wrap}.nav-center{order:3;flex-basis:100%}}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a href="/sections">Sections</a><a class="active" href="/figure-review">Figure Review</a><a href="/figures">Figures</a><a href="/draft">Draft</a><a href="/final">Final</a></div></nav>
  <main class="app"><section class="panel"><div class="head"><h1>Cited Papers</h1><div id="count" class="sub"></div></div><div id="paperList" class="list"></div></section><section class="panel"><div class="head"><h2 id="title">Select a paper</h2><div id="subtitle" class="sub"></div></div><div id="reviewBody" class="main"></div></section><aside class="panel"><div class="head"><h2>Selection Note</h2><div class="sub">This choice becomes the only input to the batch redraw.</div></div><div class="side"><textarea id="reviewNote" placeholder="Reason for selecting this figure"></textarea><div id="savedStatus" class="status"></div></div></aside></main>
  <script src="/assets/dashboard/review-i18n.js?v=20260805d"></script>
  <script src="/assets/dashboard/review-ui.js?v=20260805d"></script>
  <script>
    let projects=[],payload={papers:[]},selectedProject='',selectedPaperId='';const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char])),fileUrl=path=>path?`/file?path=${encodeURIComponent(path)}`:'';const papers=()=>Array.isArray(payload.papers)?payload.papers:[];const current=()=>papers().find(paper=>paper.paper_id===selectedPaperId)||papers()[0]||null;
    async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(project=>`<option value="${esc(project.project_id)}">${esc(project.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
    async function loadProject(projectId){selectedProject=projectId;window.reviewUi?.setProject(projectId);payload=await(await fetch(`/api/project/${encodeURIComponent(projectId)}/figure-review`)).json();selectedPaperId=papers().some(paper=>paper.paper_id===selectedPaperId)?selectedPaperId:(papers()[0]?.paper_id||'');render()}
    function renderList(){const reviewed=papers().filter(paper=>paper.human_review?.reviewed_at).length;$('count').textContent=`${reviewed}/${papers().length} papers selected${payload?.freshness?.review_stale?' · selection set needs revalidation':''}`; $('paperList').innerHTML=papers().map(paper=>{const done=Boolean(paper.human_review?.reviewed_at);return `<button class="paper ${paper.paper_id===selectedPaperId?'active':''}" data-paper="${esc(paper.paper_id)}"><div class="paper-title">${esc(paper.paper_id)} · ${esc(paper.title)}</div><span class="pill ${done?'':'warn'}">${done?'selected':'needs selection'}</span></button>`}).join('')||'<div class="meta">Run Sections to produce figure candidates.</div>'}
    function renderCurrent(){const paper=current();if(payload?.freshness?.source_stale){$('reviewBody').innerHTML='<div class="meta">Section outputs changed. Regenerate candidates before reviewing figures.</div>';return}if(!paper){$('reviewBody').innerHTML='<div class="meta">No candidate figures are available.</div>';return}$('title').textContent=`${paper.paper_id} · ${paper.title}`;$('subtitle').textContent=`${(paper.candidates||[]).length} candidates. Choose one source for batch redraw.`;$('reviewNote').value=paper.human_review?.review_note||'';$('savedStatus').textContent=paper.human_review?.reviewed_at?`Saved ${paper.human_review.reviewed_at}`:'Select a candidate.';$('reviewBody').innerHTML=`<div class="candidate-grid">${(paper.candidates||[]).map(candidate=>{const selected=candidate.candidate_index===paper.selected_candidate_index;return `<article class="candidate ${selected?'selected':''}"><strong>Candidate ${esc(candidate.candidate_index)}</strong><div class="meta">${esc(candidate.source_label||'')} · score ${esc(candidate.score??'n/a')}</div>${candidate.source_image_path?`<a href="${fileUrl(candidate.source_image_path)}" target="_blank" rel="noopener"><img src="${fileUrl(candidate.source_image_path)}" alt="Candidate ${esc(candidate.candidate_index)}"></a>`:'<div class="meta">Image path unavailable.</div>'}<button class="btn ${selected?'':'primary'}" data-candidate="${esc(candidate.candidate_index)}">${selected?'Selected':'Use this candidate'}</button></article>`}).join('')}</div>`}
    function render(){renderList();renderCurrent()}
    async function selectCandidate(candidateIndex){const paper=current();if(!paper)return;try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figure-review/${encodeURIComponent(paper.paper_id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidate_index:Number(candidateIndex),review_note:$('reviewNote').value.trim()})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to save figure selection.');$('savedStatus').textContent='Candidate saved. Execute Figure Review when all papers are selected.';await loadProject(selectedProject)}catch(error){$('savedStatus').className='status error';$('savedStatus').textContent=error.message||String(error)}}
    $('projectSelect').addEventListener('change',event=>{selectedPaperId='';loadProject(event.target.value)});$('paperList').addEventListener('click',event=>{const button=event.target.closest('[data-paper]');if(button){selectedPaperId=button.dataset.paper;render()}});$('reviewBody').addEventListener('click',event=>{const button=event.target.closest('[data-candidate]');if(button)selectCandidate(button.dataset.candidate)});loadProjects();
  </script>
</body>
</html>
