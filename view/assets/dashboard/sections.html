<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Sections</title>
  <style>
    :root{--ink:#1d241f;--muted:#69756d;--line:#dacdb8;--green:#1f6b55;--shadow:0 18px 46px rgba(55,43,24,.14)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:linear-gradient(135deg,#f1e7d3,#fbf7ec 48%,#eadcc4);font-family:Georgia,"Times New Roman",serif;height:100vh;overflow:hidden}
    button,select{font:inherit}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,250,240,.94);border-bottom:1px solid var(--line)}
    .nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select{min-width:280px;max-width:520px;border:1px solid var(--line);background:#fffdf7;border-radius:999px;padding:8px 12px}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fffdf7;font-size:14px}.nav a.active{background:var(--green);border-color:var(--green);color:white}
    .app{height:calc(100vh - 58px);display:grid;grid-template-columns:310px minmax(540px,1fr) 410px;gap:14px;padding:14px}.panel{background:rgba(255,250,240,.94);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:0;display:flex;flex-direction:column}.head,.tabs{padding:14px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:22px}h2{font-size:18px}.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.35}
    .list,.main,.side{overflow:auto;min-height:0}.list{padding:9px}.card{width:100%;text-align:left;border:1px solid transparent;background:#fffdf7;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;color:var(--ink)}.card:hover,.card.active{border-color:var(--green);background:#f2faf0}.title{font-weight:700;font-size:14px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35}.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#e4efe4;color:#285a37;margin:5px 4px 0 0}.warn{background:#f6dfd3;color:#873e1e}
    .main{background:#fffdf7;padding:24px 30px;line-height:1.6;font-size:16px}.main img{max-width:100%;border:1px solid var(--line);border-radius:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:#fffdf7;padding:7px 12px;cursor:pointer}.tab.active{background:var(--green);color:white;border-color:var(--green)}.side{padding:14px}.field{margin-bottom:14px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.value{line-height:1.45;white-space:pre-wrap}pre{white-space:pre-wrap;margin:0;font-family:Consolas,monospace;font-size:12px}
    .main.tasks-view{padding:20px;background:#f8f4eb}.task-sheet{overflow:hidden;border:1px solid #d9cebd;border-radius:14px;background:#fffdf8;box-shadow:0 8px 22px rgba(65,48,26,.07)}.task-head{padding:18px 20px;background:linear-gradient(135deg,#e7f3ee,#f7f4e9)}.task-kicker{display:inline-block;margin-bottom:8px;padding:4px 8px;color:#fff;border-radius:999px;background:var(--green);font:700 10px/1 Arial,sans-serif;letter-spacing:.06em}.task-head h3{font-size:20px}.task-head p{margin:8px 0 0;color:#48564e;line-height:1.6}.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.task-block{padding:14px;border:1px solid #e4dacb;border-radius:10px;background:#fff}.task-block.wide{grid-column:1/-1}.task-label{margin-bottom:9px;color:#526058;font:700 10px/1.2 Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em}.task-chips{display:flex;flex-wrap:wrap;gap:6px}.task-chip{padding:5px 8px;color:#245641;border-radius:999px;background:#e4efe4;font:700 11px/1 Arial,sans-serif}.task-list{margin:0;padding-left:21px}.task-list li+li{margin-top:7px}.task-figure{padding:10px;border-left:3px solid #bd6b35;background:#faf4e8}.task-figure+.task-figure{margin-top:8px}.task-figure strong{display:block;margin-bottom:4px}.task-figure small{display:block;margin-top:6px;color:var(--muted)}.task-source{padding:10px 16px;color:var(--muted);border-top:1px solid #e6ddcf;font-size:11px}.workspace-empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:760px){.task-grid{grid-template-columns:1fr}.task-block.wide{grid-column:auto}}
  </style>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css?v=20260803">
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a class="active" href="/sections">Sections</a><a href="/figures">Figures</a><a href="/draft">Draft</a><a href="/final">Final</a></div></nav>
  <main class="app">
    <section class="panel"><div class="head"><h1>Section Drafts</h1><div id="projectInfo" class="sub">Loading...</div></div><div id="sectionList" class="list"></div></section>
    <section class="panel"><div class="head"><h2 id="mainTitle">Section Preview</h2><div id="mainMeta" class="sub"></div></div><div id="sectionTabs" class="tabs" aria-label="Section workspace"></div><div id="main" class="main"></div></section>
    <section class="panel"><div class="head"><h2>Review Gate</h2><div class="sub">Check section prose and whether each important paragraph has a figure candidate.</div></div><div id="summary" class="side"></div></section>
  </main>
  <script src="/assets/dashboard/review-i18n.js?v=20260811c"></script>
  <script src="/assets/dashboard/review-ui.js?v=20260811c"></script>
  <script>
    let projects=[],selectedProject='',payload=null,selected='',tab='section';
    const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const files=()=>payload?.section_files||[]; const tasks=()=>Array.isArray(payload?.section_tasks)?payload.section_tasks:[]; const handoff=()=>payload?.handoff||{}; const candidates=()=>Array.isArray(payload?.figure_candidates)?payload.figure_candidates:(payload?.figure_candidates?.figures||payload?.figure_candidates?.candidates||[]);
    function fileUrl(path){return path?`/file?path=${encodeURIComponent(path)}`:''}
    function imageSrc(p,base=''){return fileUrl(p.startsWith('/')?p:[base,p].filter(Boolean).join('/'))}
    function inlineMd(text,base=''){let out='',last=0,re=/!\[([^\]]*)\]\(([^)]+)\)/g,m;while((m=re.exec(text))){out+=esc(text.slice(last,m.index));out+=`<img alt="${esc(m[1])}" src="${imageSrc(m[2],base)}">`;last=re.lastIndex}return(out+esc(text.slice(last))).replace(/\n/g,'<br>')}
    function md(s,base=''){return String(s||'').split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';let m=b.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);if(m)return`<p><img alt="${esc(m[1])}" src="${imageSrc(m[2],base)}"></p>`;m=b.match(/^###\s+(.+)/);if(m)return`<h3>${esc(m[1])}</h3>`;m=b.match(/^##\s+(.+)/);if(m)return`<h2>${esc(m[1])}</h2>`;m=b.match(/^#\s+(.+)/);if(m)return`<h1>${esc(m[1])}</h1>`;return`<p>${inlineMd(b,base)}</p>`}).join('')}
    async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.project_id)}">${esc(p.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;loadProject(initial.project_id)}}
    const taskOnlyMode=()=>Boolean(handoff().drafts_stale||!files().length);
    const wordCount=value=>String(value||'').split(/\s+/).filter(Boolean).length;
    function taskFor(value){const id=String(value||'').replace(/\.md$/i,'');return tasks().find(task=>String(task.section_id||'')===id)||tasks().find(task=>String(task.heading||'')===value)||null}
    function activeTask(){return taskFor(selected)||tasks()[0]||null}
    async function loadProject(id){
      selectedProject=id;
      payload=await(await fetch(`/api/project/${encodeURIComponent(id)}/sections`)).json();
      selected=taskOnlyMode()?String(tasks()[0]?.section_id||''):String(files()[0]?.name||'');
      tab=taskOnlyMode()?'tasks':'section';
      render();
    }
    function renderTabs(){
      const options=taskOnlyMode()?[['tasks','Writing Requirements']]:[['section','Section Draft'],['drafts','Merged Preview'],['tasks','Writing Requirements']];
      if(!options.some(([id])=>id===tab))tab=options[0][0];
      $('sectionTabs').innerHTML=options.map(([id,label])=>`<button type="button" class="tab ${id===tab?'active':''}" data-tab="${id}">${label}</button>`).join('');
    }
    function renderList(){
      if(taskOnlyMode()){
        $('sectionList').innerHTML=tasks().map(task=>`<button class="card ${task.section_id===selected?'active':''}" data-task="${esc(task.section_id)}"><div class="title">${esc(task.heading||task.section_id)}</div><div class="meta">${esc(task.core_argument||'')}</div><span class="pill">${esc((task.allowed_papers||[]).length)} 篇文献</span></button>`).join('')||'<div class="empty">当前 Blueprint 没有可传入的章节任务。</div>';
        return;
      }
      $('sectionList').innerHTML=files().map(file=>{const task=taskFor(file.name),count=wordCount(file.content);return`<button class="card ${file.name===selected?'active':''}" data-id="${esc(file.name)}"><div class="title">${esc(task?.heading||file.name.replace(/\.md$/i,''))}</div><div class="meta">${esc(task?.core_argument||'Section draft ready for review.')}</div><span class="pill">${esc(count)} words</span></button>`}).join('')||'<div class="empty">没有章节文件。请先查看写作要求后再生成草稿。</div>';
    }
    function renderFigureRequirements(value){
      const needs=Array.isArray(value)?value:(value?[value]:[]);
      if(!needs.length)return'<div class="workspace-empty">No figure requirements specified.</div>';
      return needs.map(need=>{if(typeof need==='string')return`<div class="task-figure">${esc(need)}</div>`;const type=need?.type||'Figure',purpose=need?.purpose||need?.need||'',papers=need?.candidate_papers||need?.papers||[];return`<div class="task-figure"><strong>${esc(type)}</strong><div>${esc(purpose)}</div>${papers.length?`<small>Candidate Papers: ${esc(papers.join(', '))}</small>`:''}</div>`}).join('');
    }
    function renderTasks(){
      const task=activeTask();
      if(!task)return'<div class="workspace-empty">No writing requirements are available. Return to Blueprint and execute the handoff.</div>';
      const assigned=task.allowed_papers||[],mustCover=task.must_cover_points||[],avoid=task.avoid_points||[];
      const transferred=handoff().generated_at?`Transferred from Stage 4 at ${handoff().generated_at}`:'Stage 4 handoff time is unavailable.';
      return`${handoff().drafts_stale?'<div class="empty">Stage 4 Blueprint changed. Old section drafts remain on disk but are hidden because they do not match the current Blueprint. Regenerate section drafts from the current writing requirements.</div>':''}<article class="task-sheet"><header class="task-head"><span class="task-kicker">${esc(task.section_id||'Section')}</span><h3>${esc(task.heading||task.section_id||'Writing Requirements')}</h3><p>${esc(task.core_argument||'No core argument specified.')}</p></header><div class="task-grid"><section class="task-block"><div class="task-label">Assigned Papers</div><div class="task-chips">${assigned.length?assigned.map(paper=>`<span class="task-chip">${esc(paper)}</span>`).join(''):'<span>Not assigned</span>'}</div></section><section class="task-block"><div class="task-label">Figure Requirements</div>${renderFigureRequirements(task.figure_need)}</section><section class="task-block wide"><div class="task-label">Must Cover</div>${mustCover.length?`<ol class="task-list">${mustCover.map(item=>`<li>${esc(item)}</li>`).join('')}</ol>`:'<div class="workspace-empty">No required points specified.</div>'}</section><section class="task-block wide"><div class="task-label">Writing Guardrails</div>${avoid.length?`<ul class="task-list">${avoid.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'<div class="workspace-empty">No writing guardrails specified.</div>'}</section></div><footer class="task-source">${esc(transferred)}</footer></article>`;
    }
    function renderMain(){
      const main=$('main');
      main.className=`main ${tab==='tasks'?'tasks-view':''}`;
      if(tab==='tasks'||taskOnlyMode()){
        tab='tasks';
        $('mainTitle').textContent='Writing Requirements';
        $('mainMeta').textContent=`${tasks().length} section writing requirements`;
        main.innerHTML=renderTasks();
        return;
      }
      const file=files().find(item=>item.name===selected)||files()[0]||{},task=taskFor(file.name);
      if(tab==='drafts'){
        $('mainTitle').textContent='Merged Preview';
        $('mainMeta').textContent=`${files().length} section drafts`;
        main.innerHTML=md(payload?.section_drafts_md,payload?.paths?.stage_dir||'');
        return;
      }
      $('mainTitle').textContent=task?.heading||file.name||'Section Preview';
      $('mainMeta').textContent=`${String(file.name||'').replace(/\.md$/i,'')} · ${wordCount(file.content)} words`;
      main.innerHTML=md(file.content,payload?.paths?.sections_dir||'');
    }
    function renderSummary(){const fs=files();const figs=candidates();const unresolved=figs.filter(x=>String(x.resolution_status||'').includes('need')).length;const noFigure=figs.filter(x=>String(x.resolution_status||x.no_useful_figure_reason||'').includes('no_useful')).length;const status=handoff().drafts_stale?'Stage 4 Blueprint changed. Regenerate section drafts from the current writing requirements.':fs.length&&figs.length?'Ready for figure check':'Needs section/figure check';const humanCheck=['1. 每节是否是完整综述段落，而不是提纲。','2. 每段是否围绕一篇文献工作展开。','3. 图候选是否真实对应段落内容。','4. 未定位的图片是否已回到原文定位。'].join(String.fromCharCode(10));$('projectInfo').textContent=`${selectedProject} · ${payload?.topic||''}`;$('summary').innerHTML=`<div class="field"><div class="label">Status</div><div class="value">${status}</div></div><div class="field"><div class="label">Writing Requirements</div><div class="value">${tasks().length}</div></div><div class="field"><div class="label">Section Drafts</div><div class="value">${fs.length}${handoff().drafts_stale?'（已过期）':''}</div></div><div class="field"><div class="label">Figure Candidates</div><div class="value">${figs.length}</div></div><div class="field"><div class="label">Unresolved Source Images</div><div class="value">${unresolved}</div></div><div class="field"><div class="label">No Useful Figure Notes</div><div class="value">${noFigure}</div></div><div class="field"><div class="label">Human Check</div><div class="value">${esc(humanCheck)}</div></div>`}
    function render(){renderTabs();renderList();renderMain();renderSummary()}
    $('projectSelect').addEventListener('change',e=>loadProject(e.target.value));
    $('sectionList').addEventListener('click',e=>{const button=e.target.closest('[data-id],[data-task]');if(!button)return;selected=button.dataset.id||button.dataset.task;if(taskOnlyMode())tab='tasks';else if(tab!=='tasks')tab='section';render()});
    $('sectionTabs').addEventListener('click',e=>{const button=e.target.closest('[data-tab]');if(!button)return;tab=button.dataset.tab;render()});
    loadProjects();
  </script>
</body>
</html>
