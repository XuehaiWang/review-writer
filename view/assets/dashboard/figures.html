<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Figures</title>
  <style>
    :root{--ink:#20231d;--muted:#6f7469;--line:#d8ceb9;--green:#1f6b55;--red:#934225;--paper:#fffdf7;--shadow:0 18px 46px rgba(58,45,25,.14)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 16% 0,#f8e9be 0 22%,transparent 38%),linear-gradient(135deg,#eef0dc,#faf4e7 48%,#e7dec9);font-family:Georgia,"Times New Roman",serif;height:100vh;overflow:hidden}
    button,select{font:inherit}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,250,240,.94);border-bottom:1px solid var(--line)}
    .nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select{min-width:280px;max-width:520px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--paper);font-size:14px}.nav a.active{background:var(--green);border-color:var(--green);color:white}
    .app{height:calc(100vh - 58px);display:grid;grid-template-columns:330px minmax(560px,1fr) 390px;gap:14px;padding:14px}.panel{background:rgba(255,250,240,.95);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:0;display:flex;flex-direction:column}.head,.tabs{padding:14px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:22px}h2{font-size:18px}.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.35}
    .list,.main,.side{overflow:auto;min-height:0}.list{padding:9px}.card{width:100%;text-align:left;border:1px solid transparent;background:var(--paper);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;color:var(--ink)}.card:hover,.card.active{border-color:var(--green);background:#f2faf0}.title{font-weight:700;font-size:14px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35}.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#e4efe4;color:#285a37;margin:5px 4px 0 0}.warn{background:#f8dfd2;color:var(--red)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:7px 10px;cursor:pointer}.tab.active{background:var(--green);color:white;border-color:var(--green)}
    .main{background:var(--paper);padding:20px 24px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid var(--line);border-radius:14px;background:#fffaf0;padding:12px;min-height:160px}.box img{max-width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:white}.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);background:#fffaf0}.field{margin-bottom:13px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.value{white-space:pre-wrap;line-height:1.45}.side{padding:14px}pre{white-space:pre-wrap;margin:0;font-family:Consolas,monospace;font-size:12px}.kv{display:grid;grid-template-columns:125px 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.kv div:nth-child(odd){color:var(--muted);font-size:12px}
    .manual-editor{margin-top:16px;border:1px solid var(--green);border-radius:14px;padding:14px;background:#f5fbf5}.manual-editor h3{font-size:16px}.manual-note{font-size:13px;color:var(--muted);margin:7px 0 10px}.manual-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}.manual-toolbar label{font-size:13px;display:flex;gap:5px;align-items:center}.manual-toolbar input,.manual-toolbar select{max-width:90px;padding:5px;border:1px solid var(--line);border-radius:6px}.manual-canvas-wrap{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto;max-height:72vh}.manual-canvas{display:block;max-width:100%;height:auto;touch-action:none;cursor:crosshair}.manual-status{font-size:13px;color:var(--muted);min-height:1.4em}.manual-danger{color:var(--red)}.batch-actions{margin-top:10px}.batch-progress{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.35}
    @media(max-width:1100px){body{height:auto;overflow:auto}.app{height:auto;grid-template-columns:1fr}.panel{min-height:360px}.grid{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css">
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a href="/sections">Sections</a><a class="active" href="/figures">Figures</a><a href="/draft">Draft</a><a href="/final">Final</a></div></nav>
  <main class="app">
    <section class="panel"><div class="head"><h1>Figure Redraw</h1><div id="projectInfo" class="sub">Loading...</div><div id="batchActions" class="batch-actions"></div></div><div id="figureList" class="list"></div></section>
    <section class="panel"><div class="head"><h2 id="mainTitle">Figure Check</h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-tab="figure">Figure</button><button class="tab" data-tab="redraw">Redraw</button><button class="tab" data-tab="report">Report</button><button class="tab" data-tab="raw">Raw JSON</button></div><div id="main" class="main"></div></section>
    <section class="panel"><div class="head"><h2>Review Gate</h2><div class="sub">Do not proceed unless source image and redrawn output are both verified.</div></div><div id="summary" class="side"></div></section>
  </main>
  <script src="/assets/dashboard/review-ui.js"></script>
  <script>
    let projects=[],payload=null,selectedProject='',selected=0,tab='figure',manualEditorOpen=false,manualArrowState=null,manualEditorBaseMode='source',svgEditorOpen=false,svgEditorState=null,batchPollTimer=null;
    const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const fileUrl=path=>path?`/file?path=${encodeURIComponent(path)}`:'';
    const candidates=()=>{const c=payload?.figure_candidates;return Array.isArray(c)?c:(c?.figures||c?.candidates||[])};
    const redrawn=()=>{const r=payload?.redrawn_manifest;return Array.isArray(r)?r:(r?.figures||r?.items||r?.redrawn_figures||[])};
    const batchRedraw=()=>payload?.batch_redraw||{status:'idle',total:0,completed:0,succeeded:0,preview_succeeded:0,failed:0};
    function rowKey(x,i){return x.figure_id||x.candidate_id||[x.section_id,x.paper_id,x.source_label].filter(Boolean).join(' · ')||String(i)}
    function sourcePath(x){return x.source_image_path||x.source_path||x.image_path||''}
    function outputPath(x){const integrity=x?.chemistry_integrity?.status,standardIntegrity=!integrity||integrity==='pass',mechanismIntegrity=integrity==='needs_human_arrow_check'&&x?.mechanism_source_fidelity?.status==='pass',manualIntegrity=x?.render_mode==='manual-arrow-edit'&&integrity==='needs_human_arrow_check',sourceFaithful=['source-faithful-bw','source-faithful-color','source-faithful-outline-color'].includes(x?.render_mode),standardAi=x?.render_mode==='ai-edit'&&x?.edit_profile!=='mechanism-arrow-straighten'&&x?.structural_fidelity?.status==='pass'&&standardIntegrity;const approved=sourceFaithful||standardAi||(x?.render_mode==='ocr-hollow-ai'&&x?.content_fidelity?.status==='pass'&&x?.structural_fidelity?.status==='pass'&&standardIntegrity)||(x?.render_mode==='ai-edit'&&x?.edit_profile==='mechanism-arrow-straighten'&&mechanismIntegrity)||manualIntegrity;if(x?.render_mode&&!approved)return '';return x.output_path||x.redrawn_path||x.output_image_path||x.redrawn_image||x.image_path||x.path||''}
    function rejectedPreviewPath(x){return x?.rejected_preview_image||''}
    function matchRedrawn(c,i){const k=rowKey(c,i);return redrawn().find(r=>rowKey(r,i)===k||r.source_label===c.source_label&&r.paper_id===c.paper_id&&r.section_id===c.section_id)||{}}
    function img(path,label){return path?`<a href="${fileUrl(path)}" target="_blank"><img alt="${esc(label)}" src="${fileUrl(path)}"></a>`:`<div class="empty">No image path resolved.</div>`}
    function md(s){return String(s||'').split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';let m=b.match(/^###\s+(.+)/);if(m)return`<h3>${esc(m[1])}</h3>`;m=b.match(/^##\s+(.+)/);if(m)return`<h2>${esc(m[1])}</h2>`;m=b.match(/^#\s+(.+)/);if(m)return`<h1>${esc(m[1])}</h1>`;return`<p>${esc(b).replace(/\n/g,'<br>')}</p>`}).join('')}
    async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.project_id)}">${esc(p.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;loadProject(initial.project_id)}}
    async function loadProject(id,keepFigureId=''){selectedProject=id;manualEditorOpen=false;manualArrowState=null;payload=await(await fetch(`/api/project/${encodeURIComponent(id)}/figures`)).json();const preserved=candidates().findIndex(candidate=>candidate.figure_id===keepFigureId);selected=preserved>=0?preserved:0;render()}
    function renderList(){const rows=candidates();$('figureList').innerHTML=rows.map((x,i)=>{const status=x.resolution_status||x.status||'pending';const r=matchRedrawn(x,i);const out=outputPath(r);return`<button class="card ${i===selected?'active':''}" data-idx="${i}"><div class="title">${esc(x.source_label||rowKey(x,i))}</div><div class="meta">${esc(x.section_id||'')} · ${esc(x.paper_id||'')}</div><span class="pill ${status.includes('need')?'warn':''}">${esc(status)}</span><span class="pill ${out?'':'warn'}">${out?'redrawn':'no redraw'}</span></button>`}).join('')||'<div class="empty">No figure candidates found.</div>'}
    function renderMain(){if(payload?.freshness?.stale){$('mainTitle').textContent='图候选已过期';$('mainMeta').textContent='';$('main').innerHTML='<div class="empty">Blueprint 已更新。请先重新生成章节草稿和图候选，旧图候选与重绘结果不会用于当前流程。</div>';return}const c=candidates()[selected]||{};const r=matchRedrawn(c,selected),out=outputPath(r),preview=rejectedPreviewPath(r),display=out||preview,heading=out?'Redrawn Output':preview?'AI Preview — rejected by integrity gate':'Redrawn Output',warning=preview&&!out?'<div class="manual-danger">未通过完整性校验：此 AI 图仅供查看和下载，不能进入正文。</div>':'';$('mainTitle').textContent=c.source_label||'Figure Check';$('mainMeta').textContent=[c.section_id,c.paper_id,c.source_type].filter(Boolean).join(' · ');if(tab==='figure'){$('main').innerHTML=`<div class="grid"><div class="box"><h3>Source Candidate</h3>${img(sourcePath(c),c.source_label||'source figure')}</div><div class="box"><h3>${heading}</h3>${warning}${img(display,c.source_label||'redrawn figure')}</div></div><div class="manual-toolbar"><button id="redrawCurrent" class="btn primary">AI 重绘当前化学结构</button><button id="openManualArrowEditor" class="btn">手动编辑机理箭头</button></div><div id="redrawCurrentStatus" class="status"></div>${manualEditorOpen?manualEditorMarkup(c):''}<div class="kv"><div>Why selected</div><div>${esc(c.why_selected)}</div><div>What it shows</div><div>${esc(c.what_it_shows)}</div><div>Claim fit</div><div>${esc(c.fits_paragraph_or_claim)}</div><div>Caption</div><div>${esc(c.source_caption_text)}</div><div>Recommended action</div><div>${esc(c.recommended_action)}</div><div>Source PDF</div><div>${esc(c.source_pdf)}</div></div>`;if(manualEditorOpen)setTimeout(()=>initializeManualEditor(c),0)}else if(tab==='redraw'){$('main').innerHTML=`<pre>${esc(JSON.stringify(r||{},null,2))}</pre>`}else if(tab==='report'){$('main').innerHTML=md(payload?.figure_redraw_report_md)}else{$('main').innerHTML=`<pre>${esc(JSON.stringify({candidate:c,redrawn:r,manifest:payload?.redrawn_manifest},null,2))}</pre>`}}
    function manualBasePath(candidate){const r=matchRedrawn(candidate,selected),ai=outputPath(r)||rejectedPreviewPath(r);return manualEditorBaseMode==='redrawn'&&ai?ai:sourcePath(candidate)}
    function manualBaseControls(candidate){const r=matchRedrawn(candidate,selected),ai=outputPath(r)||rejectedPreviewPath(r),disabled=ai?'':'disabled';if(!ai&&manualEditorBaseMode==='redrawn')manualEditorBaseMode='source';return`<label>编辑底图 <select id="manualBaseMode"><option value="source" ${manualEditorBaseMode==='source'?'selected':''}>原图</option><option value="redrawn" ${manualEditorBaseMode==='redrawn'?'selected':''} ${disabled}>AI 重绘图</option></select></label>`}
    function editableSvgPath(redrawnRow){return redrawnRow?.editable_svg||redrawnRow?.manual_arrow_edit?.editable_svg||''}
    function renderMain(){if(payload?.freshness?.stale){$('mainTitle').textContent='图候选已过期';$('mainMeta').textContent='';$('main').innerHTML='<div class="empty">Blueprint 已更新。请先重新生成章节草稿和图候选，旧图候选与重绘结果不会用于当前流程。</div>';return}const c=candidates()[selected]||{},r=matchRedrawn(c,selected),out=outputPath(r),preview=rejectedPreviewPath(r),display=out||preview,heading=out?'Redrawn Output':preview?'AI Preview — rejected by integrity gate':'Redrawn Output',warning=preview&&!out?'<div class="manual-danger">未通过完整性校验：此 AI 图仅供查看和下载，不能进入正文。</div>':'',svgPath=editableSvgPath(r),svgLink=svgPath?`<a class="btn" href="${fileUrl(svgPath)}" download>下载可编辑 SVG</a>`:'';$('mainTitle').textContent=c.source_label||'Figure Check';$('mainMeta').textContent=[c.section_id,c.paper_id,c.source_type].filter(Boolean).join(' · ');if(tab==='figure'){$('main').innerHTML=`<div class="grid"><div class="box"><h3>Source Candidate</h3>${img(sourcePath(c),c.source_label||'source figure')}</div><div class="box"><h3>${heading}</h3>${warning}${img(display,c.source_label||'redrawn figure')}</div></div><div class="manual-toolbar"><button id="redrawCurrent" class="btn primary">AI 重绘当前化学结构</button>${manualBaseControls(c)}<button id="openManualArrowEditor" class="btn">手动编辑机理箭头</button>${svgLink}</div><div id="redrawCurrentStatus" class="status"></div>${manualEditorOpen?manualEditorMarkup(c):''}<div class="kv"><div>Why selected</div><div>${esc(c.why_selected)}</div><div>What it shows</div><div>${esc(c.what_it_shows)}</div><div>Claim fit</div><div>${esc(c.fits_paragraph_or_claim)}</div><div>Caption</div><div>${esc(c.source_caption_text)}</div><div>Recommended action</div><div>${esc(c.recommended_action)}</div><div>Source PDF</div><div>${esc(c.source_pdf)}</div></div>`;if(manualEditorOpen)setTimeout(()=>initializeManualEditor(c),0)}else if(tab==='redraw'){$('main').innerHTML=`<pre>${esc(JSON.stringify(r||{},null,2))}</pre>`}else if(tab==='report'){$('main').innerHTML=md(payload?.figure_redraw_report_md)}else{$('main').innerHTML=`<pre>${esc(JSON.stringify({candidate:c,redrawn:r,manifest:payload?.redrawn_manifest},null,2))}</pre>`}}
    function renderSummary(){const rows=candidates(),outs=redrawn();const resolved=rows.filter(x=>sourcePath(x)).length;const selectedRows=rows.filter(x=>x.manuscript_selected).length;const redrawDone=outs.filter(x=>outputPath(x)).length;const needs=rows.filter(x=>String(x.resolution_status||'').includes('need')||x.needs_human_check).length;const stale=Boolean(payload?.freshness?.stale);const status=stale?'阻止：章节或图候选已过期，请重新生成。':redrawDone>0&&resolved===rows.length?'Ready after human image verification':'Blocking: source/redraw incomplete';const humanCheck=['1. 源图必须真实来自对应论文。','2. 重绘图只能改变视觉风格，不能改变反应、条件、产物和机理。','3. 未定位源图的候选不能进入终稿。'].join(String.fromCharCode(10));$('projectInfo').textContent=`${selectedProject} · ${payload?.topic||''}`;$('summary').innerHTML=`<div class="field"><div class="label">Status</div><div class="value">${status}</div></div><div class="field"><div class="label">Candidates</div><div class="value">${rows.length}</div></div><div class="field"><div class="label">Manuscript Selected</div><div class="value">${selectedRows}</div></div><div class="field"><div class="label">Source Images Resolved</div><div class="value">${resolved}/${rows.length}</div></div><div class="field"><div class="label">Redrawn Outputs</div><div class="value">${redrawDone}</div></div><div class="field"><div class="label">Needs Human Check</div><div class="value">${needs}</div></div><div class="field"><div class="label">Required Check</div><div class="value">${esc(humanCheck)}</div></div>`}
    function renderBatchActions(){const node=$('batchActions');if(!node)return;const job=batchRedraw(),running=job.status==='running',total=Number(job.total)||0,completed=Number(job.completed)||0,previewIds=new Set(redrawn().filter(x=>rejectedPreviewPath(x)).map(x=>x.figure_id)),recoveredPreview=(job.errors||[]).filter(x=>previewIds.has(x.figure_id)).length,succeeded=(Number(job.succeeded)||0)+recoveredPreview,preview=Math.max(Number(job.preview_succeeded)||0,recoveredPreview),failed=Math.max(0,(Number(job.failed)||0)-recoveredPreview),progress=total?`${completed}/${total}`:'0/0',current=job.current_figure_id?` · 当前：${job.current_figure_id}`:'',outcome=`成功 ${succeeded}${preview?`（其中预览成功 ${preview}）`:''}，失败 ${failed}`,summary=running?`AI 重绘进度：${progress}（${outcome}）${current}`:job.status==='completed'?`批量重绘完成：${completed}/${total}（${outcome}）`:'逐张顺序调用 AI，切换页面后任务仍在后台继续。';node.innerHTML=`<button id="redrawAll" class="btn primary" ${running?'disabled':''}>${running?'全部 AI 重绘中…':'全部 AI 重绘'}</button><div class="batch-progress">${esc(summary)}</div>`}
    async function refreshBatchRedraw(){if(!selectedProject||!payload)return;try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures/redraw-all`);const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||`服务器返回 ${response.status}。`);payload.batch_redraw=result;const figuresResponse=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures`);if(figuresResponse.ok){const figuresPayload=await figuresResponse.json();payload.redrawn_manifest=figuresPayload.redrawn_manifest}renderBatchActions();if(result.status!=='running'){if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}await loadProject(selectedProject,candidates()[selected]?.figure_id||'')}}catch{if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}}}
    function syncBatchPolling(){if(batchRedraw().status==='running'){if(!batchPollTimer)batchPollTimer=setInterval(refreshBatchRedraw,2000)}else if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}}
    async function startBatchRedraw(){const button=$('redrawAll');if(button)button.disabled=true;try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures/redraw-all`,{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:`服务器返回 ${response.status}。`}));if(!response.ok||!result.ok)throw new Error(result.error||`服务器返回 ${response.status}。`);payload.batch_redraw=result;renderBatchActions();syncBatchPolling()}catch(error){if(button)button.disabled=false;const node=$('batchActions');if(node)node.insertAdjacentHTML('beforeend',`<div class="manual-danger">${esc(error.message||String(error))}</div>`)}}
    function batchIsActive(){return ['running','stopping'].includes(batchRedraw().status)}
    function renderBatchActions(){const node=$('batchActions');if(!node)return;const job=batchRedraw(),running=job.status==='running',stopping=job.status==='stopping',active=running||stopping,total=Number(job.total)||0,completed=Number(job.completed)||0,previewIds=new Set(redrawn().filter(x=>rejectedPreviewPath(x)).map(x=>x.figure_id)),recoveredPreview=(job.errors||[]).filter(x=>previewIds.has(x.figure_id)).length,succeeded=(Number(job.succeeded)||0)+recoveredPreview,preview=Math.max(Number(job.preview_succeeded)||0,recoveredPreview),failed=Math.max(0,(Number(job.failed)||0)-recoveredPreview),progress=total?`${completed}/${total}`:'0/0',current=job.current_figure_id?` · 当前：${job.current_figure_id}`:'',outcome=`成功 ${succeeded}${preview?`（其中预览成功 ${preview}）`:''}，失败 ${failed}`,summary=running?`AI 重绘进度：${progress}（${outcome}）${current}`:stopping?`正在停止全部生成：当前请求完成后将不再发送新请求。${progress}（${outcome}）${current}`:job.status==='stopped'?`批量重绘已停止：${completed}/${total}（${outcome}）`:job.status==='completed'?`批量重绘完成：${completed}/${total}（${outcome}）`:'逐张顺序调用 AI，切换页面后任务仍在后台继续。';node.innerHTML=`<button id="redrawAll" class="btn primary" ${active?'disabled':''}>${running?'全部 AI 重绘中…':stopping?'正在停止…':'全部 AI 重绘'}</button>${active?'<button id="stopRedrawAll" class="btn">全部停止生成</button>':''}<div class="batch-progress">${esc(summary)}</div>`}
    async function refreshBatchRedraw(){if(!selectedProject||!payload)return;try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures/redraw-all`);const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||`服务器返回 ${response.status}。`);payload.batch_redraw=result;const figuresResponse=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures`);if(figuresResponse.ok){const figuresPayload=await figuresResponse.json();payload.redrawn_manifest=figuresPayload.redrawn_manifest}renderBatchActions();if(!['running','stopping'].includes(result.status)){if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}await loadProject(selectedProject,candidates()[selected]?.figure_id||'')}}catch{if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}}}
    function syncBatchPolling(){if(batchIsActive()){if(!batchPollTimer)batchPollTimer=setInterval(refreshBatchRedraw,2000)}else if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}}

    function svgOpenKetcherEditor(target=null){const state=svgEditorState;if(!state)return;svgKetcherClose();document.body.insertAdjacentHTML('beforeend',svgKetcherModalMarkup());const modal=$('ketcherModal'),frame=$('ketcherFrame'),insert=$('ketcherInsert'),status=$('ketcherModalStatus'),existingKet=target?svgKetcherFromBase64(target.getAttribute('data-ketcher-ket')):'';let initialized=false,attempts=0;const ready=async()=>{const api=svgKetcherApi(frame);if(!api){if(++attempts<80){setTimeout(ready,125);return}status.textContent='Ketcher 初始化超时。';status.style.color='#a33';return}try{if(existingKet)await api.setMolecule(existingKet);initialized=true;insert.disabled=false;status.textContent=existingKet?'已载入所选结构。':'Ketcher 已就绪；绘制后插入主画布。'}catch(error){status.textContent=`无法载入结构：${error.message||String(error)}`;status.style.color='#a33'}};frame.addEventListener('load',ready);$('ketcherCancel').onclick=svgKetcherClose;modal.addEventListener('pointerdown',event=>{if(event.target===modal)svgKetcherClose()});insert.onclick=async()=>{if(!initialized)return;insert.disabled=true;status.textContent='正在导出并插入 SVG…';try{const exported=await svgKetcherExport(frame);svgInsertKetcherStructure(state,exported.markup,exported.ket,target);svgKetcherClose()}catch(error){status.textContent=error.message||String(error);status.style.color='#a33';insert.disabled=false}}}
    const svgEditorUndoBeforeKetcher=svgEditorUndo;
    svgEditorUndo=function(){const state=svgEditorState,previous=state?.history?.[state.history.length-1];if(previous?.kind==='replace-ketcher-vector'){state.history.pop();const current=state.baseLayer.querySelector(`[data-vector-index="${previous.index}"]`),documentNode=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${previous.markup}</svg>`,'image/svg+xml'),restored=documentNode.documentElement.firstElementChild;if(current&&restored){current.replaceWith(document.importNode(restored,true));svgEditorClearVectorSelection(state);svgKetcherStatus('已恢复修改前的 Ketcher 结构。');return}}svgEditorUndoBeforeKetcher()};
    const bindSvgEditorInteractionsBeforeKetcher=bindSvgEditorInteractions;
    bindSvgEditorInteractions=function(svg){bindSvgEditorInteractionsBeforeKetcher(svg);$('svgOpenKetcher').onclick=()=>svgOpenKetcherEditor();$('svgEditKetcher').onclick=()=>{const target=svgKetcherSelectedNode(svgEditorState);if(!target){svgKetcherStatus('请先用“选择并拖动对象”选中一个 Ketcher 化学结构。',true);return}svgOpenKetcherEditor(target)}};

    // Keep the saved operation type as `erase` for backward compatibility while
    // presenting it as a general-purpose eraser in every active editor surface.
    const manualEditorMarkupBeforeEraserTerminology=manualEditorMarkup;
    manualEditorMarkup=function(candidate){return manualEditorMarkupBeforeEraserTerminology(candidate).replace(/擦除弧形箭头/g,'橡皮擦工具').replace(/擦除宽度/g,'橡皮擦宽度')};
    const svgEditorMarkupBeforeEraserTerminology=svgEditorMarkup;
    svgEditorMarkup=function(candidate){return svgEditorMarkupBeforeEraserTerminology(candidate).replace(/擦除弧形箭头/g,'橡皮擦工具').replace(/擦除宽度/g,'橡皮擦宽度')};

    // Straight lines are editable overlay objects, separate from arrow paths and
    // from the traced chemistry layer.  Keeping them in the operation history
    // makes selection, Delete, Ctrl+Z, SVG download, and PNG export consistent.
    const svgEditorMarkupBeforeLineTool=svgEditorMarkup;
    svgEditorMarkup=function(candidate){return svgEditorMarkupBeforeLineTool(candidate).replace('<option value="arrow">绘制新箭头</option>','<option value="line">绘制直线</option><option value="arrow">绘制新箭头</option>')};
    function svgLineGeometry(operation){return{start:svgArrowPoint(operation?.start,{x:0,y:0}),end:svgArrowPoint(operation?.end,{x:0,y:0})}}
    function svgLineMarkup(operation){const geometry=svgLineGeometry(operation),color=operation?.color||'#111111',width=Math.max(1,Number(operation?.width)||2);return`<line x1="${geometry.start.x}" y1="${geometry.start.y}" x2="${geometry.end.x}" y2="${geometry.end.y}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`}
    function svgEditorLineNode(operation,index){const geometry=svgLineGeometry(operation),color=operation?.color||'#111111',width=Math.max(1,Number(operation?.width)||2);return svgElement('line',{'data-op-index':index,'data-op-type':'line',x1:geometry.start.x,y1:geometry.start.y,x2:geometry.end.x,y2:geometry.end.y,stroke:color,'stroke-width':width,'stroke-linecap':'round',cursor:'pointer'})}
    renderSvgEditorOperations=function(){const state=svgEditorState;if(!state)return;state.overlay.replaceChildren();state.operations.forEach((operation,index)=>{if(operation.type==='erase'){state.overlay.append(svgElement('polyline',{'data-op-index':index,'data-op-type':'erase',points:svgPoints(operation.points),fill:'none',stroke:'#ffffff','stroke-width':Number(operation.width)||8,'stroke-linecap':'round','stroke-linejoin':'round'}))}else if(operation.type==='line'){state.overlay.append(svgEditorLineNode(operation,index))}else if(operation.type==='arrow'){svgEditorArrowNodes(operation,index).forEach(node=>state.overlay.append(node))}});if(state.selectedIndex!==null){state.overlay.querySelectorAll(`[data-op-index="${state.selectedIndex}"]`).forEach(node=>node.setAttribute('filter','url(#svgSelectedArrow)'));const operation=state.operations[state.selectedIndex];if(operation?.type==='arrow')svgEditorArrowHandles(operation,state.selectedIndex).forEach(node=>state.overlay.append(node))}};
    svgEditorDocument=function(state=svgEditorState){if(!state)return'';const base=svgEditorBaseMarkup(state);if(!base)return'';const overlays=state.operations.map(operation=>operation.type==='erase'?`<polyline points="${svgPoints(operation.points)}" fill="none" stroke="#ffffff" stroke-width="${Number(operation.width)||8}" stroke-linecap="round" stroke-linejoin="round"/>`:operation.type==='line'?svgLineMarkup(operation):operation.type==='arrow'?svgArrowMarkup(operation):'').join('');return`<svg xmlns="http://www.w3.org/2000/svg" width="${state.width}" height="${state.height}" viewBox="0 0 ${state.width} ${state.height}" data-original-width="${state.outputWidth||state.width}" data-original-height="${state.outputHeight||state.height}"><title>Full-image chemistry figure vector trace with manual edits</title>${base}<g id="editable-arrow-overlays" data-base-mode="${state.baseMode}">${overlays}</g></svg>`};
    const bindSvgEditorInteractionsBeforeLineTool=bindSvgEditorInteractions;
    bindSvgEditorInteractions=function(svg){bindSvgEditorInteractionsBeforeLineTool(svg);const deleteButton=$('svgDeleteSelected'),deleteBeforeLine=deleteButton?.onclick;if(deleteButton)deleteButton.onclick=()=>{const state=svgEditorState,operation=state?.selectedIndex===null?null:state?.operations?.[state.selectedIndex];if(operation?.type==='line'){state.history.push(svgArrowHistory(state));state.operations.splice(state.selectedIndex,1);state.selectedIndex=null;renderSvgEditorOperations();svgEditorStatus('所选直线已删除。');return}deleteBeforeLine?.()}};
    document.addEventListener('pointerdown',event=>{const state=svgEditorState;if(!state?.svg?.contains(event.target)||$('svgTool')?.value!=='line')return;event.preventDefault();event.stopImmediatePropagation();const start=svgClampArrowPoint(state,svgEditorPoint(event)),operation={type:'line',start,end:{...start},color:$('svgColor')?.value||'#111111',width:Number($('svgWidth')?.value)||2};state.history.push(svgArrowHistory(state));state.operations.push(operation);state.selectedIndex=state.operations.length-1;state.lineDrag={index:state.selectedIndex,start};renderSvgEditorOperations();state.svg.setPointerCapture?.(event.pointerId);svgEditorStatus('拖动以确定直线终点；直接单击会生成一条默认长度的水平直线。')},true);
    document.addEventListener('pointermove',event=>{const state=svgEditorState,drag=state?.lineDrag;if(!drag||!state.svg?.contains(event.target))return;event.preventDefault();event.stopImmediatePropagation();const operation=state.operations[drag.index];if(!operation)return;operation.end=svgClampArrowPoint(state,svgEditorPoint(event));renderSvgEditorOperations()},true);
    const svgFinishLineDrag=event=>{const state=svgEditorState,drag=state?.lineDrag;if(!drag)return;event.preventDefault();event.stopImmediatePropagation();const operation=state.operations[drag.index];if(operation){const dx=operation.end.x-operation.start.x,dy=operation.end.y-operation.start.y;if(Math.hypot(dx,dy)<4)operation.end=svgClampArrowPoint(state,{x:operation.start.x+Math.max(64,Math.min(120,Math.round(state.width*.08))),y:operation.start.y})}state.lineDrag=null;try{state.svg.releasePointerCapture?.(event.pointerId)}catch{}renderSvgEditorOperations();svgEditorStatus('直线已添加；可选择后删除，或按 Ctrl+Z 撤回。')};

    function svgEraseMaskCut(operation){return`<polyline points="${svgPoints(operation.points)}" fill="none" stroke="#000000" stroke-width="${Number(operation.width)||8}" stroke-linecap="round" stroke-linejoin="round"/>`}
    function svgApplyPixelEraseMask(state){if(!state?.svg||!state.baseLayer)return;const trace=state.baseLayer.querySelector('#full-image-vector-trace'),defs=state.svg.querySelector('defs');if(!trace||!defs)return;const erasers=svgEraseOperations(state);let mask=defs.querySelector('#svgPixelEraseMask');if(!erasers.length){trace.removeAttribute('mask');mask?.remove();return}if(!mask){mask=svgElement('mask',{id:'svgPixelEraseMask',x:'0',y:'0',width:state.width,height:state.height,maskUnits:'userSpaceOnUse',maskContentUnits:'userSpaceOnUse'});defs.append(mask)}mask.setAttribute('width',String(state.width));mask.setAttribute('height',String(state.height));mask.replaceChildren(svgElement('rect',{x:'0',y:'0',width:state.width,height:state.height,fill:'#ffffff'}),...erasers.map(operation=>{const cut=svgElement('polyline',{points:svgPoints(operation.points),fill:'none',stroke:'#000000','stroke-width':Number(operation.width)||8,'stroke-linecap':'round','stroke-linejoin':'round'});return cut}));trace.setAttribute('mask','url(#svgPixelEraseMask)')}

    renderSvgEditorOperations=function(){const state=svgEditorState;if(!state)return;svgApplyPixelEraseMask(state);state.overlay.replaceChildren();state.operations.forEach((operation,index)=>{if(operation.type==='line'){state.overlay.append(svgEditorLineNode(operation,index))}else if(operation.type==='arrow'){svgEditorArrowNodes(operation,index).forEach(node=>state.overlay.append(node))}});if(state.selectedIndex!==null){state.overlay.querySelectorAll(`[data-op-index="${state.selectedIndex}"]`).forEach(node=>node.setAttribute('filter','url(#svgSelectedArrow)'));const operation=state.operations[state.selectedIndex];if(operation?.type==='arrow')svgEditorArrowHandles(operation,state.selectedIndex).forEach(node=>state.overlay.append(node))}};
    svgEditorDocument=function(state=svgEditorState){if(!state)return'';svgApplyPixelEraseMask(state);const base=svgEditorBaseMarkup(state);if(!base)return'';const overlays=state.operations.map(operation=>operation.type==='line'?svgLineMarkup(operation):operation.type==='arrow'?svgArrowMarkup(operation):'').join('');return`<svg xmlns="http://www.w3.org/2000/svg" width="${state.width}" height="${state.height}" viewBox="0 0 ${state.width} ${state.height}" data-original-width="${state.outputWidth||state.width}" data-original-height="${state.outputHeight||state.height}"><title>Full-image chemistry figure vector trace with manual edits</title>${svgSavedEraseMask(state)}${base}<g id="editable-arrow-overlays" data-base-mode="${state.baseMode}">${overlays}</g></svg>`};
    loadSvgEditorAudit=async function(candidate,state){const row=matchRedrawn(candidate,selected),audit=row?.manual_arrow_edit?.audit_path;if(!audit)return;try{const response=await fetch(fileUrl(audit));if(!response.ok)return;const record=await response.json();if(Array.isArray(record.operations)){state.operations=record.operations.filter(operation=>operation&&['erase','arrow','line'].includes(operation.type));renderSvgEditorOperations();svgEditorStatus('已加载已有 SVG 编辑操作。')}}catch{}};
