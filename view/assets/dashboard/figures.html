<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Figures</title>
  <style>
    :root{--ink:#20231d;--muted:#6f7469;--line:#d8ceb9;--green:#1f6b55;--red:#934225;--paper:#fffdf7;--shadow:0 18px 46px rgba(58,45,25,.14)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 16% 0,#f8e9be 0 22%,transparent 38%),linear-gradient(135deg,#eef0dc,#faf4e7 48%,#e7dec9);font-family:Georgia,"Times New Roman",serif;height:100vh;overflow:hidden}
    button,select{font:inherit}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,250,240,.94);border-bottom:1px solid var(--line)}
    .nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select{min-width:280px;max-width:520px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--paper);font-size:14px}.nav a.active{background:var(--green);border-color:var(--green);color:white}
    .app{height:calc(100vh - 58px);display:grid;grid-template-columns:330px minmax(560px,1fr) 390px;gap:14px;padding:14px}.panel{background:rgba(255,250,240,.95);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:0;display:flex;flex-direction:column}.head,.tabs{padding:14px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:22px}h2{font-size:18px}.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.35}
    .list,.main,.side{overflow:auto;min-height:0}.list{padding:9px}.card{width:100%;text-align:left;border:1px solid transparent;background:var(--paper);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;color:var(--ink)}.card:hover,.card.active{border-color:var(--green);background:#f2faf0}.title{font-weight:700;font-size:14px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35}.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#e4efe4;color:#285a37;margin:5px 4px 0 0}.warn{background:#f8dfd2;color:var(--red)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:7px 10px;cursor:pointer}.tab.active{background:var(--green);color:white;border-color:var(--green)}
    .main{background:var(--paper);padding:20px 24px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid var(--line);border-radius:14px;background:#fffaf0;padding:12px;min-height:160px}.box img{max-width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:white}.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);background:#fffaf0}.field{margin-bottom:13px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.value{white-space:pre-wrap;line-height:1.45}.side{padding:14px}pre{white-space:pre-wrap;margin:0;font-family:Consolas,monospace;font-size:12px}.kv{display:grid;grid-template-columns:125px 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.kv div:nth-child(odd){color:var(--muted);font-size:12px}
    .manual-editor{margin-top:16px;border:1px solid var(--green);border-radius:14px;padding:14px;background:#f5fbf5}.manual-editor h3{font-size:16px}.manual-note{font-size:13px;color:var(--muted);margin:7px 0 10px}.manual-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}.manual-toolbar label{font-size:13px;display:flex;gap:5px;align-items:center}.manual-toolbar input,.manual-toolbar select{max-width:90px;padding:5px;border:1px solid var(--line);border-radius:6px}.manual-canvas-wrap{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto;max-height:72vh}.manual-canvas{display:block;max-width:100%;height:auto;touch-action:none;cursor:crosshair}.manual-status{font-size:13px;color:var(--muted);min-height:1.4em}.manual-danger{color:var(--red)}.batch-actions{margin-top:10px}.batch-progress{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.35}
    .svg-editor-shell{--svg-green:#185f4b;--svg-green-soft:#e7f2ed;--svg-border:#cbd9d2;--svg-blue:#315f7d;margin-top:20px;padding:0;overflow:hidden;border:1px solid #9ebcaf;border-radius:18px;background:#f8fbf9;box-shadow:0 16px 38px rgba(26,71,55,.14);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .svg-editor-shell>h3{padding:18px 20px 4px;font-size:19px;letter-spacing:-.01em;color:#173f33}.svg-editor-shell>.manual-note{margin:0;padding:2px 20px 15px;color:#597067;line-height:1.55;border-bottom:1px solid #dbe6e1}
    .svg-editor-toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px!important;align-items:stretch!important;margin:0!important;padding:14px!important;background:linear-gradient(180deg,#f2f7f4,#edf4f0);border-bottom:1px solid #d4e1db}
    .svg-toolbar-group{min-width:0;padding:11px;border:1px solid var(--svg-border);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(30,68,54,.05)}.svg-toolbar-tools,.svg-toolbar-file{grid-column:1/-1}.svg-toolbar-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px}.svg-toolbar-heading strong{font-size:12px;color:#38594d;letter-spacing:.06em;text-transform:uppercase}.svg-toolbar-heading span{font-size:11px;color:#82958e}.svg-toolbar-body{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .svg-tool-palette{display:grid;grid-template-columns:repeat(3,minmax(94px,1fr));gap:7px;width:100%}.svg-tool-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:7px 9px;border:1px solid #c9d7d1;border-radius:10px;background:#fff;color:#29463c;cursor:pointer;transition:background .16s,border-color .16s,color .16s,box-shadow .16s,transform .16s}.svg-tool-button:hover{border-color:#74a28e;background:#f2f8f5;transform:translateY(-1px)}.svg-tool-button.active,.svg-tool-button[aria-pressed="true"]{border-color:var(--svg-green);background:var(--svg-green);color:#fff;box-shadow:0 5px 14px rgba(24,95,75,.23)}.svg-tool-button:focus-visible,.svg-editor-toolbar .btn:focus-visible,.svg-editor-toolbar input:focus-visible,.svg-editor-toolbar select:focus-visible{outline:3px solid #e7a942;outline-offset:2px}.svg-tool-icon{font-family:Arial,sans-serif;font-size:18px;line-height:1}.svg-tool-label{font-size:12px;font-weight:650;white-space:nowrap}.svg-tool-hint{width:100%;margin-top:8px;padding:7px 9px;border-radius:8px;background:#f3f7f5;color:#5d726a;font-size:12px;line-height:1.4}
    .svg-native-tool-label{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.svg-editor-toolbar label{display:grid!important;grid-template-columns:auto minmax(54px,1fr);gap:7px!important;align-items:center!important;min-height:36px;padding:5px 8px;border:1px solid #d8e2dd;border-radius:9px;background:#f9fbfa;color:#4b6259;font-size:12px!important}.svg-editor-toolbar label[hidden],.svg-editor-toolbar button[hidden]{display:none!important}.svg-editor-toolbar input,.svg-editor-toolbar select{width:74px;max-width:120px!important;min-height:28px;padding:3px 6px!important;border:1px solid #bdccc5!important;border-radius:7px!important;background:#fff}.svg-editor-toolbar input[type="color"]{width:38px;height:28px;padding:2px!important;cursor:pointer}
    .svg-editor-toolbar .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 11px;border:1px solid #c7d4ce;border-radius:9px;background:#fff;color:#29463c;cursor:pointer;box-shadow:none;transition:background .16s,border-color .16s,transform .16s}.svg-editor-toolbar .btn:hover:not(:disabled){border-color:#79a692;background:#f0f7f3;transform:translateY(-1px)}.svg-editor-toolbar .btn:disabled{opacity:.45;cursor:not-allowed}.svg-editor-toolbar .btn.primary{border-color:var(--svg-green);background:var(--svg-green);color:#fff}.svg-editor-toolbar .btn.primary:hover:not(:disabled){background:#124d3d}.svg-editor-toolbar .svg-delete-action{border-color:#e0c3b7;color:#8c3e27;background:#fff9f6}.svg-editor-toolbar .svg-close-action{margin-left:auto;color:#65756f;background:#f4f6f5}.svg-button-icon{font-family:Arial,sans-serif;font-size:14px;line-height:1}
    .svg-editor-shell>.manual-status{position:relative;margin:12px 14px 0;padding:10px 12px 10px 34px;border:1px solid #d3e1db;border-radius:10px;background:#fff;color:#4d655c;line-height:1.45}.svg-editor-shell>.manual-status:before{content:"";position:absolute;left:13px;top:14px;width:9px;height:9px;border-radius:50%;background:#3f9875;box-shadow:0 0 0 4px #e2f2eb}.svg-editor-shell>.manual-status.manual-danger:before{background:#b75a3a;box-shadow:0 0 0 4px #f7e7e0}
    .svg-editor-shell>.manual-canvas-wrap{margin:12px 14px 14px;max-height:70vh;border:1px solid #bdcec6;border-radius:12px;background-color:#fff;background-image:linear-gradient(45deg,#f3f6f4 25%,transparent 25%),linear-gradient(-45deg,#f3f6f4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f3f6f4 75%),linear-gradient(-45deg,transparent 75%,#f3f6f4 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;box-shadow:inset 0 0 0 5px rgba(255,255,255,.75)}
    @media(max-width:760px){.svg-editor-toolbar{grid-template-columns:1fr}.svg-toolbar-tools,.svg-toolbar-file{grid-column:auto}.svg-tool-palette{grid-template-columns:repeat(3,minmax(76px,1fr))}.svg-toolbar-file .svg-toolbar-body{align-items:stretch}.svg-toolbar-file .btn{flex:1}.svg-editor-toolbar .svg-close-action{margin-left:0}}
    @media(max-width:1100px){body{height:auto;overflow:auto}.app{height:auto;grid-template-columns:1fr}.panel{min-height:360px}.grid{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css">
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a href="/sections">Sections</a><a class="active" href="/figures">Figures</a><a href="/draft">Draft</a><a href="/final">Final</a></div></nav>
  <main class="app">
    <section class="panel"><div class="head"><h1>Figure Redraw</h1><div id="projectInfo" class="sub">Loading...</div><div id="batchActions" class="batch-actions"></div></div><div id="figureList" class="list"></div></section>
    <section class="panel"><div class="head"><h2 id="mainTitle">Figure Check</h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-tab="figure">Figure</button><button class="tab" data-tab="redraw">Redraw</button><button class="tab" data-tab="report">Report</button><button class="tab" data-tab="raw">Raw JSON</button></div><div id="main" class="main"></div></section>
    <section class="panel"><div class="head"><h2>Review Gate</h2><div class="sub">Do not proceed unless source image and redrawn output are both verified.</div></div><div id="summary" class="side"></div></section>
  </main>
  <script src="/assets/dashboard/review-ui.js"></script>
  <script>
    let projects=[],payload=null,selectedProject='',selected=0,tab='figure',manualEditorOpen=false,manualArrowState=null,manualEditorBaseMode='source',svgEditorOpen=false,svgEditorState=null,batchPollTimer=null,assetRevision=0;
    const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const fileUrl=path=>path?`/file?path=${encodeURIComponent(path)}&v=${assetRevision}`:'';
    const candidates=()=>{const c=payload?.figure_candidates;return Array.isArray(c)?c:(c?.figures||c?.candidates||[])};
    const redrawn=()=>{const r=payload?.redrawn_manifest;return Array.isArray(r)?r:(r?.figures||r?.items||r?.redrawn_figures||[])};
    const batchRedraw=()=>payload?.batch_redraw||{status:'idle',total:0,completed:0,succeeded:0,preview_succeeded:0,failed:0};
    function rowKey(x,i){return x.figure_id||x.candidate_id||[x.section_id,x.paper_id,x.source_label].filter(Boolean).join(' · ')||String(i)}
    function sourcePath(x){return x.source_image_path||x.source_path||x.image_path||''}
    function rejectedPreviewPath(x){return x?.rejected_preview_image||''}
    function matchRedrawn(c,i){const k=rowKey(c,i);return redrawn().find(r=>rowKey(r,i)===k||r.source_label===c.source_label&&r.paper_id===c.paper_id&&r.section_id===c.section_id)||{}}
    function img(path,label){return path?`<a href="${fileUrl(path)}" target="_blank"><img alt="${esc(label)}" src="${fileUrl(path)}"></a>`:`<div class="empty">No image path resolved.</div>`}
    function md(s){return String(s||'').split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return'';let m=b.match(/^###\s+(.+)/);if(m)return`<h3>${esc(m[1])}</h3>`;m=b.match(/^##\s+(.+)/);if(m)return`<h2>${esc(m[1])}</h2>`;m=b.match(/^#\s+(.+)/);if(m)return`<h1>${esc(m[1])}</h1>`;return`<p>${esc(b).replace(/\n/g,'<br>')}</p>`}).join('')}
    async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.project_id)}">${esc(p.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;loadProject(initial.project_id)}}
    async function loadProject(id,keepFigureId=''){selectedProject=id;manualEditorOpen=false;manualArrowState=null;assetRevision+=1;payload=await(await fetch(`/api/project/${encodeURIComponent(id)}/figures`,{cache:'no-store'})).json();if(payload?.freshness)payload.freshness.stale=Boolean(payload.freshness.source_stale);const preserved=candidates().findIndex(candidate=>candidate.figure_id===keepFigureId);selected=preserved>=0?preserved:0;render()}
    function renderList(){const rows=candidates();$('figureList').innerHTML=rows.map((x,i)=>{const status=x.resolution_status||x.status||'pending';const r=matchRedrawn(x,i);const out=outputPath(r);return`<button class="card ${i===selected?'active':''}" data-idx="${i}"><div class="title">${esc(x.source_label||rowKey(x,i))}</div><div class="meta">${esc(x.section_id||'')} · ${esc(x.paper_id||'')}</div><span class="pill ${status.includes('need')?'warn':''}">${esc(status)}</span><span class="pill ${out?'':'warn'}">${out?'redrawn':'no redraw'}</span></button>`}).join('')||'<div class="empty">No figure candidates found.</div>'}
    function manualBasePath(candidate){const r=matchRedrawn(candidate,selected),ai=outputPath(r)||rejectedPreviewPath(r);return manualEditorBaseMode==='redrawn'&&ai?ai:sourcePath(candidate)}
    function manualBaseControls(candidate){const r=matchRedrawn(candidate,selected),ai=outputPath(r)||rejectedPreviewPath(r),disabled=ai?'':'disabled';if(!ai&&manualEditorBaseMode==='redrawn')manualEditorBaseMode='source';return`<label>编辑底图 <select id="manualBaseMode"><option value="source" ${manualEditorBaseMode==='source'?'selected':''}>原图</option><option value="redrawn" ${manualEditorBaseMode==='redrawn'?'selected':''} ${disabled}>AI 重绘图</option></select></label>`}
    function editableSvgPath(redrawnRow){return redrawnRow?.editable_svg||redrawnRow?.manual_arrow_edit?.editable_svg||''}
    // Kept only for legacy saved pages. Stage 7 now exposes the full SVG editor.
    function manualEditorMarkup(){return ''}
    async function startBatchRedraw(){const button=$('redrawAll');if(button)button.disabled=true;try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures/redraw-all`,{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:`服务器返回 ${response.status}。`}));if(!response.ok||!result.ok)throw new Error(result.error||`服务器返回 ${response.status}。`);payload.batch_redraw=result;renderBatchActions();syncBatchPolling()}catch(error){if(button)button.disabled=false;const node=$('batchActions');if(node)node.insertAdjacentHTML('beforeend',`<div class="manual-danger">${esc(error.message||String(error))}</div>`)}}
    function batchIsActive(){return ['running','stopping'].includes(batchRedraw().status)}
    function renderBatchActions(){const node=$('batchActions');if(!node)return;const job=batchRedraw(),running=job.status==='running',stopping=job.status==='stopping',active=running||stopping,total=Number(job.total)||0,completed=Number(job.completed)||0,previewIds=new Set(redrawn().filter(x=>rejectedPreviewPath(x)).map(x=>x.figure_id)),recoveredPreview=(job.errors||[]).filter(x=>previewIds.has(x.figure_id)).length,succeeded=(Number(job.succeeded)||0)+recoveredPreview,preview=Math.max(Number(job.preview_succeeded)||0,recoveredPreview),failed=Math.max(0,(Number(job.failed)||0)-recoveredPreview),progress=total?`${completed}/${total}`:'0/0',current=job.current_figure_id?` · 当前：${job.current_figure_id}`:'',outcome=`成功 ${succeeded}${preview?`（其中预览成功 ${preview}）`:''}，失败 ${failed}`,summary=running?`AI 重绘进度：${progress}（${outcome}）${current}`:stopping?`正在停止全部生成：当前请求完成后将不再发送新请求。${progress}（${outcome}）${current}`:job.status==='stopped'?`批量重绘已停止：${completed}/${total}（${outcome}）`:job.status==='completed'?`批量重绘完成：${completed}/${total}（${outcome}）`:'逐张顺序调用 AI，切换页面后任务仍在后台继续。';node.innerHTML=`<button id="redrawAll" class="btn primary" ${active?'disabled':''}>${running?'全部 AI 重绘中…':stopping?'正在停止…':'全部 AI 重绘'}</button>${active?'<button id="stopRedrawAll" class="btn">全部停止生成</button>':''}<div class="batch-progress">${esc(summary)}</div>`}
    async function refreshBatchRedraw(){if(!selectedProject||!payload)return;try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures/redraw-all`);const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||`服务器返回 ${response.status}。`);payload.batch_redraw=result;const figuresResponse=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures`);if(figuresResponse.ok){const figuresPayload=await figuresResponse.json();payload.redrawn_manifest=figuresPayload.redrawn_manifest}renderBatchActions();if(!['running','stopping'].includes(result.status)){if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}await loadProject(selectedProject,candidates()[selected]?.figure_id||'')}}catch{if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}}}
    function syncBatchPolling(){if(batchIsActive()){if(!batchPollTimer)batchPollTimer=setInterval(refreshBatchRedraw,2000)}else if(batchPollTimer){clearInterval(batchPollTimer);batchPollTimer=null}}
    async function stopBatchRedraw(){const button=$('stopRedrawAll');if(button)button.disabled=true;try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures/redraw-all/stop`,{method:'POST'});const result=await response.json().catch(()=>({ok:false,error:`服务器返回 ${response.status}。`}));if(!response.ok||!result.ok)throw new Error(result.error||`服务器返回 ${response.status}。`);payload.batch_redraw=result;renderBatchActions();syncBatchPolling()}catch(error){if(button)button.disabled=false;const node=$('batchActions');if(node)node.insertAdjacentHTML('beforeend',`<div class="manual-danger">${esc(error.message||String(error))}</div>`)}}
    function manualPoint(event){const state=manualArrowState,rect=state.canvas.getBoundingClientRect();return{x:Math.round((event.clientX-rect.left)*state.canvas.width/rect.width),y:Math.round((event.clientY-rect.top)*state.canvas.height/rect.height)}}
    function manualSnapshot(){const state=manualArrowState;if(!state)return;state.history.push(state.canvas.toDataURL('image/png'));if(state.history.length>30)state.history.shift()}
    function manualRestore(data){const state=manualArrowState,img=new Image;img.onload=()=>{state.ctx.clearRect(0,0,state.canvas.width,state.canvas.height);state.ctx.drawImage(img,0,0)};img.src=data}
    function drawManualArrow(points,color,width){const state=manualArrowState;if(!state||points.length<2)return;const ctx=state.ctx,last=points[points.length-1],prev=points[points.length-2],angle=Math.atan2(last.y-prev.y,last.x-prev.x),head=Math.max(8,width*5);ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x-head*Math.cos(angle-Math.PI/6),last.y-head*Math.sin(angle-Math.PI/6));ctx.lineTo(last.x-head*Math.cos(angle+Math.PI/6),last.y-head*Math.sin(angle+Math.PI/6));ctx.closePath();ctx.fill();ctx.restore()}

      styleControls.forEach(([id,tools])=>{
        const label=svgToolbarLabelFor(id);
        if(label){label.dataset.tools=tools;styleGroup.querySelector('.svg-toolbar-body').append(label)}
      });

      [
        svgToolbarDecorateButton('svgOpenKetcher','⬡','添加化学结构'),
        svgToolbarDecorateButton('svgEditKetcher','✎','编辑所选结构'),
        svgToolbarDecorateButton('svgApplyTextStyle','T','应用文本样式'),
      ].filter(Boolean).forEach(button=>insertGroup.querySelector('.svg-toolbar-body').append(button));

      [
        svgToolbarDecorateButton('svgFinishArrow','×','取消当前箭头'),
        svgToolbarDecorateButton('svgDeleteSelected','⌫','删除所选','svg-delete-action'),
        svgToolbarDecorateButton('svgUndo','↶','撤回一步'),
      ].filter(Boolean).forEach(button=>editGroup.querySelector('.svg-toolbar-body').append(button));

      [
        svgToolbarDecorateButton('svgDownload','⇩','下载 SVG'),
        svgToolbarDecorateButton('svgSave','✓','保存编辑'),
        svgToolbarDecorateButton('svgClose','×','关闭编辑器','svg-close-action'),
      ].filter(Boolean).forEach(button=>fileGroup.querySelector('.svg-toolbar-body').append(button));

      toolbar.replaceChildren(toolsGroup,styleGroup,insertGroup,editGroup,fileGroup);
      const sync=()=>{
        const active=tool.value||'select',meta=svgToolbarToolMeta[active]||svgToolbarToolMeta.select;
        editor.dataset.activeTool=active;
        palette.querySelectorAll('[data-svg-tool]').forEach(button=>{
          const selected=button.dataset.svgTool===active;
          button.classList.toggle('active',selected);
          button.setAttribute('aria-pressed',String(selected));
        });
        hint.textContent=meta.hint;
        styleGroup.querySelectorAll('[data-tools]').forEach(label=>{
          label.hidden=!label.dataset.tools.split(/\s+/).includes(active);
        });
        styleGroup.hidden=![...styleGroup.querySelectorAll('[data-tools]')].some(label=>!label.hidden);
        const finish=$('svgFinishArrow'),applyText=$('svgApplyTextStyle'),editKetcher=$('svgEditKetcher');
        if(finish)finish.hidden=active!=='arrow';
        if(applyText)applyText.hidden=active!=='text';
        if(editKetcher)editKetcher.disabled=active!=='select';
        const canvas=svgEditorState?.svg||$('svgEditorCanvas');
        if(canvas)canvas.style.cursor=active==='select'?'move':active==='erase'?'cell':'crosshair';
      };
      tool.addEventListener('change',sync);
      sync();
    }
    const bindSvgEditorInteractionsBeforeToolbarPolish=bindSvgEditorInteractions;
    bindSvgEditorInteractions=function(svg){bindSvgEditorInteractionsBeforeToolbarPolish(svg);svgEnhanceEditorToolbar()};

    // A changed Stage 6 selection invalidates only the old redraw, not the
    // current source candidate. Keep the selected source visible in Stage 7
    // and hide outputs whose recorded source cannot be matched to it.
    const matchRedrawnBeforeSourceFreshness=matchRedrawn;
    function normalizedFigureSource(path){return String(path||'').replace(/\\/g,'/').toLowerCase()}
    matchRedrawn=function(candidate,index){
      const row=matchRedrawnBeforeSourceFreshness(candidate,index);
      if(!row||!payload?.freshness?.redraw_stale)return row;
      const outputSource=row.source_image||row.resolved_source_image||row.source_image_path||'';
      return outputSource&&normalizedFigureSource(outputSource)===normalizedFigureSource(sourcePath(candidate))?row:{};
    };
    renderSummary=function(){
      const rows=candidates();
      const resolved=rows.filter(row=>sourcePath(row)).length;
      const selectedRows=rows.filter(row=>row.manuscript_selected).length;
      const redrawDone=rows.filter((row,index)=>outputPath(matchRedrawn(row,index))).length;
      const needs=rows.filter(row=>String(row.resolution_status||'').includes('need')||row.needs_human_check).length;
      const sourceStale=Boolean(payload?.freshness?.source_stale);
      const redrawStale=Boolean(payload?.freshness?.redraw_stale);
      const status=sourceStale
        ?'阻止：章节或候选来源已过期，请重新生成。'
        :redrawStale
          ?`第六阶段选图已载入；${redrawDone}/${rows.length} 个重绘结果与当前选图匹配，其余需要重新重绘。`
          :redrawDone===rows.length&&resolved===rows.length
            ?'Ready after human image verification'
            :'Blocking: source/redraw incomplete';
      const humanCheck=['1. 源图必须真实来自对应论文。','2. 重绘图只能改变视觉风格，不能改变反应、条件、产物和机理。','3. 未定位源图的候选不能进入终稿。'].join(String.fromCharCode(10));
      $('projectInfo').textContent=`${selectedProject} · ${payload?.topic||''}`;
      $('summary').innerHTML=`<div class="field"><div class="label">Status</div><div class="value">${status}</div></div><div class="field"><div class="label">Candidates</div><div class="value">${rows.length}</div></div><div class="field"><div class="label">Manuscript Selected</div><div class="value">${selectedRows}</div></div><div class="field"><div class="label">Source Images Resolved</div><div class="value">${resolved}/${rows.length}</div></div><div class="field"><div class="label">Current Redrawn Outputs</div><div class="value">${redrawDone}/${rows.length}</div></div><div class="field"><div class="label">Needs Human Check</div><div class="value">${needs}</div></div><div class="field"><div class="label">Required Check</div><div class="value">${esc(humanCheck)}</div></div>`;
    };
    const renderBeforeSourceFreshness=render;
    render=function(){
      renderBeforeSourceFreshness();
      if(payload?.freshness?.redraw_stale&&!payload?.freshness?.source_stale){
        $('main')?.insertAdjacentHTML('afterbegin','<div class="manual-danger">第六阶段的当前选图已载入；旧重绘结果与当前选图不一致，已隐藏。请重新重绘当前图或执行全部 AI 重绘。</div>');
      }
    };

    // Failed automated integrity gates remain visible as previews. They become
    // manuscript-eligible only after a reviewer explicitly approves the exact
    // current source/output hashes.
    function humanApprovalCurrent(row){
      const approval=row?.human_approval;
      return Boolean(
        approval?.status==='approved'
        && approval?.current_source_match!==false
        && approval?.current_output_match!==false
      );
    }
    outputPath=function(row){
      if(!row)return'';
      const integrity=row?.chemistry_integrity?.status;
      const warningDisposition=row?.output_disposition==='saved_with_integrity_warning';
      const humanApproved=humanApprovalCurrent(row);
      if((integrity==='failed'||integrity==='needs_human_arrow_check'||warningDisposition)&&!humanApproved)return'';
      const standardIntegrity=!integrity||integrity==='pass';
      const sourceFaithful=['source-faithful-bw','source-faithful-color','source-faithful-outline-color'].includes(row?.render_mode);
      const manual=row?.render_mode==='manual-arrow-edit';
      const standardAi=row?.render_mode==='ai-edit'
        && row?.edit_profile!=='mechanism-arrow-straighten'
        && row?.structural_fidelity?.status==='pass'
        && standardIntegrity;
      const ocrAi=row?.render_mode==='ocr-hollow-ai'
        && row?.content_fidelity?.status==='pass'
        && row?.structural_fidelity?.status==='pass'
        && standardIntegrity;
      const mechanism=row?.render_mode==='ai-edit'
        && row?.edit_profile==='mechanism-arrow-straighten'
        && row?.mechanism_source_fidelity?.status==='pass'
        && standardIntegrity;
      if(row?.render_mode&&!humanApproved&&!sourceFaithful&&!manual&&!standardAi&&!ocrAi&&!mechanism)return'';
      return row.output_path||row.redrawn_path||row.output_image_path||row.redrawn_image||row.image_path||row.path||'';
    };
    renderMain=function(){
      if(payload?.freshness?.stale){
        $('mainTitle').textContent='图候选已过期';
        $('mainMeta').textContent='';
        $('main').innerHTML='<div class="empty">Blueprint 已更新。请先重新生成章节草稿和图候选，旧图候选与重绘结果不会用于当前流程。</div>';
        return;
      }
      const candidate=candidates()[selected]||{};
      const row=matchRedrawn(candidate,selected);
      const output=outputPath(row);
      const preview=rejectedPreviewPath(row);
      const display=output||preview;
      const approved=humanApprovalCurrent(row);
      const heading=output
        ?approved?'Redrawn Output — 人工审核已通过':'Redrawn Output'
        :preview?'AI Preview — 等待人工审核':'Redrawn Output';
      const warning=preview&&!output
        ?'<div class="manual-danger">未通过自动完整性校验：此图目前仅供查看和下载。请逐项核对化学结构、化学键、文字、箭头、流程和版式；确认正确后可人工批准进入正文。</div>'
        :approved?'<div class="manual-note">已由人工审核批准进入正文；批准记录绑定当前候选原图和此输出文件。</div>':'';
      const aspectWarning=row?.aspect_ratio_integrity?.status==='failed'
        ?`<div class="manual-danger">画布比例不匹配：原图 ${esc((row.aspect_ratio_integrity.source_size||[]).join('×'))}，重绘图 ${esc((row.aspect_ratio_integrity.output_size||[]).join('×'))}。该旧输出不能进入正文，请重新 AI 重绘。</div>`
        :'';
      const approveButton=preview&&!output&&row?.aspect_ratio_integrity?.status!=='failed'
        ?'<button id="humanApproveFigure" class="btn primary">人工审核通过，允许进入正文</button>'
        :'';
      const svgPath=editableSvgPath(row);
      const svgLink=svgPath?`<a class="btn" href="${fileUrl(svgPath)}" download>下载可编辑 SVG</a>`:'';
      $('mainTitle').textContent=candidate.source_label||'Figure Check';
      $('mainMeta').textContent=[candidate.section_id,candidate.paper_id,candidate.source_type].filter(Boolean).join(' · ');
      if(tab==='figure'){
        $('main').innerHTML=`<div class="grid"><div class="box"><h3>Source Candidate</h3>${img(sourcePath(candidate),candidate.source_label||'source figure')}</div><div class="box"><h3>${heading}</h3>${aspectWarning}${warning}${img(display,candidate.source_label||'redrawn figure')}</div></div><div id="figureActions" class="manual-toolbar"><button id="redrawCurrent" class="btn primary">AI 重绘当前化学结构</button>${approveButton}${manualBaseControls(candidate)}<button id="openSvgEditor" class="btn">在线编辑 SVG</button>${svgLink}</div><div id="redrawCurrentStatus" class="status"></div><div class="kv"><div>Why selected</div><div>${esc(candidate.why_selected)}</div><div>What it shows</div><div>${esc(candidate.what_it_shows)}</div><div>Claim fit</div><div>${esc(candidate.fits_paragraph_or_claim)}</div><div>Caption</div><div>${esc(candidate.source_caption_text)}</div><div>Recommended action</div><div>${esc(candidate.recommended_action)}</div><div>Source PDF</div><div>${esc(candidate.source_pdf)}</div></div>`;
      }else if(tab==='redraw'){
        $('main').innerHTML=`<pre>${esc(JSON.stringify(row||{},null,2))}</pre>`;
      }else if(tab==='report'){
        $('main').innerHTML=md(payload?.figure_redraw_report_md);
      }else{
        $('main').innerHTML=`<pre>${esc(JSON.stringify({candidate,redrawn:row,manifest:payload?.redrawn_manifest},null,2))}</pre>`;
      }
    };
    async function approveCurrentFigure(){
      const candidate=candidates()[selected];
      if(!candidate?.figure_id)return;
      if(!window.confirm('请确认你已逐项核对该图的化学结构、化学键、文字、箭头方向、反应流程和版式，且同意它进入正文。'))return;
      const button=$('humanApproveFigure');
      if(button)button.disabled=true;
      try{
        const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/figures/${encodeURIComponent(candidate.figure_id)}/human-approve`,{method:'POST'});
        const result=await response.json().catch(()=>({ok:false,error:`服务器返回 ${response.status}。`}));
        if(!response.ok||!result.ok)throw new Error(result.error||`服务器返回 ${response.status}。`);
        await loadProject(selectedProject,candidate.figure_id);
        const status=$('redrawCurrentStatus');
        if(status)status.textContent='人工审核记录已保存；此图现在可以进入下一阶段和正文。';
      }catch(error){
        const status=$('redrawCurrentStatus');
        if(status){status.className='status error';status.textContent=error.message||String(error)}
        const currentButton=$('humanApproveFigure');
        if(currentButton)currentButton.disabled=false;
      }
    }
    $('main').addEventListener('click',event=>{
      if(event.target.closest('#humanApproveFigure'))approveCurrentFigure();
    });
  </script>
</body>
</html>
