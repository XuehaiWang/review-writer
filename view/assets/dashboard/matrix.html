<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Matrix</title>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css?v=20260803">
  <style>
    :root { --ink:#1f2024; --muted:#69707b; --line:#d7cbb7; --green:#1e6a58; --paper:#fffdf7; --panel:#fffaf1; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#efe3cc; font:14px Georgia,"Times New Roman",serif; }
    button,select,input,textarea { font:inherit; } .nav { height:58px; display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
    .nav-title { font-weight:700; font-size:18px; } .nav-center { flex:1; text-align:center; } .project-select { min-width:280px; max-width:520px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--paper); }
    .nav-right { display:flex; gap:7px; flex-wrap:wrap; } .nav a { padding:7px 10px; color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:6px; background:var(--paper); } .nav a.active { color:#fff; background:var(--green); border-color:var(--green); }
    .app { height:calc(100vh - 58px); display:grid; grid-template-columns:300px minmax(500px,1fr) 320px; gap:14px; padding:14px; } .panel { min-height:0; overflow:hidden; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:7px; }
    .head,.toolbar,.tabs { padding:14px; border-bottom:1px solid var(--line); } h1,h2 { margin:0; font-size:18px; } .sub,.meta { margin-top:5px; color:var(--muted); font-size:12px; line-height:1.45; }
    .toolbar { padding:10px; } input[type="search"],textarea { width:100%; border:1px solid var(--line); border-radius:6px; background:var(--paper); padding:9px; } .list,.main,.side { min-height:0; overflow:auto; } .list,.side { padding:10px; } .main { padding:24px 30px; background:var(--paper); line-height:1.55; }
    .paper { width:100%; margin-bottom:7px; padding:10px; text-align:left; color:var(--ink); border:1px solid transparent; border-radius:6px; background:var(--paper); cursor:pointer; } .paper.active,.paper:hover { border-color:var(--green); background:#f2faf0; } .paper-title { font-weight:700; line-height:1.3; }
    .pill { display:inline-block; margin:6px 4px 0 0; padding:2px 6px; color:#285a37; background:#e4efe4; border-radius:5px; font-size:11px; } .pill.warn { color:#8d3e20; background:#f9dfd0; }
    .tabs { display:flex; gap:7px; flex-wrap:wrap; } .tab,.btn { padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--paper); cursor:pointer; } .tab.active,.btn.primary { color:#fff; background:var(--green); border-color:var(--green); }
    .field { margin-bottom:16px; } .label { margin-bottom:4px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; } .value { white-space:pre-wrap; } textarea { min-height:230px; resize:vertical; line-height:1.45; }
    .outline-workspace { display:grid; gap:18px; }
    .outline-hero { position:relative; overflow:hidden; display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:19px 20px; color:#fff; border-radius:12px; background:linear-gradient(135deg,#174f44 0%,#247863 100%); box-shadow:0 8px 24px rgba(30,106,88,.14); }
    .outline-hero::after { content:""; position:absolute; right:-58px; bottom:-78px; width:190px; height:190px; border:30px solid rgba(255,255,255,.08); border-radius:50%; }
    .outline-hero-copy { position:relative; z-index:1; max-width:650px; }
    .outline-eyebrow { margin-bottom:5px; color:#cce7df; font:700 11px/1.2 Arial,sans-serif; text-transform:uppercase; letter-spacing:.12em; }
    .outline-hero h3 { margin:0; font-size:21px; line-height:1.25; }
    .outline-hero p { margin:7px 0 0; color:#e5f2ee; line-height:1.5; }
    .outline-state { position:relative; z-index:1; flex:0 0 auto; padding:7px 10px; color:#174f44; border:1px solid rgba(255,255,255,.6); border-radius:999px; background:#fff; font:700 11px/1 Arial,sans-serif; white-space:nowrap; }
    .outline-state.pending { color:#7a4a17; background:#fff7e9; }
    .outline-section { padding:18px; border:1px solid #dfd4c2; border-radius:12px; background:#fffefb; box-shadow:0 4px 14px rgba(70,55,31,.04); }
    .outline-section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:13px; }
    .outline-section h3 { margin:0; font-size:17px; }
    .outline-section-note { margin-top:4px; color:var(--muted); font-size:12px; }
    .outline-card-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
    .outline-card { min-width:0; display:flex; flex-direction:column; padding:15px; border:1px solid #d9d0c2; border-radius:10px; background:#fff; transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease; }
    .outline-card:hover { border-color:#7da99d; box-shadow:0 7px 18px rgba(30,106,88,.09); transform:translateY(-1px); }
    .outline-card.current { border-color:var(--green); background:linear-gradient(180deg,#f6fcf9 0%,#fff 100%); box-shadow:0 0 0 2px rgba(30,106,88,.11); }
    .outline-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .outline-icon { display:grid; place-items:center; width:34px; height:34px; color:var(--green); border:1px solid #b9d6cd; border-radius:9px; background:#eaf5f1; font:700 14px/1 Arial,sans-serif; }
    .outline-selected-mark { display:none; color:var(--green); font:700 11px/1 Arial,sans-serif; }
    .outline-card.current .outline-selected-mark { display:block; }
    .outline-card h4 { margin:12px 0 6px; font-size:15px; line-height:1.3; }
    .outline-card p { flex:1; margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.5; }
    .outline-choice { width:100%; padding:8px 10px; color:var(--green); border:1px solid #78a99c; border-radius:7px; background:#f3faf7; cursor:pointer; font-weight:700; text-align:center; }
    .outline-choice:hover,.outline-choice:focus-visible { color:#fff; border-color:var(--green); background:var(--green); outline:none; }
    .outline-card.current .outline-choice { color:#fff; border-color:var(--green); background:var(--green); }
    .outline-upload { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:18px; padding:18px; border:1px dashed #86a99f; border-radius:10px; background:linear-gradient(135deg,#f5fbf8,#fffaf1); }
    .outline-upload-copy { display:flex; align-items:center; gap:13px; min-width:0; }
    .outline-upload-icon { position:relative; flex:0 0 auto; width:42px; height:42px; border-radius:12px; background:#dceee8; }
    .outline-upload-icon::before { content:""; position:absolute; left:19px; top:10px; width:4px; height:17px; border-radius:2px; background:var(--green); }
    .outline-upload-icon::after { content:""; position:absolute; left:14px; top:10px; width:10px; height:10px; border-top:4px solid var(--green); border-left:4px solid var(--green); transform:rotate(45deg); }
    .outline-upload h4 { margin:0 0 4px; font-size:15px; }
    .outline-upload p { margin:0; color:var(--muted); font-size:12px; line-height:1.45; }
    .upload-reference-btn { padding:9px 13px; color:#fff; border:1px solid var(--green); border-radius:8px; background:var(--green); cursor:pointer; font-weight:700; white-space:nowrap; }
    .upload-reference-btn:hover,.upload-reference-btn:focus-visible { background:#164f42; outline:3px solid rgba(30,106,88,.16); outline-offset:2px; }
    .reference-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:9px; margin-top:14px; }
    .reference-card { display:flex; align-items:center; gap:10px; padding:11px; border:1px solid #ddd3c4; border-radius:9px; background:#fff; }
    .reference-card.current { border-color:var(--green); background:#f3faf7; }
    .reference-file { flex:1; min-width:0; }
    .reference-file strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .reference-file span { color:var(--muted); font-size:11px; }
    .reference-select { flex:0 0 auto; padding:7px 9px; color:var(--green); border:1px solid #78a99c; border-radius:7px; background:#fff; cursor:pointer; }
    .reference-card.current .reference-select { color:#fff; border-color:var(--green); background:var(--green); }
    .outline-preview { overflow:hidden; border:1px solid #ddd3c4; border-radius:10px; background:#fff; }
    .outline-preview-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; border-bottom:1px solid #e5dccf; background:#f8f3e9; }
    .outline-preview-head strong { font-size:13px; }
    .outline-preview pre { max-height:460px; overflow:auto; margin:0; padding:16px; color:#30343a; background:#fff; line-height:1.62; }
    .selected-outline-card { padding:18px; border:1px solid #b9d5cd; border-radius:11px; background:linear-gradient(135deg,#edf8f4,#fffdf7); }
    .selected-outline-card h3 { margin:0 0 5px; font-size:17px; }
    .selected-outline-card p { margin:0; color:var(--muted); }
    .outline-result { border-color:#8fbbb0; box-shadow:0 6px 18px rgba(30,106,88,.08); }
    .outline-result .outline-preview-head { color:#174f44; background:#eaf5f1; }
    .outline-stage-badge { padding:4px 8px; color:#fff; border-radius:999px; background:var(--green); font:700 10px/1 Arial,sans-serif; white-space:nowrap; }
    .outline-comparison { overflow:hidden; border:1px solid #ddd3c4; border-radius:10px; background:#fff; }
    .outline-comparison summary { position:relative; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 42px 14px 15px; cursor:pointer; list-style:none; background:#f8f3e9; }
    .outline-comparison summary::-webkit-details-marker { display:none; }
    .outline-comparison summary::after { content:"+"; position:absolute; right:16px; top:50%; color:var(--green); font:700 20px/1 Arial,sans-serif; transform:translateY(-50%); }
    .outline-comparison[open] summary::after { content:"−"; }
    .outline-comparison summary strong { font-size:13px; }
    .outline-comparison summary span { color:var(--muted); font-size:11px; text-align:right; }
    .outline-comparison pre { max-height:430px; overflow:auto; margin:0; padding:16px; border-top:1px solid #e5dccf; line-height:1.62; }
    .status { min-height:1.4em; margin-top:9px; color:var(--muted); } .status:empty { display:none; } .status.error { color:#a2352c; } pre { white-space:pre-wrap; font:12px Consolas,monospace; }.article-header,.article-content,.figure-card,.editor{border:1px solid var(--line);border-radius:7px;background:#fffdf8}.article-header{padding:16px;margin-bottom:18px}.article-header h3{margin:0 0 8px;font-size:20px;line-height:1.3}.article-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.article-content{padding:16px;line-height:1.72}.article-content p{margin:0 0 13px;text-align:justify}.article-content p:last-child{margin-bottom:0}.article-content h3{margin:0 0 10px;font-size:17px}.article-content ul{margin:0;padding-left:22px}.figure-card{padding:14px}.figure-card p{margin:5px 0}.editor{margin-top:12px;padding:0 12px 12px}.editor summary{padding:12px 0;cursor:pointer;font-weight:700}.editor textarea{margin-top:2px}.empty-note{color:var(--muted);font-style:italic}@media(max-width:1050px){.app{height:auto;grid-template-columns:1fr}.panel{min-height:340px}.nav{height:auto;flex-wrap:wrap}.nav-center{order:3;flex-basis:100%}}@media(max-width:780px){.outline-card-grid{grid-template-columns:1fr}.outline-upload{grid-template-columns:1fr}.upload-reference-btn{width:100%}}@media(max-width:520px){.main{padding:16px}.outline-hero{display:block}.outline-state{display:inline-block;margin-top:13px}.outline-section{padding:14px}.outline-upload-copy{align-items:flex-start}}
  </style>
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a class="active" href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a href="/sections">Sections</a><a href="/figure-review">Figure Review</a><a href="/figures">Figures</a><a href="/draft">Draft</a><a href="/final">Final</a></div></nav>
  <main class="app">
    <section class="panel"><div class="head"><h1>Literature Matrix</h1><div id="projectInfo" class="sub"></div></div><div class="toolbar"><input id="filter" type="search" placeholder="Filter papers"></div><div id="paperList" class="list"></div></section>
    <section class="panel"><div class="head"><h2 id="mainTitle">Paper Detail</h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-tab="paper">Paper</button><button class="tab" data-tab="outline">Outline</button></div><div id="main" class="main"></div><input id="referenceUpload" type="file" accept=".pdf,.docx,.md,.txt" hidden></section>
    <section class="panel"><div class="head"><h2>Review Gate</h2><div class="sub">Reading progress is optional; select an outline before Blueprint.</div></div><div id="summary" class="side"></div></section>
  </main>
  <script src="/assets/dashboard/review-i18n.js?v=20260803"></script>
  <script src="/assets/dashboard/review-ui.js?v=20260803"></script>
  <script>
    let projects=[],payload=null,selectedProject='',selectedPaper='',tab='paper';
    const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const papers=()=>Array.isArray(payload?.literature_matrix)?payload.literature_matrix:(payload?.literature_matrix?.rows||[]);
    const current=()=>papers().find(paper=>paper.paper_id===selectedPaper)||papers()[0]||null;
    const fullRead=paper=>paper?.matrix_status==='full_reading_complete';
    async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(project=>`<option value="${esc(project.project_id)}">${esc(project.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
    async function loadProject(projectId){selectedProject=projectId;window.reviewUi?.setProject(projectId);payload=await(await fetch(`/api/project/${encodeURIComponent(projectId)}/matrix`)).json();selectedPaper=papers().some(paper=>paper.paper_id===selectedPaper)?selectedPaper:(papers()[0]?.paper_id||'');render()}
    function plainArticleText(value){const greek={alpha:'alpha',beta:'beta',gamma:'gamma',delta:'delta',epsilon:'epsilon',theta:'theta',lambda:'lambda',mu:'mu',nu:'nu',pi:'pi',rho:'rho',sigma:'sigma',tau:'tau',phi:'phi',chi:'chi',psi:'psi',omega:'omega'};let text=String(value??'').replace(/<[^>]*>/g,'').replace(/\\prime/g,"'").replace(/\\%/g,'%');text=text.replace(/\\(?:mathrm|mathbf|mathit|mathsf|text|operatorname)\s*\{\s*([^{}]+)\s*\}/g,(_,inner)=>inner.replace(/\s+/g,''));text=text.replace(/\\([A-Za-z]+)/g,(_,name)=>greek[name]||name);text=text.replace(/\s*_\s*\{\s*([^{}]+)\s*\}/g,(_,inner)=>inner.replace(/\s+/g,''));text=text.replace(/\s*\^\s*\{\s*([^{}]+)\s*\}/g,(_,inner)=>inner.replace(/\s+/g,''));return text.replace(/[${}]/g,'').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim()}
    function displayText(value){return plainArticleText(value)}
    function renderList(){const query=$('filter').value.toLowerCase();const rows=papers().filter(paper=>[paper.paper_id,paper.title,paper.keywords,paper.abstract].join(' ').toLowerCase().includes(query));$('paperList').innerHTML=rows.map(paper=>`<button class="paper ${paper.paper_id===selectedPaper?'active':''}" data-paper="${esc(paper.paper_id)}"><div class="paper-title">${esc(paper.paper_id)} · ${esc(displayText(paper.title)||'(untitled)')}</div><div class="meta">${esc((paper.authors||[]).map(displayText).filter(Boolean).join(', '))}</div><span class="pill ${fullRead(paper)?'':'warn'}">${fullRead(paper)?'full reading complete':'needs full reading'}</span></button>`).join('')||'<div class="meta">No papers match the filter.</div>'}
    function renderArticleContent(value){const text=plainArticleText(value);if(!text)return '<p class="empty-note">No full-paper reading note has been added yet.</p>';return text.split(/\n{2,}/).filter(Boolean).map(block=>{const heading=block.match(/^#{1,6}\s+(.+)$/);if(heading)return '<h3>'+esc(heading[1])+'</h3>';const lines=block.split('\n').map(line=>line.trim()).filter(Boolean);if(lines.length&&lines.every(line=>/^(?:[-*+]\s+)/.test(line)))return '<ul>'+lines.map(line=>'<li>'+esc(line.replace(/^(?:[-*+]\s+)/,''))+'</li>').join('')+'</ul>';const escaped=esc(block).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');return '<p>'+escaped.replace(/\n/g,'<br>')+'</p>'}).join('')}
    function renderPaper(){const paper=current();if(!paper){$('main').innerHTML='<div class="meta">Confirm Discovery to populate the Matrix.</div>';return}$('mainTitle').textContent=`${paper.paper_id} Matrix Row`;$('mainMeta').textContent=displayText(paper.title);const figure=typeof paper.most_relevant_figure==='object'?paper.most_relevant_figure:{},authors=Array.isArray(paper.authors)?paper.authors.map(displayText).filter(Boolean).join(', '):displayText(paper.authors),keywords=Array.isArray(paper.keywords)?paper.keywords.map(displayText).filter(Boolean):[];$('main').innerHTML=`<section class="article-header"><h3>${esc(displayText(paper.title)||'(untitled)')}</h3><div class="article-meta"><span>${esc(authors||'Authors unavailable')}</span><span>${esc(displayText(paper.year)||'Year unavailable')}</span><span>${esc(displayText(paper.journal)||'Journal unavailable')}</span>${paper.doi?'<span>DOI: '+esc(displayText(paper.doi))+'</span>':''}</div>${keywords.length?'<div>'+keywords.map(keyword=>'<span class="pill">'+esc(keyword)+'</span>').join('')+'</div>':''}</section><section class="field"><div class="label">Abstract</div><div class="article-content">${renderArticleContent(paper.abstract)}</div></section><section class="field"><div class="label">Full-Paper Reading Note</div><div class="article-content">${renderArticleContent(paper.main_content)}</div><details class="editor"><summary>Edit reading note</summary><textarea id="readingNote" placeholder="Transformation, conditions, evidence, scope, limitations, and review relevance.">${esc(paper.main_content||'')}</textarea></details></section><section class="field"><div class="label">Most Relevant Figure</div><div class="figure-card"><p><strong>Source:</strong> ${esc(displayText(figure.source_label)||'Not specified')}</p><p><strong>Page:</strong> ${esc(displayText(figure.page_hint)||'Not specified')}</p><p><strong>Caption:</strong> ${esc(displayText(figure.caption)||'Not specified')}</p><p><strong>Relevance:</strong> ${esc(displayText(figure.relevance)||'Not specified')}</p></div></section><div class="field"><label><input id="readingComplete" type="checkbox" ${fullRead(paper)?'checked':''}> I completed the full-paper reading for this paper.</label></div><button id="saveReading" class="btn primary">Save Reading Note</button><div id="readingStatus" class="status"></div>`}
    function confirmedOutlineStyle(){const selection=payload?.outline_selection||{};return selection.selection_source==='user'?(selection.outline_style||''):''}
    function outlineChoices(){const currentStyle=confirmedOutlineStyle();const standard=[['substrate','S','Substrate structure','Organize papers by substrate class and structural variation.'],['catalyst','C','Catalyst / method structure','Compare catalytic systems, ligands, and methodological families.'],['reaction','R','Reaction-type structure','Follow transformation logic and mechanistic strategy.']];return standard.map(([style,icon,label,description])=>{const selected=style===currentStyle;return `<article class="outline-card ${selected?'current':''}"><div class="outline-card-top"><span class="outline-icon" aria-hidden="true">${icon}</span><span class="outline-selected-mark">Current selection</span></div><h4>${esc(label)}</h4><p>${esc(description)}</p><button type="button" class="outline-choice" data-outline="${esc(style)}" aria-pressed="${selected?'true':'false'}">${selected?'Current selection':'Use this outline'}</button></article>`}).join('')}
    function referenceOutlineChoices(){const currentStyle=confirmedOutlineStyle();const references=payload?.reference_outline_candidates||[];if(!references.length)return '<div class="outline-section-note">No reference outline has been uploaded yet.</div>';return `<div class="outline-section-head"><div><h3>Imported reference outlines</h3></div></div><div class="reference-list">${references.map(candidate=>{const style=`reference:${candidate.candidate_id}`,selected=style===currentStyle,name=candidate.source_name||candidate.candidate_id;return `<article class="reference-card ${selected?'current':''}"><div class="reference-file"><strong title="${esc(name)}">${esc(name)}</strong><span>Reference review</span></div><button type="button" class="reference-select" data-outline="${esc(style)}" aria-pressed="${selected?'true':'false'}">${selected?'Current selection':'Select'}</button></article>`}).join('')}</div>`}
    function selectedOutlinePreview(hasSelection){if(!hasSelection)return `<section class="selected-outline-card"><h3>Selection required</h3><p>Choose a built-in outline or upload a reference review. Stage 4 Blueprint remains unavailable until an outline is selected.</p></section>`;return `<section class="outline-preview outline-result"><div class="outline-preview-head"><strong>Current selected outline</strong><span class="outline-stage-badge">Used by Stage 4</span></div><pre>${esc(payload?.selected_outline_md||'No current outline selected.')}</pre></section>`}
    function renderOutline(){const selection=payload?.outline_selection||{},hasSelection=selection.selection_source==='user';$('mainTitle').textContent='Outline Options';$('mainMeta').textContent='Select an outline to convert the current Matrix into a Blueprint.';$('main').innerHTML=`<div class="outline-workspace"><section class="outline-hero"><div class="outline-hero-copy"><div class="outline-eyebrow">Step 1 · Choose a structure</div><h3>Choose your review structure</h3><p>Start from the literature metadata and the current Matrix, or upload a reference review to derive its organization.</p></div><span class="outline-state ${hasSelection?'':'pending'}">${hasSelection?'Current selection':'Selection required'}</span></section><section class="outline-section"><div class="outline-section-head"><div><h3>Built-in structures</h3><div class="outline-section-note">Choose the logic that best matches the scientific story.</div></div></div><div class="outline-card-grid">${outlineChoices()}</div></section><section class="outline-section"><div class="outline-section-head"><div><h3>Reference review</h3><div class="outline-section-note">Upload a published review to derive an outline that follows its organization.</div></div></div><div class="outline-upload"><div class="outline-upload-copy"><span class="outline-upload-icon" aria-hidden="true"></span><div><h4>Outline upload</h4><p>PDF, DOCX, Markdown, or TXT · the uploaded file is analyzed before it becomes selectable.</p></div></div><button type="button" id="uploadReference" class="upload-reference-btn">Upload Reference Review</button></div>${referenceOutlineChoices()}<div id="outlineStatus" class="status" role="status" aria-live="polite"></div></section>${selectedOutlinePreview(hasSelection)}<details class="outline-comparison" ${hasSelection?'':'open'}><summary><strong>Candidate outline comparison</strong><span>View all Matrix-generated alternatives</span></summary><pre>${esc(payload?.outline_options_md||'No outline options yet.')}</pre></details></div>`}
    function renderSummary(){const rows=papers(),completed=rows.filter(fullRead).length,sync=payload?.matrix_sync?.synced_at||'',selection=payload?.outline_selection||{},outlineReady=selection.selection_source==='user'&&selection.matrix_synced_at===sync;$('projectInfo').textContent=`${selectedProject} · ${payload?.topic||''}`;$('summary').innerHTML=`<div class="field"><div class="label">Full Reading</div><div class="value">${completed}/${rows.length} complete (optional)</div></div><div class="field"><div class="label">Outline</div><div class="value">${outlineReady?'selected for current Matrix':'select or reselect'}</div></div><div class="field"><div class="label">Next Gate</div><div class="value">${outlineReady?'Execute Matrix to create Blueprint.':'Select an outline for the current Matrix.'}</div></div>`}
    function render(){renderList();if(tab==='outline')renderOutline();else renderPaper();renderSummary();document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab))}
    async function saveReading(){const paper=current(),status=$('readingStatus');if(!paper||!status)return;status.textContent='Saving...';try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/matrix/${encodeURIComponent(paper.paper_id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({main_content:$('readingNote').value,most_relevant_figure:paper.most_relevant_figure,mark_complete:$('readingComplete').checked})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to save.');await loadProject(selectedProject)}catch(error){status.className='status error';status.textContent=error.message||String(error)}}
    async function chooseOutline(style){const status=$('outlineStatus');if(!status)return;status.textContent='Saving outline...';try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/matrix-outline`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({outline_style:style})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to save.');tab='outline';await loadProject(selectedProject)}catch(error){status.className='status error';status.textContent=error.message||String(error)}}
    async function uploadReference(file){if(!file)return;const status=$('outlineStatus');status.textContent='Analyzing reference format and writing style with AI...';try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',',2)[1]||'');reader.onerror=reject;reader.readAsDataURL(file)});const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/reference-outline`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,content_base64:data})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to analyze reference.');await loadProject(selectedProject);tab='outline';render()}catch(error){status.className='status error';status.textContent=error.message||String(error)}}
    $('projectSelect').addEventListener('change',event=>loadProject(event.target.value));$('filter').addEventListener('input',renderList);$('paperList').addEventListener('click',event=>{const button=event.target.closest('[data-paper]');if(button){selectedPaper=button.dataset.paper;tab='paper';render()}});$('main').addEventListener('click',event=>{if(event.target.closest('#saveReading'))saveReading();const choice=event.target.closest('[data-outline]');if(choice)chooseOutline(choice.dataset.outline);if(event.target.closest('#uploadReference'))$('referenceUpload').click()});$('referenceUpload').addEventListener('change',event=>{const file=event.target.files?.[0];event.target.value='';uploadReference(file)});document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{tab=button.dataset.tab;render()}));loadProjects();
  </script>
</body>
</html>
