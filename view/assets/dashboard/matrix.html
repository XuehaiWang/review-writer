    .status { min-height:1.4em; margin-top:9px; color:var(--muted); } .status:empty { display:none; } .status.error { color:#a2352c; } pre { white-space:pre-wrap; font:12px Consolas,monospace; }.article-header,.article-content,.figure-card,.editor{border:1px solid var(--line);border-radius:7px;background:#fffdf8}.article-header{padding:16px;margin-bottom:18px}.article-header h3{margin:0 0 8px;font-size:20px;line-height:1.3}.article-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.article-content{padding:16px;line-height:1.72}.article-content p{margin:0 0 13px;text-align:justify}.article-content p:last-child{margin-bottom:0}.article-content h3{margin:0 0 10px;font-size:17px}.article-content ul{margin:0;padding-left:22px}.figure-card{padding:14px}.figure-card p{margin:5px 0}.editor{margin-top:12px;padding:0 12px 12px}.editor summary{padding:12px 0;cursor:pointer;font-weight:700}.editor textarea{margin-top:2px}.empty-note{color:var(--muted);font-style:italic}@media(max-width:1050px){.app{height:auto;grid-template-columns:1fr}.panel{min-height:340px}.nav{height:auto;flex-wrap:wrap}.nav-center{order:3;flex-basis:100%}}@media(max-width:780px){.outline-card-grid{grid-template-columns:1fr}.outline-upload{grid-template-columns:1fr}.upload-reference-btn{width:100%}.outline-builder-toolbar{display:grid}.outline-builder-card-head{align-items:flex-start}.outline-builder-card-actions{justify-content:flex-end}}@media(max-width:520px){.main{padding:16px}.outline-hero{display:block}.outline-state{display:inline-block;margin-top:13px}.outline-section{padding:14px}.outline-upload-copy{align-items:flex-start}.outline-mode-switch{display:grid;grid-template-columns:1fr 1fr}.outline-builder-card-head{display:grid;grid-template-columns:auto 1fr}.outline-builder-card-actions{grid-column:1/-1}}

<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right"><a href="/library">Library</a><a href="/discovery">Discovery</a><a class="active" href="/matrix">Matrix</a><a href="/blueprint">Blueprint</a><a href="/sections">Sections</a><a href="/figure-review">Figure Review</a><a href="/figures">Figures</a><a href="/draft">Draft</a><a href="/final">Final</a></div></nav>
  <main class="app">
    <section class="panel"><div class="head"><h1>Literature Matrix</h1><div id="projectInfo" class="sub"></div></div><div class="toolbar"><input id="filter" type="search" placeholder="Filter papers"></div><div id="paperList" class="list"></div></section>
    <section class="panel"><div class="head"><h2 id="mainTitle">Paper Detail</h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-tab="paper">Paper</button><button class="tab" data-tab="outline">Outline</button></div><div id="main" class="main"></div><input id="referenceUpload" type="file" accept=".pdf,.docx,.md,.txt" hidden></section>
    <section class="panel"><div class="head"><h2>Review Gate</h2><div class="sub">Reading progress is optional; select an outline before Blueprint.</div></div><div id="summary" class="side"></div></section>
  </main>
  <script src="/assets/dashboard/review-i18n.js?v=20260805d"></script>
  <script src="/assets/dashboard/review-ui.js?v=20260805d"></script>
  <script>
    let projects=[],payload=null,selectedProject='',selectedPaper='',tab='paper',outlineEditMode='visual',outlineDraft={preamble:'',sections:[]},outlineMarkdownDraft='',outlineDirty=false,draggedOutlineSection=-1;
    const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const papers=()=>Array.isArray(payload?.literature_matrix)?payload.literature_matrix:(payload?.literature_matrix?.rows||[]);
    const current=()=>papers().find(paper=>paper.paper_id===selectedPaper)||papers()[0]||null;
    const fullRead=paper=>paper?.matrix_status==='full_reading_complete';
    async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(project=>`<option value="${esc(project.project_id)}">${esc(project.project_id)}</option>`).join('');const initial=window.reviewUi?.initialProject(projects)||projects[0];if(initial){$('projectSelect').value=initial.project_id;await loadProject(initial.project_id)}}
    async function loadProject(projectId){selectedProject=projectId;window.reviewUi?.setProject(projectId);payload=await(await fetch(`/api/project/${encodeURIComponent(projectId)}/matrix`,{cache:'no-store'})).json();selectedPaper=papers().some(paper=>paper.paper_id===selectedPaper)?selectedPaper:(papers()[0]?.paper_id||'');outlineMarkdownDraft=String(payload?.selected_outline_md||'');outlineDraft=parseOutlineDocument(outlineMarkdownDraft);outlineDirty=false;render()}
    function plainArticleText(value){const greek={alpha:'alpha',beta:'beta',gamma:'gamma',delta:'delta',epsilon:'epsilon',theta:'theta',lambda:'lambda',mu:'mu',nu:'nu',pi:'pi',rho:'rho',sigma:'sigma',tau:'tau',phi:'phi',chi:'chi',psi:'psi',omega:'omega'};let text=String(value??'').replace(/<[^>]*>/g,'').replace(/\\prime/g,"'").replace(/\\%/g,'%');text=text.replace(/\\(?:mathrm|mathbf|mathit|mathsf|text|operatorname)\s*\{\s*([^{}]+)\s*\}/g,(_,inner)=>inner.replace(/\s+/g,''));text=text.replace(/\\([A-Za-z]+)/g,(_,name)=>greek[name]||name);text=text.replace(/\s*_\s*\{\s*([^{}]+)\s*\}/g,(_,inner)=>inner.replace(/\s+/g,''));text=text.replace(/\s*\^\s*\{\s*([^{}]+)\s*\}/g,(_,inner)=>inner.replace(/\s+/g,''));return text.replace(/[${}]/g,'').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim()}
    function displayText(value){return plainArticleText(value)}
    function parseOutlineDocument(value){const lines=String(value||'').replace(/\r\n?/g,'\n').split('\n'),preamble=[],sections=[];let current=null;for(const raw of lines){const heading=raw.trim().match(/^##\s+(?:\d+[.)]\s*)?(.+?)\s*$/);if(heading){current={title:heading[1].trim(),purpose:'',assigned_papers:[],notes:[]};sections.push(current);continue}if(!current){preamble.push(raw);continue}const assigned=raw.trim().match(/^Assigned papers:\s*(.*)$/i);if(assigned){current.assigned_papers=[...new Set((assigned[1].match(/\b[A-Za-z]+\d+\b/g)||[]))];continue}const purpose=raw.trim().match(/^Purpose:\s*(.*)$/i);if(purpose&&!current.purpose){current.purpose=purpose[1].trim();continue}current.notes.push(raw)}return{preamble:preamble.join('\n').trim(),sections}}
    function serializeOutlineDocument(draft=outlineDraft){const preamble=String(draft?.preamble||'').trim()||'# Selected Outline\n\nPrimary structure: Custom.';const blocks=(draft?.sections||[]).map((section,index)=>{const lines=[`## ${index+1}. ${String(section.title||'').trim()||'Untitled section'}`];if((section.assigned_papers||[]).length)lines.push(`Assigned papers: ${section.assigned_papers.join(', ')}.`);if(String(section.purpose||'').trim())lines.push(`Purpose: ${String(section.purpose).trim()}`);const notes=(section.notes||[]).join('\n').trim();if(notes)lines.push(notes);return lines.join('\n')});return [preamble,...blocks].join('\n\n').trim()+'\n'}
    function syncOutlineMarkdown(){outlineMarkdownDraft=serializeOutlineDocument(outlineDraft);outlineDirty=true}
    function outlineValidation(draft=outlineDraft){const sections=draft?.sections||[],missingTitles=[],missingPapers=[];sections.forEach((section,index)=>{if(!String(section.title||'').trim())missingTitles.push(index+1);if(!(section.assigned_papers||[]).length)missingPapers.push(index+1)});return{sectionCount:sections.length,missingTitles,missingPapers,ready:sections.length>0&&!missingTitles.length&&!missingPapers.length}}
    function paperOptionLabel(paper){return `${paper.paper_id} · ${displayText(paper.title)||'(untitled)'}`}
    function paperSearchBlob(paper){return [paper.paper_id,paper.title,paper.keywords,paper.abstract,paper.main_content].flat().filter(Boolean).join(' ').toLowerCase()}
    function recommendedPaperIds(section){const rows=papers();if(!rows.length)return[];const common=new Set(['the','and','for','with','from','into','review','section','introduction','conclusion','outlook','scope','comparison']);const tokens=(String(section?.title||'')+' '+String(section?.purpose||'')).toLowerCase().match(/[a-z0-9]{3,}/g)||[],terms=[...new Set(tokens.filter(token=>!common.has(token)))];const scored=rows.map((paper,index)=>({paper,index,score:terms.reduce((score,term)=>score+(paperSearchBlob(paper).includes(term)?1:0),0)})).sort((a,b)=>b.score-a.score||a.index-b.index);const useful=scored.filter(item=>item.score>0);return(useful.length?useful:scored).slice(0,6).map(item=>item.paper.paper_id)}
    function emptyOutlineSection(title=''){return{title,purpose:'',assigned_papers:[],notes:[]}}
    function renderPaperPicker(section,index){const selected=new Set(section.assigned_papers||[]);return `<details class="outline-paper-picker"><summary>Select papers <span>${selected.size} selected</span></summary><div class="outline-paper-picker-body"><input type="search" data-paper-filter="${index}" placeholder="Filter selected Matrix papers"><div class="outline-paper-options">${papers().map(paper=>`<label data-paper-option="${index}" data-paper-search="${esc(paperOptionLabel(paper).toLowerCase())}"><input type="checkbox" data-section-paper="${index}" value="${esc(paper.paper_id)}" ${selected.has(paper.paper_id)?'checked':''}><span>${esc(paperOptionLabel(paper))}</span></label>`).join('')}</div></div></details>`}
    function renderOutlineBuilder(){const validation=outlineValidation(),sections=outlineDraft.sections||[];return `<div class="outline-builder"><div class="outline-builder-toolbar"><div><strong>Visual outline builder</strong><div class="outline-section-note">Add sections, assign papers, and drag cards to reorder them.</div></div><div class="outline-builder-toolbar-actions"><button type="button" class="btn" data-outline-action="starter">Add Introduction & Conclusion</button><button type="button" class="btn primary" data-outline-action="add">Add section</button></div></div><div id="outlineBuilderValidation" class="outline-builder-validation ${validation.ready?'ready':'warn'}">${validation.sectionCount?`${validation.sectionCount} sections · ${validation.missingTitles.length} missing titles · ${validation.missingPapers.length} missing papers`:'No sections yet. Add a section to begin.'}</div>${sections.length?`<div class="outline-builder-list">${sections.map((section,index)=>`<article class="outline-builder-card" draggable="true" data-section-index="${index}"><div class="outline-builder-card-head"><span class="outline-drag" title="Drag to reorder" aria-hidden="true">⋮⋮</span><strong>Section ${index+1}</strong><div class="outline-builder-card-actions"><button type="button" class="btn" data-outline-action="recommend" data-index="${index}">Recommend papers</button><button type="button" class="btn" data-outline-action="up" data-index="${index}" ${index===0?'disabled':''} aria-label="Move section up">↑</button><button type="button" class="btn" data-outline-action="down" data-index="${index}" ${index===sections.length-1?'disabled':''} aria-label="Move section down">↓</button><button type="button" class="btn red" data-outline-action="delete" data-index="${index}">Delete</button></div></div><label class="outline-builder-field"><span>Section title</span><input data-outline-field="title" data-index="${index}" value="${esc(section.title||'')}" placeholder="e.g. Introduction and scope"></label><label class="outline-builder-field"><span>Section purpose</span><textarea data-outline-field="purpose" data-index="${index}" placeholder="What question should this section answer?">${esc(section.purpose||'')}</textarea></label>${renderPaperPicker(section,index)}<label class="outline-builder-field"><span>Additional instructions / figure plan</span><textarea data-outline-field="notes" data-index="${index}" placeholder="Optional comparison rules, mechanism focus, figures, tables, or transitions.">${esc((section.notes||[]).join('\n').trim())}</textarea></label></article>`).join('')}</div>`:`<div class="outline-builder-empty"><strong>Start with a blank visual outline</strong><p>Add your first section, or create Introduction and Conclusion cards as a starting point.</p><button type="button" class="btn primary" data-outline-action="add">Add first section</button></div>`}</div>`}
    function renderOutlineEditor(){const draftForValidation=outlineEditMode==='markdown'?parseOutlineDocument(outlineMarkdownDraft):outlineDraft,validation=outlineValidation(draftForValidation);return `<div class="outline-mode-switch" role="group" aria-label="Outline editing mode"><button type="button" class="tab ${outlineEditMode==='visual'?'active':''}" data-outline-mode="visual">Visual editor</button><button type="button" class="tab ${outlineEditMode==='markdown'?'active':''}" data-outline-mode="markdown">Advanced Markdown</button></div>${outlineEditMode==='visual'?renderOutlineBuilder():`<textarea id="selectedOutlineEditor" class="outline-editor-textarea" spellcheck="false" aria-label="Editable selected outline" placeholder="Write your custom outline here...">${esc(outlineMarkdownDraft)}</textarea><p class="outline-editor-help">Use level-2 headings for major sections and add an <code>Assigned papers:</code> line to every section.</p>`}<div class="outline-editor-actions"><button type="button" id="saveOutlineEdits" class="btn primary" ${validation.ready?'':'disabled'}>Save outline changes</button><div id="outlineEditStatus" class="status ${validation.ready?'':'error'}" role="status" aria-live="polite">${validation.ready?(outlineDirty?'Unsaved outline changes.':'Ready to save.'):`Complete every section title and paper assignment before saving.`}</div></div>`}
    function refreshOutlineValidation(){const source=outlineEditMode==='markdown'?parseOutlineDocument(outlineMarkdownDraft):outlineDraft,validation=outlineValidation(source),node=$('outlineBuilderValidation'),save=$('saveOutlineEdits'),status=$('outlineEditStatus');if(node){node.className=`outline-builder-validation ${validation.ready?'ready':'warn'}`;node.textContent=validation.sectionCount?`${validation.sectionCount} sections · ${validation.missingTitles.length} missing titles · ${validation.missingPapers.length} missing papers`:'No sections yet. Add a section to begin.'}if(save)save.disabled=!validation.ready;if(status){status.className=`status ${validation.ready?'':'error'}`;status.textContent=validation.ready?'Unsaved outline changes.':'Complete every section title and paper assignment before saving.'}}
    function renderList(){const query=$('filter').value.toLowerCase();const rows=papers().filter(paper=>[paper.paper_id,paper.title,paper.keywords,paper.abstract].join(' ').toLowerCase().includes(query));$('paperList').innerHTML=rows.map(paper=>`<button class="paper ${paper.paper_id===selectedPaper?'active':''}" data-paper="${esc(paper.paper_id)}"><div class="paper-title">${esc(paper.paper_id)} · ${esc(displayText(paper.title)||'(untitled)')}</div><div class="meta">${esc((paper.authors||[]).map(displayText).filter(Boolean).join(', '))}</div><span class="pill ${fullRead(paper)?'':'warn'}">${fullRead(paper)?'full reading complete':'needs full reading'}</span></button>`).join('')||'<div class="meta">No papers match the filter.</div>'}
    function renderArticleContent(value){const text=plainArticleText(value);if(!text)return '<p class="empty-note">No full-paper reading note has been added yet.</p>';return text.split(/\n{2,}/).filter(Boolean).map(block=>{const heading=block.match(/^#{1,6}\s+(.+)$/);if(heading)return '<h3>'+esc(heading[1])+'</h3>';const lines=block.split('\n').map(line=>line.trim()).filter(Boolean);if(lines.length&&lines.every(line=>/^(?:[-*+]\s+)/.test(line)))return '<ul>'+lines.map(line=>'<li>'+esc(line.replace(/^(?:[-*+]\s+)/,''))+'</li>').join('')+'</ul>';const escaped=esc(block).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');return '<p>'+escaped.replace(/\n/g,'<br>')+'</p>'}).join('')}
    function renderPaper(){const paper=current();if(!paper){$('main').innerHTML='<div class="meta">Confirm Discovery to populate the Matrix.</div>';return}$('mainTitle').textContent=`${paper.paper_id} Matrix Row`;$('mainMeta').textContent=displayText(paper.title);const figure=typeof paper.most_relevant_figure==='object'?paper.most_relevant_figure:{},authors=Array.isArray(paper.authors)?paper.authors.map(displayText).filter(Boolean).join(', '):displayText(paper.authors),keywords=Array.isArray(paper.keywords)?paper.keywords.map(displayText).filter(Boolean):[];$('main').innerHTML=`<section class="article-header"><h3>${esc(displayText(paper.title)||'(untitled)')}</h3><div class="article-meta"><span>${esc(authors||'Authors unavailable')}</span><span>${esc(displayText(paper.year)||'Year unavailable')}</span><span>${esc(displayText(paper.journal)||'Journal unavailable')}</span>${paper.doi?'<span>DOI: '+esc(displayText(paper.doi))+'</span>':''}</div>${keywords.length?'<div>'+keywords.map(keyword=>'<span class="pill">'+esc(keyword)+'</span>').join('')+'</div>':''}</section><section class="field"><div class="label">Abstract</div><div class="article-content">${renderArticleContent(paper.abstract)}</div></section><section class="field"><div class="label">Full-Paper Reading Note</div><div class="article-content">${renderArticleContent(paper.main_content)}</div><details class="editor"><summary>Edit reading note</summary><textarea id="readingNote" placeholder="Transformation, conditions, evidence, scope, limitations, and review relevance.">${esc(paper.main_content||'')}</textarea></details></section><section class="field"><div class="label">Most Relevant Figure</div><div class="figure-card"><p><strong>Source:</strong> ${esc(displayText(figure.source_label)||'Not specified')}</p><p><strong>Page:</strong> ${esc(displayText(figure.page_hint)||'Not specified')}</p><p><strong>Caption:</strong> ${esc(displayText(figure.caption)||'Not specified')}</p><p><strong>Relevance:</strong> ${esc(displayText(figure.relevance)||'Not specified')}</p></div></section><div class="field"><label><input id="readingComplete" type="checkbox" ${fullRead(paper)?'checked':''}> I completed the full-paper reading for this paper.</label></div><button id="saveReading" class="btn primary">Save Reading Note</button><div id="readingStatus" class="status"></div>`}
    function confirmedOutlineStyle(){const selection=payload?.outline_selection||{};return ['user','custom_draft'].includes(selection.selection_source)?(selection.outline_style||''):''}
    function outlineChoices(){const currentStyle=confirmedOutlineStyle(),customHasContent=currentStyle==='custom'&&String(payload?.selected_outline_md||'').trim();const standard=[['substrate','S','Substrate structure','Organize papers by substrate class and structural variation.'],['catalyst','C','Catalyst / method structure','Compare catalytic systems, ligands, and methodological families.'],['reaction','R','Reaction-type structure','Follow transformation logic and mechanistic strategy.'],['custom','E','Custom outline','Open a completely blank outline and organize every section yourself.']];return standard.map(([style,icon,label,description])=>{const selected=style===currentStyle,buttonLabel=selected?(style==='custom'&&customHasContent?'Reset to blank':'Current selection'):'Use this outline';return `<article class="outline-card ${selected?'current':''}"><div class="outline-card-top"><span class="outline-icon" aria-hidden="true">${icon}</span><span class="outline-selected-mark">Current selection</span></div><h4>${esc(label)}</h4><p>${esc(description)}</p><button type="button" class="outline-choice" data-outline="${esc(style)}" aria-pressed="${selected?'true':'false'}">${buttonLabel}</button></article>`}).join('')}
    function referenceOutlineChoices(){const currentStyle=confirmedOutlineStyle();const references=payload?.reference_outline_candidates||[];if(!references.length)return '<div class="outline-section-note">No reference outline has been uploaded yet.</div>';return `<div class="outline-section-head"><div><h3>Imported reference outlines</h3></div></div><div class="reference-list">${references.map(candidate=>{const style=`reference:${candidate.candidate_id}`,selected=style===currentStyle,name=candidate.source_name||candidate.candidate_id;return `<article class="reference-card ${selected?'current':''}"><div class="reference-file"><strong title="${esc(name)}">${esc(name)}</strong><span>Reference review</span></div><button type="button" class="reference-select" data-outline="${esc(style)}" aria-pressed="${selected?'true':'false'}">${selected?'Current selection':'Select'}</button></article>`}).join('')}</div>`}
    function selectedOutlinePreview(hasSelection){if(!hasSelection)return `<section class="selected-outline-card"><h3>Selection required</h3><p>Choose a built-in outline, create a custom outline, or upload a reference review. Stage 4 Blueprint remains unavailable until an outline is selected.</p></section>`;const selection=payload?.outline_selection||{},customDraft=selection.selection_source==='custom_draft',edited=Boolean(selection.manually_edited);return `<section class="outline-preview outline-result"><div class="outline-preview-head"><strong>Current selected outline</strong><span class="outline-stage-badge">${customDraft?'Blank custom draft':edited?'Manually edited':'Used by Stage 4'}</span></div><div class="outline-editor-body">${renderOutlineEditor()}</div></section>`}
    function renderOutlineComparison(hasSelection){const selection=payload?.outline_selection||{},saved=String(payload?.selected_outline_md||'').trim(),showSaved=hasSelection&&selection.selection_source==='user'&&Boolean(saved),savedBadge=selection.manually_edited?'Manually edited':'Current selection';return `<details class="outline-comparison" ${hasSelection?'':'open'}><summary><strong>Candidate outline comparison</strong><span>Compare the current saved version with Matrix-generated alternatives</span></summary><div class="outline-comparison-body">${showSaved?`<section class="outline-comparison-group current"><div class="outline-comparison-label"><strong>Current saved version</strong><span>${savedBadge}</span></div><pre>${esc(saved)}</pre></section>`:''}<section class="outline-comparison-group"><div class="outline-comparison-label"><strong>System-generated candidates</strong></div><pre>${esc(payload?.outline_options_md||'No outline options yet.')}</pre></section></div></details>`}
    function renderOutline(){const selection=payload?.outline_selection||{},hasSelection=['user','custom_draft'].includes(selection.selection_source);$('mainTitle').textContent='Outline Options';$('mainMeta').textContent='Select an outline to convert the current Matrix into a Blueprint.';$('main').innerHTML=`<div class="outline-workspace"><section class="outline-hero"><div class="outline-hero-copy"><div class="outline-eyebrow">Step 1 · Choose a structure</div><h3>Choose your review structure</h3><p>Start from the literature metadata and the current Matrix, or upload a reference review to derive its organization.</p></div><span class="outline-state ${hasSelection?'':'pending'}">${hasSelection?'Current selection':'Selection required'}</span></section><section class="outline-section"><div class="outline-section-head"><div><h3>Built-in structures</h3><div class="outline-section-note">Choose the logic that best matches the scientific story.</div></div></div><div class="outline-card-grid">${outlineChoices()}</div></section><section class="outline-section"><div class="outline-section-head"><div><h3>Reference review</h3><div class="outline-section-note">Upload a published review to derive an outline that follows its organization.</div></div></div><div class="outline-upload"><div class="outline-upload-copy"><span class="outline-upload-icon" aria-hidden="true"></span><div><h4>Outline upload</h4><p>PDF, DOCX, Markdown, or TXT · the uploaded file is analyzed before it becomes selectable.</p></div></div><button type="button" id="uploadReference" class="upload-reference-btn">Upload Reference Review</button></div>${referenceOutlineChoices()}<div id="outlineStatus" class="status" role="status" aria-live="polite"></div></section>${selectedOutlinePreview(hasSelection)}${renderOutlineComparison(hasSelection)}</div>`}
    function renderSummary(){const rows=papers(),completed=rows.filter(fullRead).length,sync=payload?.matrix_sync?.synced_at||'',selection=payload?.outline_selection||{},paperSelection=payload?.discovery_selection||{},selectionCurrent=Boolean(paperSelection.selection_current),customDraft=selection.selection_source==='custom_draft',outlineReady=selectionCurrent&&selection.selection_source==='user'&&selection.matrix_synced_at===sync;$('projectInfo').textContent=`${selectedProject} · ${payload?.topic||''}`;$('summary').innerHTML=`<div class="field"><div class="label">Paper Selection</div><div class="value">${paperSelection.selected_paper_count||0} selected · ${selectionCurrent?'synchronized':'reconfirm in Discovery'}</div></div><div class="field"><div class="label">Full Reading</div><div class="value">${completed}/${rows.length} complete (optional)</div></div><div class="field"><div class="label">Outline</div><div class="value">${outlineReady?'selected for current Matrix':customDraft?'blank custom draft':'select or reselect'}</div></div><div class="field"><div class="label">Next Gate</div><div class="value">${outlineReady?'Execute Matrix to create Blueprint.':customDraft?'Write and save the custom outline before Blueprint.':selectionCurrent?'Select an outline for the current Matrix.':'Return to Discovery and confirm the current paper selection.'}</div></div>`}
    function render(){renderList();if(tab==='outline')renderOutline();else renderPaper();renderSummary();document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab))}
    async function saveReading(){const paper=current(),status=$('readingStatus');if(!paper||!status)return;status.textContent='Saving...';try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/matrix/${encodeURIComponent(paper.paper_id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({main_content:$('readingNote').value,most_relevant_figure:paper.most_relevant_figure,mark_complete:$('readingComplete').checked})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to save.');await loadProject(selectedProject)}catch(error){status.className='status error';status.textContent=error.message||String(error)}}
    async function chooseOutline(style){const status=$('outlineStatus');if(!status)return;const resettingCustom=style==='custom'&&confirmedOutlineStyle()==='custom'&&String(payload?.selected_outline_md||'').trim();if(resettingCustom&&!window.confirm(window.reviewI18n?.t('Reset the current custom outline to a completely blank editor?')||'Reset the current custom outline to a completely blank editor?'))return;status.textContent='Saving outline...';const request={outline_style:style};try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/matrix-outline`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to save.');tab='outline';await loadProject(selectedProject);const nextStatus=$('outlineStatus');if(nextStatus)nextStatus.textContent=style==='custom'?'Blank custom outline is ready. Write it below and save your changes.':'Outline selected.'}catch(error){status.className='status error';status.textContent=error.message||String(error)}}
    async function saveOutlineEdits(){const status=$('outlineEditStatus'),style=confirmedOutlineStyle()||'custom';if(!status)return;if(outlineEditMode==='markdown'){const editor=$('selectedOutlineEditor');if(editor)outlineMarkdownDraft=editor.value;outlineDraft=parseOutlineDocument(outlineMarkdownDraft)}else outlineMarkdownDraft=serializeOutlineDocument(outlineDraft);const validation=outlineValidation(outlineDraft);if(!validation.ready){status.className='status error';status.textContent='Complete every section title and paper assignment before saving.';return}status.className='status';status.textContent='Saving outline changes...';try{const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/matrix-outline`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({outline_style:style,outline_md:outlineMarkdownDraft})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to save outline changes.');tab='outline';await loadProject(selectedProject);const nextStatus=$('outlineEditStatus');if(nextStatus){nextStatus.className='status';nextStatus.textContent='Saved. Stage 4 will use this edited outline.'}}catch(error){status.className='status error';status.textContent=error.message||String(error)}}
    async function uploadReference(file){if(!file)return;const status=$('outlineStatus');status.textContent='Analyzing reference format and writing style with AI...';try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',',2)[1]||'');reader.onerror=reject;reader.readAsDataURL(file)});const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/reference-outline`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,content_base64:data})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Unable to analyze reference.');await loadProject(selectedProject);tab='outline';render()}catch(error){status.className='status error';status.textContent=error.message||String(error)}}
    $('projectSelect').addEventListener('change',event=>loadProject(event.target.value));
    $('filter').addEventListener('input',renderList);
    $('paperList').addEventListener('click',event=>{const button=event.target.closest('[data-paper]');if(button){selectedPaper=button.dataset.paper;tab='paper';render()}});
    $('main').addEventListener('click',event=>{
      if(event.target.closest('#saveReading'))saveReading();
      if(event.target.closest('#saveOutlineEdits'))saveOutlineEdits();
      const modeButton=event.target.closest('[data-outline-mode]');
      if(modeButton){if(modeButton.dataset.outlineMode==='visual'){const editor=$('selectedOutlineEditor');if(editor)outlineMarkdownDraft=editor.value;outlineDraft=parseOutlineDocument(outlineMarkdownDraft)}else{outlineMarkdownDraft=serializeOutlineDocument(outlineDraft)}outlineEditMode=modeButton.dataset.outlineMode;renderOutline();return}
      const actionButton=event.target.closest('[data-outline-action]');
      if(actionButton){const action=actionButton.dataset.outlineAction,index=Number(actionButton.dataset.index);if(action==='add')outlineDraft.sections.push(emptyOutlineSection(''));if(action==='starter'){const existing=outlineDraft.sections.map(section=>String(section.title||'').toLowerCase());if(!existing.some(title=>title.includes('introduction')))outlineDraft.sections.unshift(emptyOutlineSection('Introduction and scope'));if(!existing.some(title=>title.includes('conclusion')||title.includes('outlook')))outlineDraft.sections.push(emptyOutlineSection('Conclusions and outlook'));outlineDraft.sections.forEach(section=>{if(!(section.assigned_papers||[]).length)section.assigned_papers=recommendedPaperIds(section)})}if(action==='delete'&&Number.isInteger(index))outlineDraft.sections.splice(index,1);if(action==='recommend'&&outlineDraft.sections[index])outlineDraft.sections[index].assigned_papers=recommendedPaperIds(outlineDraft.sections[index]);if(action==='up'&&index>0)[outlineDraft.sections[index-1],outlineDraft.sections[index]]=[outlineDraft.sections[index],outlineDraft.sections[index-1]];if(action==='down'&&index<outlineDraft.sections.length-1)[outlineDraft.sections[index+1],outlineDraft.sections[index]]=[outlineDraft.sections[index],outlineDraft.sections[index+1]];syncOutlineMarkdown();renderOutline();return}
      const choice=event.target.closest('[data-outline]');if(choice)chooseOutline(choice.dataset.outline);
      if(event.target.closest('#uploadReference'))$('referenceUpload').click();
    });
    $('main').addEventListener('input',event=>{
      if(event.target.matches('#selectedOutlineEditor')){outlineMarkdownDraft=event.target.value;outlineDirty=true;refreshOutlineValidation();return}
      if(event.target.matches('[data-paper-filter]')){const index=event.target.dataset.paperFilter,query=event.target.value.toLowerCase();event.target.closest('.outline-paper-picker-body')?.querySelectorAll(`[data-paper-option="${index}"]`).forEach(option=>{option.hidden=!String(option.dataset.paperSearch||'').includes(query)});return}
      const field=event.target.closest('[data-outline-field]');if(field){const section=outlineDraft.sections[Number(field.dataset.index)];if(section){section[field.dataset.outlineField]=field.dataset.outlineField==='notes'?field.value.split('\n'):field.value;syncOutlineMarkdown();refreshOutlineValidation()}}
    });
    $('main').addEventListener('change',event=>{const checkbox=event.target.closest('[data-section-paper]');if(!checkbox)return;const section=outlineDraft.sections[Number(checkbox.dataset.sectionPaper)];if(!section)return;const selected=new Set(section.assigned_papers||[]);if(checkbox.checked)selected.add(checkbox.value);else selected.delete(checkbox.value);section.assigned_papers=[...selected];syncOutlineMarkdown();const summary=checkbox.closest('details')?.querySelector('summary span');if(summary)summary.textContent=`${section.assigned_papers.length} selected`;refreshOutlineValidation()});
    $('main').addEventListener('dragstart',event=>{const card=event.target.closest('[data-section-index]');if(card){draggedOutlineSection=Number(card.dataset.sectionIndex);card.classList.add('dragging')}});
    $('main').addEventListener('dragover',event=>{if(event.target.closest('[data-section-index]'))event.preventDefault()});
    $('main').addEventListener('drop',event=>{const card=event.target.closest('[data-section-index]');if(!card||draggedOutlineSection<0)return;event.preventDefault();const target=Number(card.dataset.sectionIndex);if(target!==draggedOutlineSection){const [moved]=outlineDraft.sections.splice(draggedOutlineSection,1);outlineDraft.sections.splice(target,0,moved);syncOutlineMarkdown();renderOutline()}draggedOutlineSection=-1});
    $('main').addEventListener('dragend',()=>{draggedOutlineSection=-1;document.querySelectorAll('.outline-builder-card.dragging').forEach(card=>card.classList.remove('dragging'))});
    $('referenceUpload').addEventListener('change',event=>{const file=event.target.files?.[0];event.target.value='';uploadReference(file)});
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{tab=button.dataset.tab;render()}));
    loadProjects();
  </script>
