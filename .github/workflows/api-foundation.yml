name: API foundation

on:
  push:
    branches: [dy, dy-launch]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q review_writer_api review_writer_core view
      - name: Run database migration
        env:
          REVIEW_WRITER_DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: alembic upgrade head
      - name: Run maintained dashboard checks
        working-directory: view
        run: python -m unittest discover -s . -p "*_checks.py"
      - name: Run dashboard integration tests
        run: python -m unittest discover -s view/tests -p "test_*.py"
      - name: Run native API tests
        run: python -m unittest discover -s review_writer_api/tests -p "test_*.py"
