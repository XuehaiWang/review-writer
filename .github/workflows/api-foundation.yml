name: API foundation

on:
  push:
    branches: [dy]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q review_writer_api review_writer_core view
      - name: Run migration and API compatibility tests
        env:
          REVIEW_WRITER_DATABASE_URL: sqlite+pysqlite:///:memory:
        run: |
          alembic upgrade head
          python -m unittest view.tests.test_fastapi_foundation view.tests.test_project_deletion
