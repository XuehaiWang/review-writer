name: review-writer

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${REVIEW_WRITER_POSTGRES_DB:-review_writer}
      POSTGRES_USER: ${REVIEW_WRITER_POSTGRES_USER:-review_writer}
      POSTGRES_PASSWORD: "${REVIEW_WRITER_POSTGRES_PASSWORD:?Set REVIEW_WRITER_POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${REVIEW_WRITER_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${REVIEW_WRITER_POSTGRES_BIND_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: review-writer-api:${REVIEW_WRITER_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "review_writer_api.migration_bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVIEW_WRITER_POSTGRES_HOST: postgres
      REVIEW_WRITER_POSTGRES_PORT: 5432
      REVIEW_WRITER_POSTGRES_USER: ${REVIEW_WRITER_POSTGRES_USER:-review_writer}
      REVIEW_WRITER_POSTGRES_PASSWORD: "${REVIEW_WRITER_POSTGRES_PASSWORD:?Set REVIEW_WRITER_POSTGRES_PASSWORD in .env}"
      REVIEW_WRITER_POSTGRES_DB: ${REVIEW_WRITER_POSTGRES_DB:-review_writer}
      REVIEW_WRITER_HOSTED_WORKSPACE_ROOT: /app/.review-writer/hosted-workspaces
      REVIEW_WRITER_MIGRATION_BACKUP_ROOT: /app/migration-backups
      REVIEW_WRITER_MIGRATION_REPORT_ROOT: /app/migration-reports
      REVIEW_WRITER_MIGRATION_OWNER_EMAIL: ${REVIEW_WRITER_MIGRATION_OWNER_EMAIL:-}
      REVIEW_WRITER_MIGRATION_ACCEPT_MISSING_FILES: ${REVIEW_WRITER_MIGRATION_ACCEPT_MISSING_FILES:-false}
      REVIEW_WRITER_MIGRATION_ACCEPT_FILE_DRIFT: ${REVIEW_WRITER_MIGRATION_ACCEPT_FILE_DRIFT:-false}
    volumes:
      - review_state:/app/.review-writer
      - "${REVIEW_WRITER_MIGRATION_REPORTS_DIR:-./migration-reports}:/app/migration-reports"
      - "${REVIEW_WRITER_MIGRATION_BACKUPS_DIR:-./migration-backups}:/app/migration-backups"
    restart: "no"

  api:
    image: review-writer-api:${REVIEW_WRITER_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      REVIEW_WRITER_DEPLOYMENT_MODE: hosted
      REVIEW_WRITER_POSTGRES_HOST: postgres
      REVIEW_WRITER_POSTGRES_PORT: 5432
      REVIEW_WRITER_POSTGRES_USER: ${REVIEW_WRITER_POSTGRES_USER:-review_writer}
      REVIEW_WRITER_POSTGRES_PASSWORD: "${REVIEW_WRITER_POSTGRES_PASSWORD:?Set REVIEW_WRITER_POSTGRES_PASSWORD in .env}"
      REVIEW_WRITER_POSTGRES_DB: ${REVIEW_WRITER_POSTGRES_DB:-review_writer}
      REVIEW_WRITER_PUBLIC_ORIGIN: ${REVIEW_WRITER_PUBLIC_ORIGIN:-http://127.0.0.1:8770}
      REVIEW_WRITER_SESSION_COOKIE_SECURE: ${REVIEW_WRITER_SESSION_COOKIE_SECURE:-false}
      REVIEW_WRITER_SESSION_DAYS: ${REVIEW_WRITER_SESSION_DAYS:-7}
      REVIEW_WRITER_SESSION_COOKIE_NAME: ${REVIEW_WRITER_SESSION_COOKIE_NAME:-review_writer_session}
      REVIEW_WRITER_ADMIN_EMAILS: ${REVIEW_WRITER_ADMIN_EMAILS:-}
      REVIEW_WRITER_CREDENTIAL_ENCRYPTION_KEY: "${REVIEW_WRITER_CREDENTIAL_ENCRYPTION_KEY:?Set REVIEW_WRITER_CREDENTIAL_ENCRYPTION_KEY in .env}"
      REVIEW_WRITER_EXPOSE_API_DOCS: ${REVIEW_WRITER_EXPOSE_API_DOCS:-false}
      REVIEW_WRITER_JOB_WORKERS: ${REVIEW_WRITER_JOB_WORKERS:-2}
      REVIEW_WRITER_OPENAI_API_KEY: "${REVIEW_WRITER_OPENAI_API_KEY:-}"
      REVIEW_WRITER_OPENAI_BASE_URL: ${REVIEW_WRITER_OPENAI_BASE_URL:-https://api.openai.com/v1}
      REVIEW_WRITER_OPENAI_WIRE_API: ${REVIEW_WRITER_OPENAI_WIRE_API:-responses}
      REVIEW_WRITER_IMAGE_API_KEY: "${REVIEW_WRITER_IMAGE_API_KEY:-}"
      REVIEW_WRITER_IMAGE_BASE_URL: ${REVIEW_WRITER_IMAGE_BASE_URL:-https://api.openai.com/v1}
      REVIEW_WRITER_IMAGE_MODEL: ${REVIEW_WRITER_IMAGE_MODEL:-}
      REVIEW_WRITER_IMAGE_WIRE_API: ${REVIEW_WRITER_IMAGE_WIRE_API:-images}
      REVIEW_WRITER_IMAGE_USD_PER_IMAGE: ${REVIEW_WRITER_IMAGE_USD_PER_IMAGE:-0}
      REVIEW_WRITER_IMAGE_GATEWAY_CONCURRENCY: ${REVIEW_WRITER_IMAGE_GATEWAY_CONCURRENCY:-1}
      REVIEW_WRITER_IMAGE_GATEWAY_USER_CONCURRENCY: ${REVIEW_WRITER_IMAGE_GATEWAY_USER_CONCURRENCY:-1}
      REVIEW_WRITER_MINERU_API_TOKEN: "${REVIEW_WRITER_MINERU_API_TOKEN:-}"
      REVIEW_WRITER_MINERU_USD_PER_PAGE: ${REVIEW_WRITER_MINERU_USD_PER_PAGE:-0}
      REVIEW_WRITER_MINERU_CONCURRENCY: ${REVIEW_WRITER_MINERU_CONCURRENCY:-2}
      REVIEW_WRITER_INTERNAL_GATEWAY_URL: ${REVIEW_WRITER_INTERNAL_GATEWAY_URL:-http://127.0.0.1:8770/api/internal/v1/model-responses}
      REVIEW_WRITER_MODEL_GATEWAY_CONCURRENCY: ${REVIEW_WRITER_MODEL_GATEWAY_CONCURRENCY:-2}
      REVIEW_WRITER_MODEL_GATEWAY_USER_CONCURRENCY: ${REVIEW_WRITER_MODEL_GATEWAY_USER_CONCURRENCY:-1}
      # One-release compatibility for existing server .env files. These are
      # still server-only and are never sourced from a user's database row.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      REVIEW_WRITING_API_KEY: "${REVIEW_WRITING_API_KEY:-}"
      REVIEW_WRITING_BASE_URL: ${REVIEW_WRITING_BASE_URL:-}
      REVIEW_WRITING_WIRE_API: ${REVIEW_WRITING_WIRE_API:-}
      IMAGE_OPENAI_API_KEY: "${IMAGE_OPENAI_API_KEY:-}"
      IMAGE_OPENAI_BASE_URL: ${IMAGE_OPENAI_BASE_URL:-}
      IMAGE_OPENAI_MODEL: ${IMAGE_OPENAI_MODEL:-}
      IMAGE_OPENAI_WIRE_API: ${IMAGE_OPENAI_WIRE_API:-}
      MINERU_API_TOKEN: "${MINERU_API_TOKEN:-}"
      REVIEW_WRITER_AUTH_RATE_LIMIT_ATTEMPTS: ${REVIEW_WRITER_AUTH_RATE_LIMIT_ATTEMPTS:-12}
      REVIEW_WRITER_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${REVIEW_WRITER_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      REVIEW_WRITER_ALLOW_PRIVATE_PROVIDER_URLS: ${REVIEW_WRITER_ALLOW_PRIVATE_PROVIDER_URLS:-false}
      REVIEW_WRITER_ALLOWED_PROVIDER_HOSTS: ${REVIEW_WRITER_ALLOWED_PROVIDER_HOSTS:-api.openai.com,mineru.net,www.micuapi.ai}
      # Docker Desktop can resolve public hosts through its transparent-proxy
      # fake-IP ranges. Trust only those reserved ranges; ordinary LAN/private
      # destinations remain blocked by the scientific-task egress guard.
      REVIEW_WRITER_TRUSTED_PROXY_NETWORKS: ${REVIEW_WRITER_TRUSTED_PROXY_NETWORKS:-198.18.0.0/15,fdfe:dcba:9876::/48}
      REVIEW_WRITER_HOSTED_WORKSPACE_ROOT: /app/.review-writer/hosted-workspaces
      SCIATLAS_API_BASE_URL: ${SCIATLAS_API_BASE_URL:-}
      SCIATLAS_API_KEY: ${SCIATLAS_API_KEY:-}
      SCIATLAS_TIMEOUT: ${SCIATLAS_TIMEOUT:-240}
      SCIATLAS_ALLOW_INSECURE_HTTP: ${SCIATLAS_ALLOW_INSECURE_HTTP:-false}
    ports:
      - "${REVIEW_WRITER_BIND_ADDRESS:-127.0.0.1}:${REVIEW_WRITER_HTTP_PORT:-8770}:8770"
    volumes:
      - review_state:/app/.review-writer
      - "${REVIEW_WRITER_MIGRATION_REPORTS_DIR:-./migration-reports}:/app/migration-reports:ro"
    restart: unless-stopped

volumes:
  postgres_data:
  review_state:
